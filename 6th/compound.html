<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرارات المركبة في سكراتش | عرض تفاعلي</title>
<!-- خطوط Google (إن لم يتوفر الإنترنت سيُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   🎨 الألوان والهوية البصرية
   ========================================================= */
:root{
  --p:#6d3fd1;   --p2:#8b5cf6;  --pd:#2a1a4f;  --pl:#f1ebff;
  --y:#ffe27a;   --yl:#fff8dc;  --mint:#22b893; --pink:#ff6b9a;
  --bg:#fbf9ff;  --ink:#2a2140; --mute:#6b6385;
  --mono:'JetBrains Mono', Consolas, monospace;
  /* ألوان لبنات سكراتش */
  --evt:#ffbf00; --ctrl:#ffab19; --mot:#4c97ff; --look:#9966ff;
  --sense:#5cb1d6; --op:#59c059; --var:#ff8c1a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);
  background:#e9e2fb;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}

/* ---------- المسرح 16:9 الثابت (يتم تكبيره/تصغيره ليملأ الشاشة) ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(circle at 20% 20%,#efe7ff,#ddd1fa 60%,#cfc0f5)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(#e6defb 1.6px,transparent 1.6px);background-size:34px 34px;
  box-shadow:0 20px 60px rgba(60,30,130,.25)}

/* زخارف الأكواد العائمة */
.deco{position:absolute;font-family:var(--mono);font-weight:700;color:#d9cdfb;pointer-events:none;animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(4deg)}}

/* الشريط العلوي بشكل محرر أكواد */
.topbar{position:absolute;top:0;left:0;right:0;height:66px;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:2px solid #ece4ff;z-index:6}
.tb-right{display:flex;align-items:center;gap:18px}
.dots{display:inline-flex;gap:8px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;display:inline-block;background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.ftab{font-family:var(--mono);font-size:19px;background:var(--pl);color:var(--p);padding:7px 18px;border-radius:12px;direction:ltr}
.stag{background:var(--yl);border:2px solid var(--y);color:#6d5200;padding:7px 20px;border-radius:999px;font-weight:800;font-size:21px;transition:all .3s}
.prog{position:absolute;bottom:-2px;right:0;height:4px;border-radius:4px;background:linear-gradient(270deg,var(--p2),var(--pink));transition:width .5s}

/* ---------- الشرائح والانتقالات ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;animation:inFade .6s both}
.slide.active[data-anim="slide"]{animation-name:inSlide}
.slide.active[data-anim="zoom"]{animation-name:inZoom}
.slide.leaving{visibility:visible;animation:outAll .4s both}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inSlide{from{opacity:0;transform:translateX(calc(var(--d,1) * -90px))}to{opacity:1;transform:none}}
@keyframes inZoom{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes outAll{from{opacity:1}to{opacity:0;transform:scale(.98)}}
.s-inner{position:absolute;inset:94px 70px 98px 70px;display:flex;flex-direction:column}
/* ظهور العناصر بالتتابع */
.slide.active .rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* ---------- عناصر عامة ---------- */
.s-head{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.s-title{font-size:54px;font-weight:900;color:var(--pd);margin:0;line-height:1.2}
.s-title .cm{font-family:var(--mono);color:var(--p2);font-size:.62em;margin-left:14px;vertical-align:middle}
.lead{font-size:29px;color:var(--mute);margin:4px 0 18px;line-height:1.6}
.hl{background:linear-gradient(transparent 55%,var(--y) 55%);padding:0 6px;color:var(--pd);font-weight:900}
.card{background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(80,40,160,.10);border:2px solid #efe8ff;padding:26px}
.btn{font-size:23px;font-weight:800;border:0;border-radius:16px;padding:12px 24px;background:var(--p);color:#fff;
  box-shadow:0 5px 0 #4b25a0;transition:transform .12s,box-shadow .12s,filter .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b25a0}
.btn.y{background:var(--y);color:var(--pd);box-shadow:0 5px 0 #e2bd34}
.btn.g{background:var(--mint);box-shadow:0 5px 0 #168a6d}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 5px 0 #d9ccff;border:2px solid #d9ccff}
.btn.sm{font-size:19px;padding:8px 16px}
.btn.big{font-size:30px;padding:16px 34px}
.btn.sel{background:var(--pd);color:#fff;box-shadow:0 5px 0 #120a26}
.inp{font-family:inherit;font-size:24px;padding:12px 18px;border-radius:14px;border:3px solid #e2d8ff;outline:none;background:#fff;min-width:0}
.inp:focus{border-color:var(--p2)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- نافذة الكود ---------- */
.codewin{background:#241640;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(36,22,64,.35);border:2px solid #3a2766}
.cw-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#1b1032;direction:ltr}
.cw-name{font-family:var(--mono);color:#b9a6ff;font-size:17px}
.cw-body{padding:22px;background-image:radial-gradient(#3a2a63 1.3px,transparent 1.3px);background-size:22px 22px}

/* ---------- لبنات سكراتش (HTML/CSS) ---------- */
.code-stack{display:flex;flex-direction:column;align-items:flex-start}
.blk{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:21px;
  background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);white-space:nowrap;transition:box-shadow .2s,outline .2s}
.blk.hat{border-radius:30px 30px 8px 8px;padding-top:15px}
.k-evt{--c:var(--evt)}.k-ctrl{--c:var(--ctrl)}.k-mot{--c:var(--mot)}.k-look{--c:var(--look)}
.k-sense{--c:var(--sense)}.k-op{--c:var(--op)}.k-var{--c:var(--var)}
.cblk{display:inline-flex;flex-direction:column;align-items:stretch}
.cblk>.ch{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;font-weight:700;font-size:21px;padding:9px 16px;border-radius:8px 8px 8px 0;white-space:nowrap}
.cblk>.ci{border-right:22px solid var(--c);display:flex;flex-direction:column;align-items:flex-start;min-height:30px;padding:2px 0}
.cblk>.cf{background:var(--c);height:20px;border-radius:0 8px 8px 8px;min-width:120px;color:#fff;font-size:15px;padding:0 8px;display:flex;align-items:center}
.pill{unicode-bidi:plaintext;background:#fff;color:#575e75;border-radius:20px;padding:1px 12px;min-width:28px;text-align:center;font-weight:700}
.dd{background:rgba(0,0,0,.16);border-radius:7px;padding:1px 10px}
.rep{background:var(--c);border-radius:20px;padding:2px 12px;border:2px solid rgba(0,0,0,.12)}
.hex{background:var(--c);display:inline-flex;align-items:center;gap:6px;min-width:70px;min-height:32px;justify-content:center;
  padding:3px 22px;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);filter:brightness(.95)}
.gf{width:24px;height:24px;vertical-align:middle}
.blk.on,.cblk.on>.ch{outline:3px solid #fff6a8;box-shadow:0 0 0 6px rgba(255,214,0,.55),0 0 26px rgba(255,214,0,.95)}

/* ---------- منصة سكراتش ---------- */
.scstage{background:#fff;border-radius:20px;border:3px solid #e3dcf7;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(80,40,160,.10)}
.sc-top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid #eee8fb;background:#faf8ff}
.sc-top .stp{width:22px;height:22px;background:#ec5959;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.mons{display:flex;gap:10px;margin-right:auto}
.mon{display:inline-flex;align-items:center;gap:8px;background:#eef0f6;border:1px solid #cdd2de;border-radius:7px;padding:3px 8px;font-size:18px;font-weight:700;color:#444;font-family:var(--mono)}
.mon b{background:var(--var);color:#fff;border-radius:6px;padding:0 10px;min-width:42px;text-align:center}
.mon b.bump{animation:pop .4s}
.bubble{position:absolute;background:#fff;border:3px solid #cfc6e8;border-radius:22px;padding:10px 18px;font-size:23px;font-weight:800;color:var(--pd);
  white-space:nowrap;opacity:0;transform:scale(.6);transition:all .25s;z-index:3}
.bubble.show{opacity:1;transform:scale(1)}

/* ---------- الأسئلة ---------- */
.q-text{font-size:36px;font-weight:900;color:var(--pd);margin-bottom:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{font-size:29px;font-weight:800;padding:20px 22px;border-radius:22px;background:#fff;border:3px solid #e2d8ff;color:var(--ink);
  display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 #e2d8ff;transition:transform .15s,border-color .2s,background .2s;text-align:right}
.opt:hover{border-color:var(--p2);transform:translateY(-3px)}
.opt .oi{font-size:36px}
.opt.right{background:#e3fbf3;border-color:var(--mint);box-shadow:0 6px 0 #9fe6d3}
.opt.wrong{background:#fff0f5;border-color:var(--pink);box-shadow:0 6px 0 #ffc2d6;animation:shake .4s}
.fbk{min-height:54px;font-size:30px;font-weight:900;text-align:center;margin-top:18px}
.fbk.ok{color:#119172;animation:pop .5s}.fbk.no{color:#c4317a}
.fbk small{display:block;font-size:22px;font-weight:600;color:var(--mute);margin-top:4px}

/* ---------- المؤقت ---------- */
.timer{position:relative;width:190px;display:flex;flex-direction:column;align-items:center;gap:10px}
.timer svg{width:150px;height:150px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.tr-bg{stroke:#ece5ff}.tr-fg{stroke:var(--p2);stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer .tm{position:absolute;top:0;height:150px;display:flex;align-items:center;font-family:var(--mono);font-size:36px;font-weight:700;color:var(--pd)}
.timer.warn .tr-fg{stroke:var(--pink)}.timer.warn .tm{color:var(--pink)}
.timer.done{animation:shake .5s}
.timer.big{width:280px}.timer.big svg{width:230px;height:230px}.timer.big .tm{height:230px;font-size:58px}
.t-btns{display:flex;gap:8px}
.tbtn{border:0;border-radius:12px;padding:7px 14px;font-size:18px;font-weight:800;background:var(--pl);color:var(--p)}
.tbtn:hover{background:#e3d7ff}

/* ---------- شريط التحكم ---------- */
#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;direction:ltr;
  background:rgba(36,22,64,.93);padding:8px;border-radius:999px;box-shadow:0 12px 30px rgba(36,22,64,.35);z-index:40;transition:opacity .4s,transform .4s}
#bar.hide,#hint.hide{opacity:0;pointer-events:none}
#bar.hide{transform:translate(-50%,30px)}
#bar button{border:0;border-radius:999px;padding:11px 22px;font-size:19px;font-weight:800;background:rgba(255,255,255,.12);color:#fff;transition:background .2s,transform .15s}
#bar button:hover{background:rgba(255,255,255,.25)}
#bar button:active{transform:scale(.94)}
#bar #clapBtn{background:var(--y);color:var(--pd);font-size:24px;padding:8px 20px}
#bar #clapBtn.bounce{animation:pop .45s}
#count{color:#fff;font-family:var(--mono);font-size:19px;min-width:92px;text-align:center}
#hint{position:fixed;bottom:22px;right:22px;background:rgba(255,255,255,.88);color:var(--mute);font-size:15px;font-weight:700;
  padding:7px 14px;border-radius:12px;z-index:39;transition:opacity .4s;direction:rtl}
#hint kbd{background:var(--pl);color:var(--p);border-radius:6px;padding:0 6px;font-family:var(--mono)}

/* ---------- تأثيرات ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.clapE{position:fixed;bottom:70px;font-size:46px;pointer-events:none;z-index:51;animation:clapUp 1.8s ease-out forwards}
@keyframes clapUp{0%{opacity:0;transform:translateY(0) scale(.4)}15%{opacity:1;transform:translateY(-50px) scale(1.15)}
  100%{opacity:0;transform:translateY(-58vh) rotate(var(--r)) scale(.9)}}
#toast{position:fixed;top:13%;left:50%;transform:translate(-50%,-20px) scale(.9);background:#fff;padding:16px 34px;border-radius:20px;
  font-size:28px;font-weight:900;color:var(--pd);box-shadow:0 16px 40px rgba(60,30,130,.25);opacity:0;transition:all .3s;z-index:45;pointer-events:none;border:3px solid var(--y)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* =========================================================
   تصميم كل نوع شريحة
   ========================================================= */
/* الترحيب */
.wel{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.badge{background:#fff;border:2px solid #e5dcff;color:var(--p);padding:7px 18px;border-radius:999px;font-size:21px;font-weight:800}
.hero{font-size:84px;font-weight:900;line-height:1.15;margin:0 0 18px;
  background:linear-gradient(120deg,var(--pd),var(--p) 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.teacher{display:inline-block;background:var(--yl);border:2px dashed #f2cf55;padding:10px 22px;border-radius:16px;font-size:24px;font-weight:800;color:#6d5200;margin-top:8px}
.wel-code{position:relative}
.typer{font-size:27px;line-height:1.95;min-height:330px;font-weight:700}
.typer .ln{display:flex;gap:18px;white-space:nowrap}
.typer .no{font-family:var(--mono);color:#6e5aa6;width:26px;text-align:left;flex:none}
.typer .ln.ind .tx{padding-right:44px}
.typer .t-evt{color:#ffd44d}.typer .t-ctrl{color:#ffb84d}.typer .t-mot{color:#7fb5ff}.typer .t-var{color:#ffa65c}.typer .t-look{color:#c4a3ff}
.cursor{display:inline-block;width:12px;height:30px;background:#b9a6ff;vertical-align:middle;animation:blink 1s steps(1) infinite;margin-right:4px}
@keyframes blink{50%{opacity:0}}
.mascot{position:absolute;bottom:-30px;left:-30px;font-size:110px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(0,0,0,.15))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}

/* المراجعة: بطاقات قابلة للقلب */
.rev-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:20px}
.flip{perspective:1200px;cursor:pointer}
.flip .fi{position:relative;height:100%;transition:transform .65s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.flipped .fi{transform:rotateY(180deg)}
.ff,.fbk2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;text-align:center}
.ff{background:#241640;background-image:radial-gradient(#3a2a63 1.3px,transparent 1.3px);background-size:20px 20px;box-shadow:0 10px 24px rgba(36,22,64,.25)}
.ff .blk,.ff .cblk>.ch{font-size:19px}
.ff .tap{color:#b9a6ff;font-size:17px;font-weight:700}
.fbk2{background:#fff;transform:rotateY(180deg);border:3px solid var(--p2)}
.fbk2 h4{margin:0;font-size:26px;color:var(--p)}
.fbk2 p{margin:0;font-size:22px;line-height:1.55;font-weight:600}
.flip.pick .ff{box-shadow:0 0 0 6px var(--y),0 0 30px var(--y);animation:pop .6s}
.dice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--yl);border:3px dashed #f2cf55;border-radius:24px;cursor:default}

/* الأهداف */
.obj-list{display:flex;flex-direction:column;gap:20px;margin-top:14px}
.obj{display:flex;align-items:center;gap:24px;background:#fff;border-radius:24px;padding:22px 30px;border:3px solid #eee6ff;cursor:pointer;
  box-shadow:0 8px 22px rgba(80,40,160,.07);transition:all .25s}
.obj:hover{border-color:var(--p2);transform:translateX(-6px)}
.obj-no{font-family:var(--mono);font-size:30px;font-weight:700;color:#cbbcf7}
.obj-ic{font-size:46px}
.obj-t{font-size:32px;font-weight:800;flex:1}
.obj-ck{width:52px;height:52px;border-radius:50%;border:3px dashed #d9ccff;display:flex;align-items:center;justify-content:center;font-size:30px;color:transparent;transition:all .3s}
.obj.done{background:#effcf7;border-color:var(--mint)}
.obj.done .obj-ck{background:var(--mint);border-color:var(--mint);color:#fff;animation:pop .4s}

/* سؤال مفرد */
.mcq-wrap{flex:1;display:grid;grid-template-columns:.8fr 1.2fr;grid-template-rows:auto 1fr;gap:26px 34px;align-items:start}
.scene{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;grid-row:span 2;background:linear-gradient(160deg,#fff,#f5f0ff)}
.scene-ic{font-size:110px;animation:bob 3s ease-in-out infinite}
.scene p{font-size:28px;line-height:1.7;margin:0;font-weight:600}
.reveal-box{grid-column:2;background:var(--pd);color:#fff;border-radius:22px;padding:22px 28px;font-size:27px;line-height:1.7;font-weight:700;
  opacity:0;transform:translateY(20px);transition:all .5s;pointer-events:none}
.reveal-box.show{opacity:1;transform:none}
.reveal-box .hl{color:var(--pd)}

/* العصف الذهني */
.bs{flex:1;display:grid;grid-template-columns:420px 1fr;gap:30px;min-height:0}
.bs-side{display:flex;flex-direction:column;align-items:center;gap:18px}
.bs-center{background:linear-gradient(150deg,var(--p),var(--p2));color:#fff;border-radius:30px;padding:22px;text-align:center;font-size:56px;width:100%;box-shadow:0 14px 30px rgba(109,63,209,.3)}
.bs-center p{font-size:27px;margin:6px 0 0;line-height:1.5;font-weight:700}
.bs-form{display:flex;gap:10px;width:100%}
.bs-form .inp{flex:1;font-size:21px}
.bs-board{background:#fff;border-radius:28px;border:3px dashed #ddd0ff;padding:24px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;position:relative;overflow:hidden}
.bs-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#c9bdf0;font-weight:800}
.note{font-size:24px;font-weight:800;padding:16px 20px;border-radius:6px 22px 22px 22px;max-width:46%;box-shadow:0 8px 16px rgba(0,0,0,.08);
  animation:noteIn .45s cubic-bezier(.2,1.4,.4,1) both;cursor:pointer;line-height:1.45;transform:rotate(var(--rot))}
.note.star{outline:4px solid var(--y)}
@keyframes noteIn{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:rotate(var(--rot))}}

/* المفهوم */
.concept{flex:1;display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:start}
.concept .codewin .blk,.concept .codewin .cblk>.ch{font-size:26px}
.callout{color:#ffe08a;font-size:22px;font-weight:700;margin-top:16px}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.rule>div{border-radius:18px;padding:16px;font-size:24px;font-weight:800;text-align:center}
.r-no{background:#fff0f5;color:#b32a6c;border:2px solid #ffc6d9}.r-yes{background:#e6fbf4;color:#0f8466;border:2px solid #a7ecd8}
.def{font-size:28px;line-height:1.7;margin:0 0 18px;font-weight:600}
.loops{display:flex;flex-direction:column;gap:14px}
.loop{display:flex;align-items:center;gap:20px;background:#fff;border:3px solid #eee6ff;border-radius:22px;padding:14px 18px;cursor:pointer;transition:all .25s}
.loop:hover{border-color:var(--p2)}
.loop .cblk>.ch{font-size:19px}.loop .ci{min-height:16px}.loop .cf{height:14px;min-width:90px}
.loop-q{font-size:24px;font-weight:800;color:var(--p)}
.loop-a{display:none;font-size:24px;font-weight:700;line-height:1.5}
.loop.open .loop-q{display:none}.loop.open .loop-a{display:block;animation:rise .4s both}
.loop.open{border-color:var(--mint);background:#f3fdf9}

/* المحاكيات */
.sim{flex:1;display:grid;grid-template-columns:600px 1fr;gap:34px;min-height:0}
.sim-col{display:flex;flex-direction:column;gap:16px;min-height:0}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:800;color:var(--pd)}
.cond{margin-top:16px;color:#e7dcff;font-size:22px;font-weight:700}
.cond b{padding:2px 12px;border-radius:10px;background:rgba(255,255,255,.1)}
.fl-area{position:relative;height:440px;background:linear-gradient(#cfeaff,#eef8ff 70%)}
.ground{position:absolute;bottom:0;left:0;right:0;height:34px;background:linear-gradient(#7bc96f,#58a84d)}
.pole{position:absolute;left:calc(50% - 6px);top:40px;bottom:30px;width:10px;border-radius:6px;background:linear-gradient(90deg,#9aa3b5,#e9edf5,#9aa3b5)}
.pole-top{position:absolute;left:calc(50% - 15px);top:18px;font-size:28px;line-height:1}
.pole-mark{position:absolute;left:calc(50% - 160px);top:46px;font-size:16px;color:#6a7da0;font-weight:800;border-top:2px dashed #8aa0c5;width:150px;padding-top:2px}
.flagbox{position:absolute;left:calc(50% + 4px);width:150px;height:100px;transition:top .35s ease;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.flagbox svg{width:100%;height:100%;animation:wave 2s ease-in-out infinite;transform-origin:left center}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-3deg)}}
.guess-res{font-size:22px;font-weight:800;min-height:34px}

.cat{position:absolute;font-size:120px;bottom:120px;left:110px;animation:bob 2.6s ease-in-out infinite}
.ask-box{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:10px;background:#fff;border:3px solid #dcd3f3;border-radius:999px;padding:8px;opacity:.45;transition:opacity .3s}
.ask-box.on{opacity:1;border-color:var(--p2);box-shadow:0 0 0 5px rgba(139,92,246,.2)}
.ask-box .inp{flex:1;border:0;border-radius:999px;direction:ltr;text-align:center;font-family:var(--mono)}
.ask-box button{border:0;width:52px;height:52px;border-radius:50%;background:var(--p);color:#fff;font-size:26px}

/* المتاهة */
.maze-wrap{flex:1;display:grid;grid-template-columns:740px 1fr;gap:30px;min-height:0}
.maze-board{position:relative;direction:ltr;display:grid;border-radius:14px;overflow:hidden;border:6px solid #1c1433;box-shadow:0 14px 30px rgba(28,20,51,.3)}
.cell{background:#2f9d58}
.cell.wall{background:#1c1433}
.cell:not(.wall){background-image:linear-gradient(135deg,rgba(255,255,255,.05) 25%,transparent 25%)}
.piece{position:absolute;display:flex;align-items:center;justify-content:center;transition:left .18s ease,top .18s ease;font-size:42px;pointer-events:none}
.hen{z-index:3}.hen span{display:inline-block;transition:transform .15s}
.hen.bump{animation:shake .35s}
.egg.got{transform:scale(0);transition:transform .3s}
.plus1{position:absolute;color:#fff36b;font-weight:900;font-size:30px;z-index:4;animation:plus 1s forwards;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes plus{to{transform:translateY(-60px);opacity:0}}
.maze-board .bubble{font-size:20px}
.tabs{display:flex;gap:8px;margin-bottom:-2px;direction:rtl}
.tab{border:0;border-radius:14px 14px 0 0;padding:9px 18px;font-size:19px;font-weight:800;background:#e4dbfb;color:var(--p)}
.tab.act{background:#241640;color:#fff}
.tiny .blk,.tiny .cblk>.ch{font-size:15px;padding:5px 10px}
.tiny .blk.hat{padding-top:11px}
.tiny .cblk>.ci{border-right-width:14px;min-height:20px}
.tiny .cblk>.cf{height:12px;min-width:80px}
.tiny .hex{min-height:24px;padding:2px 16px}
.tiny .pill,.tiny .dd{padding:0 7px}
.pane[data-p="hen"] .code-stack{transform:scale(.6);transform-origin:top right}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px;direction:ltr}
.pad button{border:0;border-radius:14px;background:#fff;border:3px solid #ddd2fb;font-size:26px;color:var(--p);box-shadow:0 4px 0 #ddd2fb}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad .up{grid-column:2}
.status{font-size:21px;font-weight:800;padding:8px 16px;border-radius:12px;background:var(--pl);color:var(--pd)}
.game-on{font-size:19px;font-weight:800;color:#b32a6c;background:#fff0f5;border-radius:12px;padding:8px 14px;display:none}
.playing .game-on{display:block}

/* العمليات الحسابية */
.ops{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:36px;min-height:0}
.optable{width:100%;border-collapse:separate;border-spacing:0 10px}
.optable th{font-size:24px;color:var(--mute);padding:4px 10px}
.optable td{background:#fff;font-size:30px;font-weight:800;text-align:center;padding:12px;border-top:2px solid #eee6ff;border-bottom:2px solid #eee6ff}
.optable td:first-child{border-right:2px solid #eee6ff;border-radius:0 18px 18px 0}
.optable td:last-child{border-left:2px solid #eee6ff;border-radius:18px 0 0 18px}
.optable .m,.optable .c{font-family:var(--mono);direction:ltr}
.cover{background:var(--p);color:#fff;border-radius:12px;padding:6px 14px;font-size:20px;cursor:pointer;display:inline-block;font-family:'Tajawal'}
.cover:hover{filter:brightness(1.1)}
.c.shown .cover{display:none}
.c .val{display:none;color:var(--op);font-size:34px}
.c.shown .val{display:inline;animation:pop .4s}
.calc{display:flex;flex-direction:column;gap:18px}
.calc-blk{font-size:24px;cursor:pointer}
.calc-in{display:inline-flex;align-items:center;gap:8px;direction:ltr}
.cin{width:84px;border:0;border-radius:20px;text-align:center;font-family:var(--mono);font-size:22px;padding:3px 6px}
.csel{border:0;border-radius:10px;font-size:24px;font-weight:900;padding:2px 6px;background:#fff;color:#2c7a2c;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid #d4f0d4;background:#f2fbf2;color:#2c7a2c;border-radius:12px;padding:6px 14px;font-family:var(--mono);font-size:21px;font-weight:700;direction:ltr}
.chip:hover{background:#ddf5dd}

/* المتغيرات */
.vars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;min-height:0}
.vdemo{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:44px}
.vbox-wrap{display:flex;align-items:center;gap:26px}
.vlabel{font-size:22px;font-weight:800;color:var(--mute);text-align:center}
.vbox{width:230px;height:190px;position:relative;background:linear-gradient(#ffb766,#ff8c1a);border-radius:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 26px rgba(255,140,26,.35),inset 0 -8px 0 rgba(0,0,0,.1)}
.vlid{position:absolute;top:-30px;left:-12px;right:-12px;height:52px;background:#e67400;border-radius:14px;color:#fff;font-family:var(--mono);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;transform-origin:left bottom;transition:transform .3s}
.vbox.open .vlid{transform:rotate(-14deg) translateY(-10px)}
.vval{font-family:var(--mono);font-size:84px;font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.vval.bump{animation:pop .4s}
.vblocks{display:flex;flex-direction:column;gap:12px;align-items:center}
.vblocks .blk{cursor:pointer;font-size:24px}
.vblocks .blk:hover{filter:brightness(1.08);transform:translateY(-2px)}
.vlog{font-family:var(--mono);font-size:22px;color:var(--mute);direction:ltr;min-height:30px}
.rules{display:flex;flex-direction:column;gap:14px}
.rulec{display:flex;gap:16px;align-items:center;background:#fff;border-radius:20px;padding:16px 20px;border:3px solid #eee6ff;cursor:pointer;font-size:25px;font-weight:700;transition:all .25s}
.rulec .rn{width:46px;height:46px;flex:none;border-radius:50%;background:var(--pl);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:900}
.rulec .rt{filter:blur(7px);transition:filter .4s}
.rulec.open{border-color:var(--mint)}.rulec.open .rt{filter:none}.rulec.open .rn{background:var(--mint);color:#fff}
.vex{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.vex .blk{font-size:19px}
.note-en{background:var(--yl);border-radius:16px;padding:12px 18px;font-size:20px;font-weight:700;color:#6d5200;border:2px dashed #f2cf55}

/* فكر زاوج شارك */
.tps{flex:1;display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;min-height:0}
.tps .codewin .blk,.tps .codewin .cblk>.ch{font-size:24px}
.phases{display:flex;gap:10px}
.phase{flex:1;border:3px solid #e2d8ff;background:#fff;border-radius:18px;padding:12px;text-align:center;font-weight:800;font-size:23px;color:var(--pd);transition:all .25s}
.phase small{display:block;font-size:16px;color:var(--mute);font-weight:600}
.phase.act{background:var(--p);color:#fff;border-color:var(--p);transform:translateY(-4px)}
.phase.act small{color:#e5dcff}
.tps-row{display:flex;gap:20px;align-items:center}
.tps .opts{grid-template-columns:repeat(3,1fr)}
.tps .opt{font-family:var(--mono);direction:ltr;justify-content:center;font-size:26px}
.trace{width:100%;border-collapse:collapse;font-size:22px;text-align:center;margin-top:8px}
.trace th{background:var(--pd);color:#fff;padding:8px;font-weight:800}
.trace th:first-child{border-radius:0 12px 0 0}.trace th:last-child{border-radius:12px 0 0 0}
.trace td{background:#fff;padding:7px;border-bottom:2px solid #f0eafd;font-family:var(--mono);font-weight:700}
.trace tr.new td{animation:rise .4s both}
.trace tr.fin td{background:#e3fbf3;color:#0f8466}

/* الاختبار القصير */
.quiz{flex:1;display:flex;flex-direction:column;gap:16px}
.qz-top{display:flex;align-items:center;justify-content:space-between}
.qz-dots{display:flex;gap:10px}
.qz-dots i{width:40px;height:12px;border-radius:8px;background:#e5dcff;transition:all .3s}
.qz-dots i.cur{background:var(--p);width:60px}.qz-dots i.ok{background:var(--mint)}
.qz-score{font-size:26px;font-weight:900;color:var(--pd);background:var(--yl);padding:6px 20px;border-radius:999px;border:2px solid var(--y)}
.qz-body{flex:1;background:#fff;border-radius:28px;padding:30px 36px;border:3px solid #eee6ff}
.qz-body .q-text .qn{font-family:var(--mono);color:var(--p2);margin-left:10px}
.qz-nav{display:flex;justify-content:space-between}

/* صح أم خطأ */
.tf{flex:1;display:flex;flex-direction:column;gap:14px}
.tfi{display:flex;align-items:center;gap:18px;background:#fff;border-radius:22px;padding:14px 22px;border:3px solid #eee6ff;transition:all .3s}
.tfi .tt{flex:1;font-size:27px;font-weight:700}
.tfi .why{display:none;font-size:20px;color:var(--mute);font-weight:600;margin-top:4px}
.tfi.ans .why{display:block}
.tfb{border:0;border-radius:16px;padding:10px 20px;font-size:24px;font-weight:900;transition:transform .15s}
.tfb.t{background:#e3fbf3;color:#0f8466}.tfb.f{background:#fff0f5;color:#b32a6c}
.tfb:hover{transform:scale(1.06)}
.tfi.right{border-color:var(--mint);background:#f3fdf9}
.tfi.wrongA{animation:shake .4s;border-color:var(--pink)}
.tf-res{font-size:42px;width:52px;text-align:center}

/* التحدي */
.chal{flex:1;display:grid;grid-template-columns:300px 1fr 360px;gap:28px;min-height:0;align-items:start}
.ch-left{display:flex;flex-direction:column;align-items:center;gap:14px}
.ch-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ch-card{height:92px;perspective:900px;cursor:pointer}
.ch-card .fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.ch-card.flipped .fi{transform:rotateY(180deg)}
.ch-card .s1,.ch-card .s2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:32px;font-weight:700;direction:ltr}
.ch-card .s1{background:#fff;border:3px solid #e2d8ff;color:var(--pd)}
.ch-card .s2{background:var(--op);color:#fff;transform:rotateY(180deg)}
.teams{display:flex;flex-direction:column;gap:12px}
.team{background:#fff;border-radius:20px;padding:12px 16px;border:3px solid #eee6ff;display:flex;align-items:center;gap:12px;position:relative;transition:all .3s}
.team .ti{font-size:40px}
.team .tn{flex:1;font-size:22px;font-weight:800}
.team .tn .mon{margin-top:4px;font-size:16px}
.team button{border:0;border-radius:10px;width:46px;height:42px;font-size:22px;font-weight:900}
.team .plus{background:var(--var);color:#fff}.team .minus{background:#f1ecfb;color:var(--p)}
.team.lead{border-color:var(--y);background:var(--yl)}
.team.lead::before{content:'👑';position:absolute;top:-22px;left:14px;font-size:32px}
.team-title{font-size:24px;font-weight:900;color:var(--pd);margin-bottom:4px}

/* المراجعة */
.sum{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr auto;gap:20px}
.sumc{background:#fff;border-radius:26px;border:3px solid #eee6ff;padding:24px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:all .3s}
.sumc:hover{border-color:var(--p2);transform:translateY(-4px)}
.sumc .si{font-size:64px}
.sumc h3{margin:0;font-size:30px;color:var(--pd)}
.sumc .sd{font-size:22px;font-weight:600;line-height:1.6;color:var(--mute)}
.sumc .sq{font-size:20px;color:var(--p);font-weight:800}
.sumc .sd{display:none}.sumc.open .sd{display:block;animation:rise .4s both}.sumc.open .sq{display:none}
.sumc.open{border-color:var(--mint);background:#f6fefb}
.exit{grid-column:1/-1;display:flex;align-items:center;gap:24px;background:var(--pd);color:#fff;border-radius:26px;padding:20px 30px}
.exit .eq{font-size:28px;font-weight:800;flex:1}
.exit .ea{display:none;font-size:24px;color:var(--y);font-weight:700;margin-top:6px}
.exit.open .ea{display:block;animation:rise .4s both}

/* الختام */
.closing{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.cl-flag{width:190px}
.cl-flag svg{width:100%;animation:wave 2s ease-in-out infinite;transform-origin:left center}
.closing .hero{font-size:76px}
.closing .codewin .blk,.closing .codewin .cblk>.ch{font-size:26px}
.stars{font-size:40px;letter-spacing:8px}

/* =========================================================
   ➕ إضافات دروس الوحدة (القرارات • الإحداثيات • الألعاب)
   ========================================================= */
:root{--snd:#cf63cf;--pen:#0fbd8c}
.mon b{direction:ltr;unicode-bidi:isolate}
.k-snd{--c:var(--snd)}.k-pen{--c:var(--pen)}
.typer .t-sense{color:#8fd3f0}.typer .t-op{color:#8be08b}.typer .t-snd{color:#f0a3f0}.typer .t-pen{color:#6fe3bd}
/* لبنة إذا… وإلا */
.cblk>.ch.mid{border-radius:8px 0 0 8px}
.cblk>.ci.lit{background:rgba(255,226,122,.16);box-shadow:inset -4px 0 0 #fff6a8}
/* حجم متوسط للّبنات */
.code-stack.mid .blk,.code-stack.mid .cblk>.ch{font-size:18px;padding:7px 13px}
.code-stack.mid .blk.hat{padding-top:12px}
.code-stack.mid .cblk>.ci{border-right-width:16px;min-height:22px}
.code-stack.mid .cblk>.cf{height:14px;min-width:90px}
.code-stack.mid .hex{min-height:26px;padding:2px 18px}
.code-stack.mid .pill,.code-stack.mid .dd{padding:0 8px}
.tiny .cblk>.ch.mid{font-size:15px;padding:5px 10px}
/* محاكي إذا/وإلا العام */
.is-bub{white-space:normal;max-width:360px;line-height:1.5}
.slide-ifSim .sim-col,.slide-turnSim .sim-col{gap:12px}
.slide-ifSim .note-en,.slide-turnSim .note-en{font-size:19px;padding:9px 16px}
/* ترتيب الخطوات */
.ord{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;min-height:0;align-items:start}
.ord-list{display:flex;flex-direction:column;gap:12px}
.ord-it{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #e2d8ff;border-radius:18px;padding:7px 16px;font-size:25px;font-weight:800;cursor:pointer;
  transition:all .2s;box-shadow:0 5px 0 #e2d8ff}
.ord-it:hover{border-color:var(--p2);transform:translateY(-2px)}
.ord-n{width:46px;height:46px;flex:none;border-radius:50%;border:3px dashed #d9ccff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:var(--p)}
.ord-it.picked{background:var(--pl);border-color:var(--p2)}
.ord-it.picked .ord-n{background:var(--p);color:#fff;border:3px solid var(--p)}
.ord-it.ok{background:#e3fbf3;border-color:var(--mint);box-shadow:0 5px 0 #9fe6d3}
.ord-it.ok .ord-n{background:var(--mint);border-color:var(--mint)}
.ord-it.bad{border-color:var(--pink);animation:shake .4s}
.ord-side{display:flex;flex-direction:column;gap:16px}
.ord-side .reveal-box{font-size:24px}
.ord-it .blk{font-size:19px}
/* التوصيل */
.mt{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.mt-col{display:flex;flex-direction:column;gap:14px}
.mt-h{font-size:22px;font-weight:900;color:var(--mute)}
.mt-it{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #e2d8ff;border-radius:20px;padding:10px 18px;min-height:76px;font-size:24px;font-weight:800;cursor:pointer;transition:all .2s}
.mt-it:hover{border-color:var(--p2)}
.mt-it.sel{border-color:var(--p);box-shadow:0 0 0 5px rgba(139,92,246,.25);transform:translateX(-6px)}
.mt-it.done{border-color:var(--mint);background:#f3fdf9;cursor:default;transform:none;box-shadow:none}
.mt-it.bad{animation:shake .4s;border-color:var(--pink)}
.mt-tag{width:44px;height:44px;flex:none;border-radius:50%;background:var(--pl);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:900}
.mt-it.done .mt-tag{background:var(--mint);color:#fff}
.mt-it .blk{font-size:19px}.mt-it .hex{font-size:19px;color:#fff}
/* الخطوات */
.stx-wrap{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;min-height:0;align-items:start}
.stx-list{display:flex;flex-direction:column;gap:12px}
.stx{display:flex;align-items:center;gap:18px;background:#fff;border-radius:20px;padding:13px 20px;border:3px solid #eee6ff;font-size:25px;font-weight:700;
  opacity:.35;filter:grayscale(1);transition:all .35s;cursor:pointer;line-height:1.45}
.stx.show{opacity:1;filter:none;border-color:var(--p2);box-shadow:0 8px 20px rgba(80,40,160,.08)}
.stx-n{width:46px;height:46px;flex:none;border-radius:50%;background:var(--pl);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:900}
.stx.show .stx-n{background:var(--p);color:#fff}
.stx-side{display:flex;flex-direction:column;gap:16px}


/* ---------- الدرس الخامس: القرارات المركبة ---------- */
.tt-wrap{flex:1;display:grid;grid-template-columns:.95fr 1.05fr;gap:34px;min-height:0;align-items:start}
.tt-sw{display:flex;gap:16px}
.sw{flex:1;border:3px solid #ffc6d9;background:#fff0f5;border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;transition:all .25s;box-shadow:0 6px 0 #ffc6d9}

}

/* ==========================================================================
   🔊 الأصوات (Web Audio API — بدون ملفات خارجية)
   ========================================================================== */
let AC, NOISE;
function ac(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(c){
  if(NOISE) return NOISE;
  NOISE = c.createBuffer(1, c.sampleRate*0.4, c.sampleRate);
  const d = NOISE.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return NOISE;
}
function tone(c, f, t, dur, type='sine', vol=.25){
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
  return o;
}
const sfx = {
  /* صوت تصفيق: نبضات ضوضاء قصيرة متتالية تشبه تصفيق مجموعة */
  clap(){
    const c=ac(), t0=c.currentTime+.02, buf=noise(c), N=22;
    for(let i=0;i<N;i++){
      for(let layer=0; layer<2; layer++){
        const t = t0 + i*0.062 + Math.random()*0.045;
        const src=c.createBufferSource(); src.buffer=buf;
        const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900+Math.random()*1700; bp.Q.value=.9;
        const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
        const g=c.createGain(); const v=(0.55 - i/N*0.35)*(layer?0.6:1);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.003); g.gain.exponentialRampToValueAtTime(.001,t+.08+Math.random()*.05);
        src.connect(bp).connect(hp).connect(g).connect(c.destination);
        src.start(t, Math.random()*.2); src.stop(t+.2);
      }
    }
  },
  success(){ const c=ac(), t=c.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(c,f,t+i*.09,.35,'triangle',.22)); },
  wrong(){ const c=ac(), t=c.currentTime; const o=tone(c,330,t,.35,'sine',.2); o.frequency.exponentialRampToValueAtTime(200,t+.3); },
  ding(){ const c=ac(), t=c.currentTime; tone(c,880,t,.8,'sine',.25); tone(c,1320,t+.15,.9,'sine',.18); },
  tick(){ const c=ac(); tone(c,1200,c.currentTime,.06,'square',.05); },
  pop(){ const c=ac(), t=c.currentTime; const o=tone(c,520,t,.12,'sine',.15); o.frequency.exponentialRampToValueAtTime(900,t+.1); },
  step(){ const c=ac(); tone(c,700,c.currentTime,.05,'triangle',.06); }
};

function clap(){
  sfx.clap();

  for(let i=0;i<16;i++){
    const e=document.createElement('span'); e.className='clapE'; e.textContent='👏';
    e.style.left=(25+Math.random()*50)+'vw'; e.style.setProperty('--r',(Math.random()*80-40)+'deg');
    e.style.animationDelay=(Math.random()*.45)+'s'; e.style.fontSize=(32+Math.random()*26)+'px';
    document.body.appendChild(e); setTimeout(()=>e.remove(),2400);
  }
}
const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], fxOn=false;
function sizeFx(){ const d=devicePixelRatio||1; fx.width=innerWidth*d; fx.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0); }
function confetti(x,y,n=80,power=1){
  const cols=['#8b5cf6','#ffe27a','#ff6b9a','#22b893','#4c97ff','#ffab19'];
  for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*15*power,vy:(-Math.random()*13-4)*power,s:6+Math.random()*7,
    c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.35,life:0,sh:Math.random()<.5});
  if(!fxOn){ fxOn=true; requestAnimationFrame(drawFx); }
}
function drawFx(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-p.life/200);
    if(p.sh) ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else {ctx.beginPath();ctx.arc(0,0,p.s/2.6,0,7);ctx.fill();}
    ctx.restore(); });
  parts=parts.filter(p=>p.y<innerHeight+30 && p.life<200);
  if(parts.length) requestAnimationFrame(drawFx); else { fxOn=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function confettiAt(el,n=70){ const r=el.getBoundingClientRect(); confetti(r.left+r.width/2, r.top+r.height/2, n); }
function bigConfetti(){ [.2,.4,.6,.8].forEach((x,i)=>setTimeout(()=>confetti(innerWidth*x, innerHeight*.35, 70, 1.15), i*120)); }
let toastT;
function toast(html){ const t=$('#toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }

const timerHTML = (sec, big=false) => `<div class="timer ${big?'big':''} rv" data-sec="${sec}">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="tr-bg"/><circle cx="50" cy="50" r="44" class="tr-fg"/></svg>
  <div class="tm">${fmt(sec)}</div>
  <div class="t-btns"><button class="tbtn t-start">▶ ابدئي</button><button class="tbtn t-reset">↺</button></div></div>`;
function makeTimer(node){
  const C=276.46, fg=$('.tr-fg',node), tm=$('.tm',node), sb=$('.t-start',node);
  let total=+node.dataset.sec||60, left=total, iv=null;
  const draw=()=>{ tm.textContent=fmt(Math.max(left,0)); fg.style.strokeDashoffset=C*(1-left/total); node.classList.toggle('warn', left<=10 && left>0); };
  const stop=()=>{ clearInterval(iv); iv=null; sb.textContent='▶ ابدئي'; };
  const start=()=>{ if(iv) return; if(left<=0){ left=total; node.classList.remove('done'); }
    iv=setInterval(()=>{ left--; draw(); if(left<=10 && left>0) sfx.tick();
      if(left<=0){ stop(); node.classList.add('done'); sfx.ding(); toast('⏰ انتهى الوقت!'); } },1000);
    sb.textContent='⏸ إيقاف'; };
  sb.onclick=()=> iv?stop():start();
  $('.t-reset',node).onclick=()=>{ stop(); left=total; node.classList.remove('done'); draw(); };
  node._t={ set(s){ stop(); total=left=Math.max(1,s); node.classList.remove('done'); draw(); }, start, stop };
  draw();
}

}

    const upd=()=>{ const mx=Math.max(...pts); teams.forEach((t,i)=>{ const b=$('.mon b',t); b.textContent=pts[i]; t.classList.toggle('lead', mx>0 && pts[i]===mx); }); };
    teams.forEach((t,i)=>{
      $('.plus',t).onclick=()=>{ pts[i]++; upd(); const b=$('.mon b',t); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); sfx.success(); confettiAt(t,30); };
      $('.minus',t).onclick=()=>{ if(pts[i]>0){ pts[i]--; upd(); sfx.pop(); } };
    });

});

/* ==========================================================================
   ➕ أدوات إضافية لدروس الوحدة
   ========================================================================== */
const T = v => typeof v === 'function' ? v() : (v == null ? '' : v);
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
/* شكل سداسي (شرط) يحتوي HTML جاهزًا — للشروط المركبة */
const hx = (k, inner) => `<span class="hex k-${k}">${inner}</span>`;
/* لبنة إذا ( ) وإلا */
const ieblk = (cond, a, b, ex='') =>
  `<div class="cblk k-ctrl" ${ex}><div class="ch">${B('إذا '+cond)}</div><div class="ci" data-br="then">${a}</div><div class="ch mid">وإلا</div><div class="ci" data-br="else">${b}</div><div class="cf"></div></div>`;
/* إضاءة الفرع المنفَّذ (إذا / وإلا) */
const lit = (root, br) => $$('[data-br]', root).forEach(n => n.classList.toggle('lit', n.dataset.br === br));
const bump = n => { n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); };
const sayIn = (bub, t) => { bub.classList.remove('show'); void bub.offsetWidth; bub.textContent = t; bub.classList.add('show'); };

/* ---------- محاكي «اسأل ثم قرّر» (إذا / إذا وإلا) ---------- */
R.ifSim = s => {
  let tok=0, resolver=null;
  const say = t => `قل (${t}) لمدة (2) ثانية`;
  const cond = T(s.cond);
  const ifCode = s.elseSay != null
    ? ieblk(cond, blk('look', say(s.thenSay), 'data-b="then"'), blk('look', say(s.elseSay), 'data-b="else"'), 'data-b="if"')
    : cblk('ctrl', 'إذا ' + cond, blk('look', say(s.thenSay), 'data-b="then"'), 'data-b="if"');
  const code = hat() + s.inputs.map((p,i) => blk('sense', `اسأل (${p.ask}) وانتظر`, `data-b="ask${i}"`) +
    (p.var ? blk('var', `اجعل [${p.var}] مساويًا {s:الإجابة}`, `data-b="set${i}"`) : '')).join('') + ifCode;
  const vars = s.inputs.filter(p => p.var);
  const mons = vars.length ? vars.map(p => `<span class="mon">${p.var} <b class="mv" data-v="${p.var}">—</b></span>`).join('')
                           : `<span class="mon">الإجابة <b class="mv" style="background:var(--sense)">—</b></span>`;
  return {
    html:`${head(s)}<div class="sim">
      <div class="scstage rv" style="height:560px">
        <div class="sc-top">${GF}<span class="stp"></span><span class="mons">${mons}</span></div>
        <div style="position:relative;height:500px;background:linear-gradient(#f7f3ff,#fff)">
          <div class="cat">${s.sprite||'🐱'}</div><div class="bubble is-bub" style="left:190px;top:90px"></div>
          <form class="ask-box"><input class="inp is-in" placeholder="…" autocomplete="off" disabled><button type="submit">✓</button></form>
        </div>
      </div>
      <div class="sim-col">
        <div class="rv">${codeWin(`<div class="code-stack mid">${code}</div><div class="cond">${s.condLabel||'هل الشرط صحيح؟'} <b class="cond-v">—</b></div>`, s.file)}</div>
        <div class="ctrl-row rv"><button class="btn g run">${GF} تشغيل</button><button class="btn ghost rst">↺ إعادة</button>
          ${s.chips?`<span style="margin-right:10px">إجابات سريعة:</span><span class="chips">${s.chips.map(c=>`<button class="chip">${c}</button>`).join('')}</span>`:''}</div>
        ${s.note?`<div class="note-en rv">${s.note}</div>`:''}
      </div></div>`,
    init(el){
      const bub=$('.is-bub',el), inp=$('.is-in',el), box=$('.ask-box',el), cv=$('.cond-v',el), mv=$$('.mv',el);
      const ask=q=>{ sayIn(bub,q); inp.disabled=false; box.classList.add('on'); inp.focus(); return new Promise(r=>resolver=r); };
      const give=v=>{ if(resolver){ const r=resolver; resolver=null; r(v); } };
      box.onsubmit=e=>{ e.preventDefault(); const v=inp.value.trim(); if(v){ inp.value=''; give(v); } };
      $$('.chip',el).forEach(c=> c.onclick=()=>{ if(resolver) give(c.textContent.trim()); else toast('اضغطي «تشغيل» أولًا 🏁'); });
      const reset=()=>{ tok++; resolver=null; hi(el,''); lit(el,''); bub.classList.remove('show'); inp.disabled=true; inp.value='';
        box.classList.remove('on'); mv.forEach(m=>m.textContent='—'); cv.textContent='—'; cv.style.color=''; };
      $('.rst',el).onclick=reset;
      $('.run',el).onclick=async()=>{
        reset(); const my=tok, vals=[];
        hi(el,'hat'); await sleep(400); if(my!==tok) return;
        for(let i=0;i<s.inputs.length;i++){
          const p=s.inputs[i]; hi(el,'ask'+i);
          const a=await ask(p.ask); if(my!==tok) return;
          inp.disabled=true; box.classList.remove('on'); vals.push(a);
          const m = p.var ? mv.find(x=>x.dataset.v===p.var) : mv[0];
          if(p.var) hi(el,'set'+i);
          if(m){ m.textContent=a; bump(m); }
          await sleep(550); if(my!==tok) return;
        }
        inp.blur(); hi(el,'if');
        const nums=vals.map(v=>{ const n=Number(v); return v!=='' && !isNaN(n) ? n : v; });
        let ok=false; try{ ok=!!s.test(...nums); }catch(e){}
        cv.textContent = ok ? 'صح ✅ ← ننفّذ لبنات «إذا»' : (s.elseSay!=null ? 'خطأ ❌ ← ننفّذ لبنات «وإلا»' : 'خطأ ❌ ← نتخطّى اللبنة');
        cv.style.color = ok ? '#7df0c8' : '#ffb3cd';
        await sleep(800); if(my!==tok) return;
        if(ok){ lit(el,'then'); hi(el,'then'); sayIn(bub,s.thenSay); sfx.success(); confettiAt($('.cat',el),50); }
        else if(s.elseSay!=null){ lit(el,'else'); hi(el,'else'); sayIn(bub,s.elseSay); sfx.pop(); }
        else { hi(el,''); toast('الشرط خطأ… فلم يقل الكائن شيئًا 🤫'); }
      };
    },
    leave(){ tok++; resolver=null; }
  };
};

/* ---------- رتّبي الخطوات ---------- */
R.order = s => {
  const items = s.items.map((t,i)=>({t,i}));
  let mix = shuffle(items); while(mix.every((o,k)=>o.i===k) && items.length>1) mix = shuffle(items);
  return {
    html:`${head(s)}<div class="ord">
      <div class="ord-list">${mix.map(o=>`<div class="ord-it rv" data-i="${o.i}"><span class="ord-n"></span><div class="ord-t">${T(o.t)}</div></div>`).join('')}
        <div class="ctrl-row rv" style="margin-top:6px"><button class="btn g ordChk">✔ تحقّقي</button><button class="btn ghost ordRst">↺ إعادة</button><button class="btn y sm ordSol">👀 الحل</button></div></div>
      <div class="ord-side">${T(s.side)}<div class="reveal-box ord-rev">${T(s.reveal)}</div></div></div>`,
    init(el){
      let seq=[]; const its=$$('.ord-it',el);
      const draw=()=>its.forEach(n=>{ const k=seq.indexOf(+n.dataset.i); n.classList.toggle('picked',k>=0); n.classList.remove('ok','bad'); $('.ord-n',n).textContent=k>=0?k+1:''; });
      its.forEach(n=> n.onclick=()=>{ const i=+n.dataset.i, k=seq.indexOf(i); if(k>=0) seq.splice(k,1); else seq.push(i); draw(); sfx.pop(); });
      const done=()=>{ $('.ord-rev',el).classList.add('show'); sfx.success(); bigConfetti(); };
      $('.ordChk',el).onclick=()=>{
        if(seq.length<items.length){ toast('رتّبي كل الخطوات أولًا 🔢'); return; }
        let all=true;
        its.forEach(n=>{ const i=+n.dataset.i, k=seq.indexOf(i), good=k===i; n.classList.toggle('ok',good); if(!good){ all=false; n.classList.remove('bad'); void n.offsetWidth; n.classList.add('bad'); } });
        if(all) done(); else { sfx.wrong(); toast('بعض الخطوات في غير مكانها… حاولي مرة أخرى 💜'); }
      };
      $('.ordRst',el).onclick=()=>{ seq=[]; draw(); $('.ord-rev',el).classList.remove('show'); };
      $('.ordSol',el).onclick=()=>{ seq=items.map(o=>o.i); draw(); its.forEach(n=>n.classList.add('ok')); $('.ord-rev',el).classList.add('show'); };
      s.init && s.init(el);
    }
  };
};

/* ---------- صِلي (توصيل) ---------- */
R.match = s => {
  const right = s.right.map((r,j)=>({...r,j}));
  return {
    html:`${head(s)}<div class="mt">
      <div class="mt-col"><div class="mt-h rv">${s.lh||'① اختاري من هنا'}</div>${s.left.map((t,i)=>`<div class="mt-it rv" data-l="${i}"><span class="mt-tag">${i+1}</span><div>${T(t)}</div></div>`).join('')}</div>
      <div class="mt-col"><div class="mt-h rv">${s.rh||'② ثم صِليه بما يناسبه هنا'}</div>${right.map(r=>`<div class="mt-it rv" data-r="${r.j}"><span class="mt-tag">؟</span><div>${T(r.t)}</div></div>`).join('')}</div></div>`,
    init(el){
      let sel=null; const L=$$('[data-l]',el), Rr=$$('[data-r]',el);
      L.forEach(n=> n.onclick=()=>{ if(n.classList.contains('done')) return; L.forEach(x=>x.classList.remove('sel')); n.classList.add('sel'); sel=+n.dataset.l; sfx.pop(); });
      Rr.forEach(n=> n.onclick=()=>{

          sfx.success(); confettiAt(n,30);
          if(L.every(x=>x.classList.contains('done'))) setTimeout(()=>{ clap(); toast('🎉 أحسنتِ! وصّلتِ الكل'); },400);
        } else { n.classList.remove('bad'); void n.offsetWidth; n.classList.add('bad'); sfx.wrong(); }
      });
    }
  };
};

/* ---------- محاكي القطة: و / أو / ليس ---------- */
R.logicCat = s => {
  let iv=null, op='and', ang=0, hue=0, held={up:false,sp:false}, root, cat, ku=null;
  const up='‹مفتاح [السهم العلوي] مضغوط؟›', sp='‹مفتاح [المسافة] مضغوط؟›';
  const conds={ and:()=>hx('op',up+' و '+sp), or:()=>hx('op',up+' أو '+sp), not:()=>hx('op','ليس '+up) };
  const exp={ and:'تستدير القطة <b>فقط</b> إذا ضغطتِ المفتاحين <b>معًا</b> ⬆️ + ␣',
              or:'تستدير القطة إذا ضغطتِ <b>أحد</b> المفتاحين (أو كليهما)',
              not:'تستدير القطة <b>طالما لم</b> تضغطي السهم العلوي، وعند ضغطه تتغير ألوانها' };
  const code=()=>`<div class="code-stack mid">${hat('')}${cblk('ctrl','كرّر باستمرار', ieblk(conds[op](), blk('mot','استدر ↻ (20) درجة','data-b="rot"'), blk('look','غيّر مؤثر [اللون] بمقدار (25)','data-b="col"')))}</div>`;
  const setKey=(k,v)=>{ held[k]=v; const b=$(`.key[data-k="${k}"]`,root); b && b.classList.toggle('down',v); };
  const tick=()=>{
    const c= op==='and' ? held.up&&held.sp : op==='or' ? held.up||held.sp : !held.up;
    if(c){ ang+=20; hi(root,'rot'); lit(root,'then'); } else { hue=(hue+45)%360; hi(root,'col'); lit(root,'else'); }
    cat.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`; cat.style.filter=`hue-rotate(${hue}deg)`;
    const v=$('.lc-v',root); v.textContent = c?'صح ✅ ← تستدير':'خطأ ❌ ← يتغير اللون'; v.style.color=c?'#7df0c8':'#ffb3cd';
  };
  const stop=()=>{ clearInterval(iv); iv=null; gameMode=false; root && root.classList.remove('playing'); setKey('up',false); setKey('sp',false); };
  const start=()=>{ if(iv) return; gameMode=true; root.classList.add('playing'); iv=setInterval(tick,140); };
  const setOp=o=>{ op=o; $$('.ops3 .btn',root).forEach(b=>b.classList.toggle('sel',b.dataset.o===o)); $('.lc-code',root).innerHTML=code(); $('.lc-exp',root).innerHTML=exp[o]; sfx.pop(); };
  return {
    html:`${head(s)}<div class="sim">
      <div class="scstage rv" style="height:560px">
        <div class="sc-top">${GF}<span class="stp"></span><span class="mons"><span class="mon">الشرط <b class="lc-v2" style="background:var(--op);min-width:60px">${'—'}</b></span></span></div>
        <div style="position:relative;height:500px;background:linear-gradient(#f7f3ff,#fff)"><div class="lc-cat">🐱</div></div>
      </div>
      <div class="sim-col">
        <div class="ops3 rv">المعامل: <button class="btn sm ghost" data-o="and">و</button><button class="btn sm ghost" data-o="or">أو</button><button class="btn sm ghost" data-o="not">ليس</button></div>
        <div class="rv">${codeWin(`<div class="lc-code"></div><div class="cond">نتيجة الشرط: <b class="lc-v">—</b></div>`, s.file)}</div>
        <div class="lc-exp rv"></div>
        <div class="ctrl-row rv"><button class="btn g run">${GF} تشغيل</button><button class="btn ghost stopB">⏹ إيقاف</button>
          <span class="keys"><button class="key" data-k="up">⬆️ السهم العلوي</button><button class="key" data-k="sp">␣ المسافة</button></span></div>
        <span class="game-on">⌨️ اضغطي مع الاستمرار على المفاتيح في لوحة المفاتيح أو على الأزرار • Esc للإيقاف</span>
      </div></div>`,
    init(el){
      root=el; cat=$('.lc-cat',el);
      $$('.ops3 .btn',el).forEach(b=> b.onclick=()=>setOp(b.dataset.o));
      $('.run',el).onclick=()=>{ start(); toast('⌨️ اضغطي مع الاستمرار على ⬆️ و/أو المسافة'); };
      $('.stopB',el).onclick=()=>{ stop(); hi(el,''); lit(el,''); };
      $$('.key',el).forEach(b=>{
        const k=b.dataset.k;
        b.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!iv) start(); setKey(k,true); });
        ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)));
      });
      setOp('and');
      // نسخة صغيرة من النتيجة في أعلى المنصة
      const v=$('.lc-v',el), v2=$('.lc-v2',el); new MutationObserver(()=>{ v2.textContent=v.textContent.startsWith('صح')?'صح':'خطأ'; }).observe(v,{childList:true});
    },
    enter(){
      gameKeyHandler=e=>{
        if(!iv) return false;
        if(e.key==='ArrowUp'){ setKey('up',true); return true; }
        if(e.code==='Space'||e.key===' '){ setKey('sp',true); return true; }
        if(e.key==='Escape'){ stop(); return true; }
        return false;
      };
      ku=e=>{ if(e.key==='ArrowUp') setKey('up',false); if(e.code==='Space'||e.key===' ') setKey('sp',false); };
      document.addEventListener('keyup',ku);
    },
    leave(){ stop(); gameKeyHandler=null; if(ku) document.removeEventListener('keyup',ku); }
  };
};

/* ---------- لبنات الانتظار ---------- */
R.waitSim = s => {
  let tokA=0, iv=null, root, cat, x=120, mouse={x:-999,y:-999}, cos=1;
  const W=600;
  const place=()=>{ cat.style.left=x+'px'; cat.textContent=cos===1?'🐱':'🐈'; cat.style.transform=`translate(-50%,-50%)${cos===2?' scaleX(-1)':''}`; };
  const stopB=()=>{ clearInterval(iv); iv=null; };
  return {
    html:`${head(s)}<div class="ws">
      <div class="scstage rv"><div class="sc-top">${GF}<span class="stp"></span><span class="mons"><span class="mon">المظهر <b class="m-cos" style="background:var(--look);min-width:110px">costume1</b></span></span></div>
        <div class="ws-area"><div class="ws-cat">🐱</div><div class="bubble is-bub" style="left:40px;top:40px"></div></div></div>
      <div class="sim-col">
        <div class="ws-cols rv">
          <div><div class="ws-h">⏳ انتظر ( ) ثانية</div>${codeWin(`<div class="code-stack mid">${hat('data-b="ah"')}${blk('look','قل (سأنتظر ثانية…)','data-b="a1"')}${blk('ctrl','انتظر (1) ثانية','data-b="a2"')}${blk('look','قل (انتهى الانتظار!)','data-b="a3"')}</div><div class="ws-bar"><i></i></div>`,'wait.sb3')}
            <div class="ctrl-row" style="margin-top:12px"><button class="btn g sm runA">${GF} تشغيل</button></div></div>
          <div><div class="ws-h">🖱️ انتظر حتى ( )</div>${codeWin(`<div class="code-stack mid">${hat('data-b="bh"')}${cblk('ctrl','كرّر باستمرار', blk('ctrl','انتظر حتى ‹ملامس لـ [مؤشر الفأرة] ؟›','data-b="bw"')+blk('look','غيّر المظهر إلى [costume2]','data-b="bc"')+blk('mot','تحرك (30) خطوة','data-b="bm"'))}</div>`,'wait_until.sb3')}
            <div class="ctrl-row" style="margin-top:12px"><button class="btn g sm runB">${GF} تشغيل</button><button class="btn ghost sm rst">↺ إعادة</button></div></div>
        </div>
        <div class="shape-note rv">
          <div>${blk('ctrl','انتظر (1) ثانية')}<span>مربع <b>بيضاوي</b> ⬭ لأن المُدخل <b>قيمة</b> (عدد الثواني).</span></div>
          <div>${blk('ctrl','انتظر حتى ‹ ›')}<span>مربع <b>سداسي</b> ⬡ لأن المُدخل <b>شرط</b> فقط.</span></div>
        </div>
      </div></div>`,
    init(el){
      root=el; cat=$('.ws-cat',el); const area=$('.ws-area',el), bub=$('.bubble',el), bar=$('.ws-bar i',el), mc=$('.m-cos',el);
      place();
      area.addEventListener('pointermove',e=>{ const r=area.getBoundingClientRect(), k=r.width/W; mouse={x:(e.clientX-r.left)/k, y:(e.clientY-r.top)/k}; });
      area.addEventListener('pointerleave',()=>{ mouse={x:-999,y:-999}; });
      $('.runA',el).onclick=async()=>{
        const my=++tokA; hi(el,'ah'); await sleep(300); if(my!==tokA) return;
        hi(el,'a1'); sayIn(bub,'سأنتظر ثانية… ⏳'); await sleep(500); if(my!==tokA) return;
        hi(el,'a2'); bar.style.transition='none'; bar.style.width='0'; void bar.offsetWidth; bar.style.transition='width 1s linear'; bar.style.width='100%'; await sleep(1000); if(my!==tokA) return;
        hi(el,'a3'); sayIn(bub,'انتهى الانتظار! ✅'); sfx.success(); bar.style.transition='none'; bar.style.width='0';
      };
      $('.runB',el).onclick=()=>{
        if(iv) return; bub.classList.remove('show'); hi(el,'bw'); toast('🖱️ حرّكي مؤشر الفأرة فوق القطة');
        iv=setInterval(()=>{
          const touch=Math.hypot(mouse.x-x, mouse.y-230)<55;
          if(!touch){ hi(el,'bw'); return; }
          cos=2; mc.textContent='costume2'; hi(el,'bc'); place();
          setTimeout(()=>{ if(!iv) return; hi(el,'bm'); const nx=Math.min(W-50,x+36); if(nx===x) toast('وصلت القطة إلى الحافة 🧱 اضغطي ↺ إعادة'); x=nx; place(); sfx.step(); },120);
        },380);
      };
      $('.rst',el).onclick=()=>{ stopB(); tokA++; x=120; cos=1; mc.textContent='costume1'; place(); hi(el,''); bub.classList.remove('show'); };
    },
    leave(){ stopB(); tokA++; }
  };
};


/* ==========================================================================
   🚀 محرك العرض: بناء الشرائح + التنقل
   ========================================================================== */
const stage=$('#stage'), slidesEl=$('#slides');
const built = CONFIG.slides.map((s,i)=>{
  const r=(R[s.type]||R.objectives)(s);
  const sec=document.createElement('section');
  sec.className='slide slide-'+s.type; sec.dataset.anim=s.anim||'slide';
  sec.innerHTML=`<div class="s-inner">${r.html}</div>`;
  slidesEl.appendChild(sec);
  $$('.rv',sec).forEach((n,k)=>n.style.setProperty('--i',Math.min(k,12)));
  $$('.timer',sec).forEach(makeTimer);
  r.init && r.init(sec);
  return {sec,r,s};
});
let cur=-1;
function go(i){
  if(i<0 || i>=built.length || i===cur) return;
  const dir = i>cur ? 1 : -1;
  if(cur>=0){
    const old=built[cur];
    old.r.leave && old.r.leave(old.sec);
    $$('.timer',old.sec).forEach(t=>t._t.stop());
    old.sec.classList.remove('active'); old.sec.classList.add('leaving');
    setTimeout(()=>old.sec.classList.remove('leaving'),420);
  }
  gameMode=false;
  stage.style.setProperty('--d',dir);
  cur=i; const now=built[i];
  now.sec.classList.add('active');
  now.r.enter && now.r.enter(now.sec);
  $('#count').textContent=`${i+1} / ${built.length}`;
  $('#stag').textContent=now.s.tag||'';
  $('#ftab').textContent=now.s.file||CONFIG.fileName;
  $('#prog').style.width=((i+1)/built.length*100)+'%';
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
}
const next=()=>go(cur+1), prev=()=>go(cur-1);

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown',e=>{
  if(gameMode && gameKeyHandler && gameKeyHandler(e)){ e.preventDefault(); return; }
  const t=e.target, typing=['INPUT','TEXTAREA','SELECT'].includes(t.tagName)||t.isContentEditable;
  if(typing){ if(e.key==='Escape') t.blur(); return; }
  if(e.key==='ArrowRight' || e.key===' ' || e.code==='Space' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='ArrowUp' || e.key==='ArrowDown'){ e.preventDefault(); }
  else if(e.key==='Home'){ e.preventDefault(); go(0); }
  else if(e.key==='End'){ e.preventDefault(); go(built.length-1); }
  else if(e.key==='ت' || e.code==='KeyJ'){ e.preventDefault(); clap(); }
  else if(e.code==='KeyF'){ toggleFS(); }
});
/* إزالة التركيز عن الأزرار بعد الضغط حتى لا تتعارض مع Space */
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setTimeout(()=>b.blur(),0); });
/* منع التمرير بعجلة الماوس (إلا داخل قائمة الطالبات) */
window.addEventListener('wheel',e=>{ if(!e.target.closest('.scroll')) e.preventDefault(); },{passive:false});

/* ---------- الأزرار ---------- */
$('#nextBtn').onclick=next; $('#prevBtn').onclick=prev; $('#clapBtn').onclick=clap;
Roster.drawButton($('#clapBtn'));
function toggleFS(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
$('#fsBtn').onclick=toggleFS;

/* ---------- إخفاء شريط التحكم تلقائيًا ---------- */
let idleT;
function wake(){
  $('#bar').classList.remove('hide'); $('#hint').classList.remove('hide');
  clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!$('#bar').matches(':hover')){ $('#bar').classList.add('hide'); $('#hint').classList.add('hide'); } },2600);
}
['mousemove','mousedown','touchstart'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));

/* ---------- ملاءمة المسرح للشاشة (16:9 ثابت) ---------- */
function fit(){
  const sc=Math.min(innerWidth/1600, innerHeight/900);
  stage.style.transform=`translate(-50%,-50%) scale(${sc})`;
  sizeFx();
}
addEventListener('resize',fit);
fit(); go(0); wake();
</script>
