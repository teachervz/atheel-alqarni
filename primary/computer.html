<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم الحاسب العجيب | درس إثرائي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   🎨 الألوان — غيّري القيم هنا لتغيير ألوان العرض كله
   ===================================================================== */
:root{
  --ink:#22305E; --muted:#5F6B99;
  --blue:#3B82F6; --blue-d:#2459C9; --blue-l:#DBEAFE;        /* الإدخال */
  --orange:#FF8A3D; --orange-d:#D9661C; --orange-l:#FFE8D6;  /* الإخراج */
  --grape:#8B5CF6; --grape-d:#6A3FD6; --grape-l:#EDE7FF;     /* المعالجة */
  --yellow:#FFC93C; --yellow-d:#D9A520; --yellow-l:#FFF4CC;
  --mint:#22B8A0; --mint-d:#16917E; --mint-l:#D5F7EF;
  --coral:#FF6B6B; --coral-l:#FFE1E1; --pink:#FF7EB6;
  --shadow:0 24px 50px -24px rgba(34,48,94,.45);
  --shadow-s:0 12px 26px -14px rgba(34,48,94,.4);
  --fh:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;
  --fb:'Tajawal','Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#cfe8ff;font-family:var(--fb);color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.hidden{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
body.idle{cursor:none}

/* ---------- المسرح 1920×1080 يتكبّر ليملأ أي شاشة ---------- */
#viewport{position:fixed;inset:0;background:linear-gradient(180deg,#bfe3ff,#e8f5ff)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:linear-gradient(180deg,#DCEFFF 0%,#F2FAFF 58%,#FFF4E0 100%)}
.cloud{position:absolute;left:0;height:56px;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46%;height:150%;left:16%;bottom:30%}
.cloud::after{width:34%;height:120%;right:14%;bottom:34%}
@keyframes drift{from{transform:translateX(2050px)}to{transform:translateX(-500px)}}
.hill{position:absolute;bottom:-260px;border-radius:50%;z-index:0}

/* ---------- الشرائح ---------- */
.slide{position:absolute;inset:0;padding:60px 100px 140px;display:flex;flex-direction:column;z-index:2;
  opacity:0;visibility:hidden;transform:translateX(-80px);transition:opacity .5s,transform .5s,visibility .5s}
.slide.back{transform:translateX(80px)}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide .rv{opacity:0}
.slide.active .rv{animation:rvIn .6s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i,0) * 90ms + 150ms)}
@keyframes rvIn{from{opacity:0;translate:0 34px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.hd{display:flex;align-items:center;gap:22px;flex-wrap:wrap;flex-shrink:0}
.tag{background:#fff;border-radius:999px;padding:8px 26px;font:800 26px var(--fh);color:var(--grape);box-shadow:var(--shadow-s)}
.t{font:800 62px/1.25 var(--fh);color:var(--ink)}
.t em{font-style:normal;color:var(--blue)}
.t .o{color:var(--orange)}
.sub{font:700 32px/1.5 var(--fb);color:var(--muted);margin-top:4px}
.grow{flex:1;min-height:0}

/* ---------- الأزرار ---------- */
.btn{font:800 34px var(--fh);background:var(--blue);color:#fff;border-radius:999px;padding:12px 40px;
  box-shadow:0 9px 0 var(--blue-d),var(--shadow-s);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(6px);box-shadow:0 3px 0 var(--blue-d)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 9px 0 var(--yellow-d),var(--shadow-s)}
.btn.o{background:var(--orange);box-shadow:0 9px 0 var(--orange-d),var(--shadow-s)}
.btn.m{background:var(--mint);box-shadow:0 9px 0 var(--mint-d),var(--shadow-s)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 9px 0 #cfd8ea,var(--shadow-s)}
.btn.big{font-size:46px;padding:18px 64px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- حاسوبي (الشخصية) + فقاعة الكلام ---------- */
.bot svg{width:100%;height:auto;display:block;overflow:visible}
.bot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bot .arm-r{transform-box:view-box;transform-origin:182px 104px;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-22deg)}}
.bot .ant{animation:antb 1.6s ease-in-out infinite}
@keyframes antb{50%{fill:#FF7EB6}}
.bot .mouth{transform-box:fill-box;transform-origin:center}
body.talking .bot .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(1.7)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{translate:0 -14px}}
.guide{display:flex;align-items:flex-end;gap:18px}
.guide .bot{width:160px;flex-shrink:0}
.bubble{position:relative;background:#fff;border-radius:30px;padding:16px 26px;font:700 30px/1.5 var(--fb);box-shadow:var(--shadow);
  display:flex;gap:16px;align-items:center;margin-bottom:40px}
.bubble::after{content:"";position:absolute;right:-24px;bottom:26px;border:14px solid transparent;border-left:16px solid #fff}
.spk{width:64px;height:64px;border-radius:50%;background:var(--yellow-l);font-size:32px;flex-shrink:0;transition:transform .15s;box-shadow:inset 0 0 0 3px #FFE38A}
.spk:active{transform:scale(.9)}
body.talking .spk.now{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 3px #FFE38A,0 0 0 10px rgba(255,201,60,.35)}}

/* ---------- عام: البطاقات والتغذية الراجعة ---------- */
.card{background:#fff;border-radius:34px;box-shadow:var(--shadow)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-14px 0}40%,80%{translate:14px 0}}
.pop{animation:popA .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popA{0%{scale:.6}100%{scale:1}}
.fb{min-height:52px;font:800 32px var(--fh);text-align:center;transition:opacity .3s}
.fb.ok{color:var(--mint-d)} .fb.no{color:var(--coral)}

/* =====================================================================
   1) الغلاف
   ===================================================================== */
.cover{flex:1;display:grid;grid-template-columns:600px 1fr;align-items:center;gap:60px;padding-top:20px}
.cover .bot{width:560px;justify-self:center}
.cv-txt{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.cv-txt h1{font:800 132px/1.05 var(--fh);color:var(--ink)}
.cv-txt h1 em{font-style:normal;color:var(--blue);display:inline-block;animation:bob 2.6s ease-in-out infinite}
.cv-txt p{font:700 40px/1.5 var(--fb);color:var(--muted)}
.cv-txt p b{color:var(--grape)}
.cv-meta{font:700 26px var(--fb);color:var(--muted);background:rgba(255,255,255,.7);padding:8px 22px;border-radius:999px}
.floaty{position:absolute;font-size:84px;animation:bob 3.4s ease-in-out infinite;z-index:1;filter:drop-shadow(0 10px 10px rgba(34,48,94,.15))}

/* =====================================================================
   3) صندوق الألغاز
   ===================================================================== */
.mys{flex:1;display:grid;grid-template-columns:1fr 640px;gap:60px;align-items:center;margin-top:10px}
.clues{display:flex;flex-direction:column;gap:22px}
.clue{display:flex;align-items:center;gap:22px;min-height:118px;padding:16px 30px;border-radius:30px;background:#fff;box-shadow:var(--shadow);text-align:right;
  font:800 38px/1.4 var(--fh);border:4px dashed var(--grape-l);transition:background .3s,border-color .3s}
.clue .n{width:76px;height:76px;border-radius:50%;background:var(--grape-l);color:var(--grape);display:grid;place-items:center;font-size:42px;flex-shrink:0}
.clue .q{color:#B9B2D8}
.clue.open{border-style:solid;border-color:var(--grape);background:var(--grape-l)}
.clue.open .n{background:var(--grape);color:#fff}
.boxw{position:relative;height:620px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:26px}
.gift{position:relative;width:400px;height:300px}
.gift .base{position:absolute;inset:70px 0 0;background:linear-gradient(135deg,#FF7EB6,#FF5C8A);border-radius:22px;box-shadow:var(--shadow)}
.gift .lid{position:absolute;left:-20px;right:-20px;top:30px;height:70px;background:linear-gradient(135deg,#FF9AC6,#FF6B9E);border-radius:18px;transition:transform .8s cubic-bezier(.3,1.4,.5,1);z-index:3}
.gift .rib-v{position:absolute;left:50%;width:56px;margin-left:-28px;top:70px;bottom:0;background:var(--yellow)}
.gift .lid::before{content:"";position:absolute;left:50%;width:56px;margin-left:-28px;top:0;bottom:0;background:var(--yellow)}
.gift .bow{position:absolute;left:50%;top:-22px;font-size:76px;transform:translateX(-50%)}
.gift .qm{position:absolute;inset:70px 0 0;display:grid;place-items:center;font:800 150px var(--fh);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.12);z-index:2}
.boxw.open .lid{transform:translate(-160px,-260px) rotate(-38deg)}
.boxw.open .qm{opacity:0}
.boxw .bot{position:absolute;width:330px;left:50%;bottom:220px;margin-left:-165px;opacity:0;transform:translateY(160px) scale(.4);transition:all .8s cubic-bezier(.2,1.5,.4,1) .25s;z-index:1}
.boxw.open .bot{opacity:1;transform:none}
.boxw .reveal{position:absolute;top:-10px;font:800 54px var(--fh);color:var(--grape);opacity:0;transition:opacity .4s .9s;white-space:nowrap}
.boxw.open .reveal{opacity:1}

/* =====================================================================
   4) أجزاء الحاسب (مشهد تفاعلي)
   ===================================================================== */
.parts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 470px;gap:36px;margin-top:16px}
.scene{background:linear-gradient(180deg,#fff 0%,#F4F8FF 100%);border-radius:40px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.scene svg{width:100%;height:100%;display:block}
.part{cursor:pointer;transition:filter .3s}
.part:hover{filter:drop-shadow(0 0 10px rgba(255,201,60,.9))}
.part.on{filter:drop-shadow(0 0 16px rgba(255,170,0,1)) drop-shadow(0 0 6px rgba(255,170,0,1))}
.pinfo{display:flex;flex-direction:column;gap:20px}
.pcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:26px}
.pcard .ic{font-size:120px;line-height:1}
.pcard b{font:800 50px var(--fh);color:var(--blue)}
.pcard p{font:700 32px/1.5 var(--fb)}
.pcard .hint{font:700 32px/1.5 var(--fb);color:var(--muted)}
.found{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.found span{width:62px;height:62px;border-radius:18px;background:#fff;box-shadow:var(--shadow-s);display:grid;place-items:center;font-size:34px;filter:grayscale(1);opacity:.35;transition:all .4s}
.found span.ok{filter:none;opacity:1;background:var(--yellow-l)}

/* =====================================================================
   5) فوائد الحاسب (بطاقات تنقلب)
   ===================================================================== */
.uses{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:28px;margin-top:22px}
.flip{perspective:1400px;min-height:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:34px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;box-shadow:var(--shadow);text-align:center}
.face.f{background:#fff}
.face.f .ic{font-size:104px;line-height:1.1}
.face.f b{font:800 40px var(--fh)}
.face.f small{font:700 22px var(--fb);color:var(--muted)}
.face.b{transform:rotateY(180deg);background:var(--c);color:#fff}
.face.b .ic{font-size:70px}
.face.b p{font:800 36px/1.45 var(--fh)}

/* =====================================================================
   6) 👍 أم 👎
   ===================================================================== */
.thumbs{flex:1;display:grid;grid-template-columns:330px 1fr;gap:50px;align-items:center}
.thumbs .bot{width:300px}
.tq{display:flex;flex-direction:column;align-items:center;gap:30px}
.tq-card{width:100%;min-height:240px;display:grid;place-items:center;padding:30px 50px;text-align:center;font:800 56px/1.4 var(--fh)}
.tq-btns{display:flex;gap:40px}
.tb{width:290px;height:150px;border-radius:40px;font:800 46px var(--fh);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px;transition:transform .1s}
.tb span{font-size:76px}
.tb.t{background:var(--mint);box-shadow:0 10px 0 var(--mint-d),var(--shadow-s)}
.tb.f{background:var(--coral);box-shadow:0 10px 0 #D94848,var(--shadow-s)}
.tb:active{transform:translateY(6px)}
.tb:disabled{opacity:.5}
.dots{display:flex;gap:14px}
.dots i{width:26px;height:26px;border-radius:50%;background:#D7DEEF}
.dots i.ok{background:var(--mint)} .dots i.now{background:var(--yellow);scale:1.25}

/* =====================================================================
   7) الحاسب يشبهنا (توصيل)
   ===================================================================== */
.like{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;margin-top:10px}
.mt{position:relative;flex:1;display:grid;grid-template-columns:1fr 260px 1fr;align-items:stretch}
.mt-col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;z-index:2}
.mt-h{font:800 38px var(--fh);text-align:center;color:var(--muted)}
.mi{display:flex;align-items:center;gap:20px;background:#fff;border-radius:30px;padding:10px 26px;box-shadow:var(--shadow-s);font:800 38px var(--fh);border:4px solid transparent;transition:all .25s;min-height:104px}
.mi span{font-size:64px}
.mi.sel{border-color:var(--yellow);background:var(--yellow-l);scale:1.04}
.mi.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);cursor:default}
.mi small{display:block;font:700 22px var(--fb);color:var(--muted)}
.mt svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.mt svg line{stroke-width:10;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawL .6s forwards}
@keyframes drawL{to{stroke-dashoffset:0}}
.mt-mid{display:grid;place-items:center;font-size:110px;opacity:.9}
.stages{display:flex;justify-content:center;gap:18px;align-items:center;flex-shrink:0;min-height:96px}
.stg{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:10px 30px;font:800 32px var(--fh);box-shadow:var(--shadow-s);border:4px solid var(--c)}
.stg i{font-style:normal;font-size:40px}
.arr{font:800 46px var(--fh);color:var(--muted)}

/* =====================================================================
   8) كيف يعمل الحاسب؟ (إدخال ← معالجة ← إخراج)
   ===================================================================== */
.flow{flex:1;min-height:0;display:flex;flex-direction:column;gap:26px;margin-top:20px}
.fl-row{flex:1;display:grid;grid-template-columns:1fr 150px 1fr 150px 1fr;align-items:center}
.st{height:100%;max-height:440px;border-radius:40px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;border:6px solid transparent;transition:border-color .3s,scale .3s;position:relative}
.st h3{font:800 44px var(--fh);color:var(--c)}
.st small{font:700 26px var(--fb);color:var(--muted)}
.st .dev{font-size:120px;line-height:1;height:140px;display:grid;place-items:center}
.st.lit{border-color:var(--c);scale:1.05}
.st .res{position:absolute;top:-40px;left:50%;translate:-50% 0;background:var(--c);color:#fff;font:800 40px var(--fh);padding:8px 30px;border-radius:999px;white-space:nowrap;opacity:0;scale:.5;transition:all .45s cubic-bezier(.2,1.6,.4,1)}
.st.lit .res.show{opacity:1;scale:1}
.gear{width:150px;height:150px}
.st.lit .gear{animation:spin 1s linear infinite}
@keyframes spin{to{rotate:360deg}}
.pipe{position:relative;height:22px;background:#E2E8F5;border-radius:999px;margin:0 10px;overflow:visible}
.pipe::after{content:"";position:absolute;left:-14px;top:50%;translate:0 -50%;border:20px solid transparent;border-right:24px solid #E2E8F5}
.pipe .tok{position:absolute;top:50%;right:0;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 8px rgba(255,201,60,.35);opacity:0}
.pipe.go .tok{animation:tok .7s ease-in-out forwards}
@keyframes tok{0%{right:0;opacity:1}100%{right:calc(100% - 46px);opacity:1}}
.ex{display:flex;justify-content:center;gap:24px;flex-shrink:0}
.ex .btn{font-size:32px}

/* =====================================================================
   9) الحاسب السحري (جرّبي بنفسكِ)
   ===================================================================== */
.play{flex:1;min-height:0;display:grid;grid-template-columns:1fr 430px;gap:34px;margin-top:14px}
.pcw{display:flex;flex-direction:column;gap:16px;min-height:0}
.mon{position:relative;flex:1;min-height:0;background:#2B3A67;border-radius:30px;padding:18px;box-shadow:var(--shadow);transition:box-shadow .3s}
.mon .scr{position:relative;width:100%;height:100%;border-radius:18px;background:#fff;overflow:hidden;display:grid;place-items:center}
.mon .txt{font:800 110px/1.2 var(--fh);color:var(--ink);text-align:center;padding:0 30px;word-break:break-word}
.mon .txt:empty::before{content:"اضغطي على الحروف ⌨️";font-size:48px;color:#B9C2DA}
.mon canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.lbl{position:absolute;top:-20px;font:800 24px var(--fh);color:#fff;padding:4px 18px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:3}
.lbl.in{background:var(--blue)} .lbl.out{background:var(--orange)}
.lbl.show{opacity:1}
.mon .lbl{right:30px}
.kb{position:relative;background:#E7ECF7;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-s);flex-shrink:0}
.kb .row{display:flex;gap:9px;justify-content:center}
.key{width:76px;height:64px;border-radius:14px;background:#fff;font:800 36px var(--fh);box-shadow:0 5px 0 #C3CCE0;transition:transform .08s}
.key:active,.key.hit{transform:translateY(4px);box-shadow:0 1px 0 #C3CCE0;background:var(--yellow-l)}
.key.w{width:360px;font-size:26px} .key.m{width:130px;font-size:26px}
.kb .lbl{left:30px}
.side{display:flex;flex-direction:column;gap:18px}
.modes{display:flex;gap:12px}
.modes button{flex:1;height:92px;border-radius:26px;background:#fff;font:800 32px var(--fh);box-shadow:var(--shadow-s);border:4px solid transparent}
.modes button.on{border-color:var(--blue);background:var(--blue-l)}
.colors{display:flex;gap:12px;justify-content:center}
.colors button{width:58px;height:58px;border-radius:50%;background:var(--c);box-shadow:var(--shadow-s);border:5px solid #fff}
.colors button.on{outline:5px solid var(--ink)}
.outb{display:flex;gap:12px}
.outb .btn{flex:1;padding:12px 10px;font-size:32px}
.printer{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.paper{width:230px;height:0;background:#fff;border-radius:8px 8px 0 0;box-shadow:var(--shadow-s);overflow:hidden;transition:height 1.2s ease-out;display:grid;place-items:center;font:800 48px var(--fh);word-break:break-word;text-align:center;padding:0 10px}
.paper img{width:100%;height:100%;object-fit:contain}
.paper.out{height:200px}
.pr-body{width:330px;height:110px;background:#4A5A8C;border-radius:24px;position:relative;box-shadow:var(--shadow);display:grid;place-items:center;font-size:60px}
.pr-body::before{content:"";position:absolute;top:18px;left:40px;right:40px;height:12px;border-radius:6px;background:#2B3A67}
.printer .lbl{right:10px;top:auto;bottom:120px}

/* =====================================================================
   10–11) أجهزة الإدخال والإخراج
   ===================================================================== */
.dv-top{display:flex;align-items:center;gap:26px;margin-top:14px;flex-shrink:0}
.mini{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 30px;box-shadow:var(--shadow-s);font:800 34px var(--fh)}
.mini i{font-style:normal;font-size:50px}
.mini .ar{color:var(--c);font-size:44px;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{translate:-12px 0}}
.devs{flex:1;display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-content:center;margin-top:16px}

.dv b{display:block;font:800 42px var(--fh);color:var(--ink)}

.dv.on{border-color:var(--c)}
.dv.on p{opacity:1;color:var(--ink)}
.dv.on .ic{animation:wig .6s}
@keyframes wig{25%{rotate:-10deg}75%{rotate:10deg}}

/* =====================================================================
   12) ساعدي حاسوبي يرتّب أجهزته
   ===================================================================== */
.sort{flex:1;min-height:0;display:grid;grid-template-columns:1fr 520px 1fr;gap:40px;align-items:stretch;margin-top:20px}

.bask h3 small{display:block;font:700 26px var(--fb);color:var(--muted);text-align:center}
.bask .in{flex:1;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start}
.bask .in span{width:96px;height:96px;border-radius:24px;background:#fff;display:grid;place-items:center;font-size:60px;box-shadow:var(--shadow-s);animation:popA .45s cubic-bezier(.2,1.6,.4,1)}
.bask .in span svg{width:64px}
.bask.hot{background:color-mix(in srgb,var(--c) 26%,#fff);scale:1.03}
.sort-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.item{width:400px;height:380px;border-radius:44px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;cursor:grab;position:relative;z-index:5}
.item .ic{font-size:170px;line-height:1.1}
.item .ic svg{width:170px}
.item b{font:800 46px var(--fh)}
.item.drag{cursor:grabbing;transition:none;box-shadow:0 40px 60px -20px rgba(34,48,94,.5)}
.item.fly{transition:transform .35s ease-in,opacity .35s;opacity:0}
.sort-mid .left{font:800 30px var(--fh);color:var(--muted)}

/* =====================================================================
   13) من أنا؟
   ===================================================================== */
.rid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:22px}
.rid .face.f{justify-content:space-between;padding:34px 24px}
.rid .face.f .q{font:800 34px/1.5 var(--fh)}
.rid .face.f .qi{font-size:90px}
.rid .face.b .ic{font-size:150px}
.rid .face.b b{font:800 46px var(--fh)}
.rid .spk{position:relative;z-index:2}

   14) البطلة الذكية (العادات الصحيحة)

.rules{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;margin-top:22px;align-content:center}
.rp{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;border-radius:40px;background:rgba(255,255,255,.55);border:4px dashed #CFD8EA}
.rc{position:relative;height:200px;border-radius:30px;background:#fff;box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px;text-align:center;font:800 27px/1.35 var(--fh);border:5px solid transparent;transition:all .3s}
.rc i{font-style:normal;font-size:70px;line-height:1.1}
.rc.ok{border-color:var(--mint);background:var(--mint-l)}
.rc.ok::after{content:"✔";position:absolute;top:-16px;left:-12px;width:54px;height:54px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:30px}
.rc.dim{opacity:.35;filter:grayscale(1)}

.quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}

.qb .ic{font-size:130px;line-height:1.1}

   ===================================================================== */
.sum{flex:1;display:flex;flex-direction:column;gap:30px;margin-top:20px}

.sum-c .ics svg{width:66px;vertical-align:middle}
.sum-ar{text-align:center;font:800 70px var(--fh);color:var(--muted)}

#stars{position:absolute;top:26px;left:34px;z-index:30;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 26px 8px 18px;box-shadow:var(--shadow-s);font:800 40px var(--fh);color:var(--yellow-d)}

  border-radius:999px;padding:8px 12px;box-shadow:0 10px 30px rgba(34,48,94,.2);transition:opacity .4s,transform .4s}
body.idle #controls{opacity:0;transform:translate(-50%,30px)}
.nav{display:flex;align-items:center;gap:10px}
.cbtn{height:52px;min-width:52px;padding:0 20px;border-radius:999px;background:#EEF2FB;font:800 20px var(--fh);color:var(--ink);transition:background .2s}
.cbtn:hover{background:var(--blue-l)}
.cbtn.primary{background:var(--blue);color:#fff}
.cbtn.icon{padding:0;width:52px;font-size:24px}
.cbtn.clap{background:var(--yellow-l)}
.cbtn.on{background:var(--mint);color:#fff}
.cbtn:disabled{opacity:.4}
#counter{font:800 22px var(--fh);min-width:76px;text-align:center}
.sep{width:2px;height:30px;background:#E2E8F5}
#progress{position:fixed;top:0;left:0;right:0;height:7px;z-index:50;background:rgba(255,255,255,.5)}
#progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink));transition:width .5s;margin-right:0}
#toast{position:fixed;left:50%;top:40px;transform:translate(-50%,-30px);z-index:60;background:var(--ink);color:#fff;font:800 24px var(--fh);padding:12px 30px;border-radius:999px;opacity:0;transition:all .35s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
#fx{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}

@keyframes clapUp{to{transform:translate(var(--dx),-115vh) rotate(var(--r));opacity:0}}

/* ---------- 🔇 بدون أصوات: يوقف صوت حاسوبي والمؤثرات كلها (زر 🔈 في الشريط) ---------- */
let MUTED = false;
try { MUTED = localStorage.getItem('pc-mute') === '1'; } catch (e) {}

/* ---------- الأصوات (بدون ملفات) ---------- */
const Sound = (() => {
  let ctx, out, nb;
  const ac = () => { if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); out = ctx.createGain(); out.gain.value = .9; out.connect(ctx.destination); } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(f, s, d, type = 'sine', v = .2) {
    if (MUTED) return;
    const c = ac(), t = c.currentTime + s, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(out); o.start(t); o.stop(t + d + .05);
  }
  function noise() { const c = ac(); if (!nb) { nb = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return nb; }
  function clap1(t, v, f) {
    if (MUTED) return;
    const c = ac(), s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(), len = .06 + Math.random() * .05;
    s.buffer = noise(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 1.1;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .003); g.gain.exponentialRampToValueAtTime(.0008, t + len);
    s.connect(bp).connect(g).connect(out); s.start(t, Math.random() * .8, len + .02);
  }
  return {
    ac,
    pop() { tone(880, 0, .12, 'triangle', .15); tone(1320, .05, .12, 'triangle', .1); },
    ok() { [660, 880, 1175].forEach((f, i) => tone(f, i * .08, .25, 'triangle', .18)); },
    no() { tone(330, 0, .2, 'sine', .18); tone(247, .15, .3, 'sine', .18); },
    flip() { tone(620, 0, .08, 'triangle', .08); },
    star() { [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, i * .06, .3, 'sine', .12)); },
    key() { tone(1200 + Math.random() * 300, 0, .05, 'square', .04); },
    tune() { [523, 659, 784, 659, 523, 784].forEach((f, i) => tone(f, i * .18, .3, 'triangle', .16)); },
    whir() { [200, 260, 320, 380].forEach((f, i) => tone(f, i * .12, .2, 'sawtooth', .04)); },
    applause() {
      const c = ac(), now = c.currentTime + .02, dur = 1.9;
      for (let p = 0; p < 11; p++) {
        let t = now + Math.random() * .12; const rate = .12 + Math.random() * .07, f = 1000 + Math.random() * 1600;
        while (t < now + dur) { const fade = Math.max(.05, 1 - Math.pow((t - now) / dur, 2)); clap1(t, (.22 + Math.random() * .22) * fade, f); t += rate * (.85 + Math.random() * .3); }
      }
    }
  };
})();

/* ---------- 🔊 حاسوبي يتكلّم ----------
   • أولًا: ملفات صوت ElevenLabs الجاهزة (صوت نورة) في مجلد audio/
   • إن لم يوجد ملف للنص (مثل الاسم الذي تكتبه الطالبة) يُقرأ بصوت المتصفح العربي
   ⚠️ إذا غيّرتِ نص say في الإعدادات فلن يجد له ملفًا، وسيُقرأ بصوت المتصفح حتى تُعاد توليد الأصوات */
const Voice = (() => {
  const ok = 'speechSynthesis' in window, CLIPS = window.VOICE_CLIPS || {};
  let voice = null, warned = false, btn = null, audio = null;
  const pick = () => { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /^ar[-_]SA/i.test(v.lang)) || vs.find(v => /^ar/i.test(v.lang)) || null; };
  if (ok) { pick(); speechSynthesis.onvoiceschanged = pick; }
  const clean = t => String(t).replace(/<[^>]+>/g, ' ').replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, ' ').replace(/\s+/g, ' ').trim();
  const done = () => { document.body.classList.remove('talking'); btn && btn.classList.remove('now'); };
  function stop() { if (audio) { audio.onended = audio.onerror = null; audio.pause(); audio = null; } if (ok) speechSynthesis.cancel(); done(); }
  function say(text, from) {
    stop(); const t = clean(text); if (!t) return;
    if (MUTED) { if (from) toast('🔇 الأصوات متوقفة — اضغطي 🔈 لتشغيلها'); return; }
    if (CLIPS[t]) {
      const a = audio = new Audio('audio/' + CLIPS[t]);
      btn = from || null; btn && btn.classList.add('now');
      a.onplaying = () => document.body.classList.add('talking');
      a.onended = () => { if (audio === a) { audio = null; done(); } };
      a.onerror = () => { if (audio === a) { audio = null; done(); speak(t, from); } };
      a.play().catch(() => { if (audio === a) { audio = null; done(); speak(t, from); } });
      return;
    }
    speak(t, from);
  }
  function speak(t, from) {
    if (!ok) { if (!warned) { warned = true; toast('هذا المتصفح لا يدعم القراءة بالصوت 🔇'); } return; }
    if (!voice && speechSynthesis.getVoices().length && !warned) { warned = true; toast('لا يوجد صوت عربي في هذا الجهاز 🔇 جرّبي متصفح Edge أو Chrome'); }
    const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; if (voice) u.voice = voice; u.rate = .88; u.pitch = 1.15;
    btn = from || null; btn && btn.classList.add('now');
    u.onstart = () => document.body.classList.add('talking');
    u.onend = u.onerror = () => { document.body.classList.remove('talking'); btn && btn.classList.remove('now'); };
    speechSynthesis.speak(u);
  }
  return { say, stop };
})();
const say = (t, b) => Voice.say(t, b);

/* ---------- الكونفيتي والتصفيق ---------- */
const Confetti = (() => {
  const cv = $('#confetti'), g = cv.getContext('2d'); let parts = [], raf = null;
  const colors = ['#3B82F6', '#FF8A3D', '#FFC93C', '#22B8A0', '#FF7EB6', '#8B5CF6'];
  function fire(n = 150) {
    cv.width = innerWidth; cv.height = innerHeight;
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .45, vx: (Math.random() - .5) * 22, vy: -Math.random() * 20 - 6,
      w: 8 + Math.random() * 8, h: 10 + Math.random() * 12, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[i % colors.length], life: 0 });
    if (!raf) loop();
  }
  function loop() {
    g.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.vy += .55; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - p.life / 140); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    parts = parts.filter(p => p.y < cv.height + 40 && p.life < 140);
    raf = parts.length ? requestAnimationFrame(loop) : (g.clearRect(0, 0, cv.width, cv.height), null);
  }
  return { fire };
})();
const confetti = n => Confetti.fire(n);
function clap() {
  Sound.applause(); const fx = $('#fx');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span'); s.className = 'clap-pop'; s.textContent = '👏';
    s.style.left = (8 + Math.random() * 84) + '%'; s.style.fontSize = (28 + Math.random() * 46) + 'px';
    s.style.setProperty('--d', (1.6 + Math.random() * 1.3) + 's'); s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
    s.style.animationDelay = (Math.random() * .5) + 's'; fx.appendChild(s); setTimeout(() => s.remove(), 3600);
  }
}

  },

  sort(s, el) {
    el.innerHTML = head(s) + `<div class="sort">
      <div class="bask rv" data-k="in" style="--c:var(--blue)"><h3>⬅️ إدخال<small>تُدخِل إلى الحاسب</small></h3><div class="in"></div></div>
      <div class="sort-mid"><div class="item rv"></div><div class="left rv"></div><div class="fb rv"></div><button class="btn w hidden" data-again>🔄 العبي من جديد</button></div>
      <div class="bask rv" data-k="out" style="--c:var(--orange)"><h3>➡️ إخراج<small>تُخرِج لنا النتيجة</small></h3><div class="in"></div></div></div>`;
    const item = $('.item', el), fb = $('.fb', el), left = $('.left', el), bask = $$('.bask', el);
    let queue = shuffle(s.items), cur = null, busy = false;
    function next() {
      busy = false; item.classList.remove('fly'); item.style.transform = ''; fb.textContent = ''; fb.className = 'fb';
      cur = queue.shift();
      if (!cur) { item.classList.add('hidden'); left.textContent = ''; fb.className = 'fb ok'; fb.textContent = '🏆 أحسنتِ! رتّبتِ كل الأجهزة'; confetti(200); say('أحسنتِ! رتّبتِ كل الأجهزة'); $('[data-again]', el).classList.remove('hidden'); return; }
      item.innerHTML = `<span class="ic">${cur.ic}</span><b>${cur.name}</b>`; popEl(item); left.textContent = `بقي ${queue.length + 1} أجهزة`;
    }
    function drop(k) {
      if (busy || !cur) return;
      const b = bask.find(x => x.dataset.k === k);
      if (k !== cur.k) {
        shake(item); Sound.no(); item.style.transform = ''; fb.className = 'fb no';
        fb.textContent = cur.k === 'in' ? `🤔 ${cur.name} تُدخِل إلى الحاسب` : `🤔 ${cur.name} تُخرِج لنا النتيجة`; say(fb.textContent); return;
      }
      busy = true; Sound.ok(); $('.in', b).insertAdjacentHTML('beforeend', `<span>${cur.ic}</span>`); popEl(b);
      fb.className = 'fb ok'; fb.textContent = '🎉 صحيح!'; say(cur.name + (k === 'in' ? ' جهاز إدخال' : ' جهاز إخراج'));
      const br = b.getBoundingClientRect(), ir = item.getBoundingClientRect(), z = el.getBoundingClientRect().width / el.offsetWidth;
      item.classList.add('fly'); item.style.transform = `translate(${(br.left + br.width / 2 - ir.left - ir.width / 2) / z}px,${(br.top + br.height / 2 - ir.top - ir.height / 2) / z}px) scale(.3)`;
      if (queue.length % 3 === 0) addStar(b);
      setTimeout(next, 700);
    }
    bask.forEach(b => b.onclick = () => drop(b.dataset.k));
    /* السحب بالإصبع أو الفأرة */
    let st = null;
    item.addEventListener('pointerdown', e => { if (busy) return; item.setPointerCapture(e.pointerId); st = { x: e.clientX, y: e.clientY, z: el.getBoundingClientRect().width / el.offsetWidth }; item.classList.add('drag'); });
    item.addEventListener('pointermove', e => {
      if (!st) return; item.style.transform = `translate(${(e.clientX - st.x) / st.z}px,${(e.clientY - st.y) / st.z}px) rotate(${(e.clientX - st.x) / st.z / 30}deg)`;
      bask.forEach(b => { const r = b.getBoundingClientRect(); b.classList.toggle('hot', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom); });
    });
    const end = e => {
      if (!st) return; item.classList.remove('drag'); const moved = Math.hypot(e.clientX - st.x, e.clientY - st.y) > 20; st = null;
      const hot = bask.find(b => b.classList.contains('hot')); bask.forEach(b => b.classList.remove('hot'));
      if (hot) drop(hot.dataset.k); else { item.style.transform = ''; if (!moved) { say(cur.name); } }
    };
    item.addEventListener('pointerup', end); item.addEventListener('pointercancel', end);
    $('[data-again]', el).onclick = () => R.sort(s, el);
    next();
  },

  riddles(s, el) {
    el.innerHTML = head(s) + `<div class="rid">${s.cards.map((c, i) => `<div class="flip rv" data-i="${i}" role="button"><div class="flip-in">
      <div class="face f"><span class="qi">❓</span><span class="q">${c.q}</span><button class="spk" data-say="${encodeURIComponent(c.q)}" title="اسمعي اللغز">🔊</button></div>
      <div class="face b" style="--c:${c.c}"><span class="ic">${c.ic}</span><b>${c.name}</b></div></div></div>`).join('')}</div>`;
    const seen = new Set();
    $$('.flip', el).forEach(f => f.onclick = e => {
      if (e.target.closest('.spk')) return;
      f.classList.toggle('on'); Sound.flip(); const c = s.cards[f.dataset.i];
      if (f.classList.contains('on')) { say('أنا ' + c.name + '!'); seen.add(f.dataset.i); if (seen.size === s.cards.length && !el._starred) { el._starred = true; setTimeout(() => { addStar(f); confetti(); }, 700); } }
    });
  },

  rules(s, el) {
    el.innerHTML = head(s) + `<div class="rules">${s.pairs.map((p, i) => {
      const a = `<button class="rc" data-ok="1"><i>${p.ok[0]}</i>${p.ok[1]}</button>`, b = `<button class="rc" data-ok="0"><i>${p.no[0]}</i>${p.no[1]}</button>`;
      return `<div class="rp rv">${Math.random() < .5 ? a + b : b + a}</div>`; }).join('')}</div>`;
    let n = 0;
    $$('.rp', el).forEach(rp => $$('.rc', rp).forEach(c => c.onclick = () => {
      if (rp.dataset.done) return;
      if (c.dataset.ok === '1') {
        rp.dataset.done = 1; c.classList.add('ok'); $$('.rc', rp).forEach(x => x !== c && x.classList.add('dim')); Sound.ok(); addStar(c); say('أحسنتِ! ' + c.textContent);
        if (++n === s.pairs.length) setTimeout(() => { confetti(); toast('🦸‍♀️ أنتِ بطلة ذكية!'); }, 900);
      } else { shake(c); Sound.no(); say('لا، فكّري مرة أخرى'); }
    }));
  },

  quiz(s, el) {
    el.innerHTML = head(s) + `<div class="quiz"><div class="dots rv">${s.qs.map(() => '<i></i>').join('')}</div>
      <div class="qq rv"><button class="spk" title="اسمعي السؤال">🔊</button><span></span></div><div class="qo rv"></div><div class="fb rv"></div>
      <button class="btn w hidden" data-again>🔄 العبي من جديد</button></div>`;
    const dots = $$('.dots i', el), qo = $('.qo', el), fb = $('.fb', el), qt = $('.qq span', el);
    let i = 0, lock = false;
    function show() {
      lock = false; const q = s.qs[i]; qt.textContent = q.q; fb.textContent = ''; dots.forEach((d, k) => d.classList.toggle('now', k === i));
      $('.qq .spk', el).dataset.say = encodeURIComponent(q.q);
      qo.innerHTML = q.o.map((o, k) => `<button class="qb" data-k="${k}"><span class="ic">${o[0]}</span>${o[1]}</button>`).join('');
      $$('.qb .ic svg', qo).forEach(x => x.style.width = '120px');
      popEl(qo);
      $$('.qb', qo).forEach(b => b.onclick = () => {
        if (lock) return; const o = q.o[b.dataset.k];
        if (o[2]) {
          lock = true; b.classList.add('ok'); dots[i].classList.add('ok'); Sound.ok(); addStar(b); fb.className = 'fb ok'; fb.textContent = '🎉 أحسنتِ! ' + o[1]; say('أحسنتِ! ' + o[1]);
          setTimeout(() => { if (++i < s.qs.length) show(); else { dots.forEach(d => d.classList.remove('now')); qo.innerHTML = ''; qt.textContent = '🏆 أنتِ نجمة الحاسب!'; confetti(220); $('[data-again]', el).classList.remove('hidden'); } }, 1800);
        } else { b.classList.add('no'); shake(b); Sound.no(); say('حاولي مرة أخرى'); }
      });
    }
    $('[data-again]', el).onclick = () => R.quiz(s, el);
    show();
    el._enter = () => { if (!lock && i < s.qs.length) say(s.qs[i].q); };
  },

  summary(s, el) {
    el.innerHTML = head(s) + `<div class="sum">
      <div class="sum-def rv">💻 الحاسب: <b>جهاز ذكي</b> ينفّذ أوامرنا ويساعدنا في التعلّم واللعب والعمل 🌟</div>
      <div class="sum-row">
        <div class="sum-c rv" style="--c:var(--blue);--cl:var(--blue-l)"><h3>⬅️ إدخال</h3><div class="ics">⌨️🖱️🎤📷</div><p>نُعطي الحاسب المعلومة</p></div>
        <div class="sum-ar rv">⬅</div>
        <div class="sum-c rv" style="--c:var(--grape);--cl:var(--grape-l)"><h3>⚙️ معالجة</h3><div class="ics">${TOWER}🧠</div><p>صندوق النظام يفكّر</p></div>
        <div class="sum-ar rv">⬅</div>
        <div class="sum-c rv" style="--c:var(--orange);--cl:var(--orange-l)"><h3>➡️ إخراج</h3><div class="ics">🖥️🔊🖨️</div><p>يُظهر لنا النتيجة</p></div>
      </div>${guide(s.say)}</div>`;
    $('.sum .guide', el).style.alignSelf = 'center';
  },

  exit(s, el) {
    const V = [['😍', 'استمتعتُ وفهمتُ', '#22B8A0'], ['🙂', 'فهمتُ معظم الدرس', '#3B82F6'], ['🤔', 'أحتاج مساعدة', '#FF8A3D']];
    el.innerHTML = head(s) + `<div class="exit">${V.map((v, i) => `<button class="vote rv" data-i="${i}" style="--c:${v[2]}"><span class="f">${v[0]}</span><b>${v[1]}</b><span class="n">0</span></button>`).join('')}</div>
      <div class="exit-q rv">${s.question}</div>`;
    const cnt = V.map(() => 0);
    $$('.vote', el).forEach(b => b.onclick = () => { cnt[b.dataset.i]++; $('.n', b).textContent = cnt[b.dataset.i]; popEl(b); Sound.pop(); });
  },

  closing(s, el) {
    el.innerHTML = `<div class="cert-wrap" style="margin-top:20px">
      <div class="cert rv"><span class="medal">🏅</span><h2>شهادة بطلة الحاسب</h2>
        <input class="nm" maxlength="30" placeholder="اكتبي اسم البطلة ✍️">
        <p>أصبحت تعرف كيف يعمل الحاسب، وما أجهزة <b style="color:var(--blue)">الإدخال</b> و<b style="color:var(--orange)">الإخراج</b> 💻</p>
        <span class="stars"></span></div>
      <div class="cert-side"><div class="bot bob rv">${bot('happy', true)}</div>
        <button class="btn y rv" data-pick>🎲 اختاري بطلة</button><button class="btn rv" data-clap>👏 صفّقن لأنفسكنّ!</button></div></div>`;
    const nm = $('.nm', el);
    $('[data-pick]', el).onclick = () => {
      let names = []; try { names = Roster.present() || []; } catch (e) {}
      if (!names.length) return toast('لا توجد أسماء في التحضير… اكتبي الاسم بنفسكِ ✍️');
      nm.value = names[Math.floor(Math.random() * names.length)]; popEl($('.cert', el)); Sound.star(); confetti(120);
    };
    $('[data-clap]', el).onclick = clap;
    el._enter = () => { $('.stars', el).textContent = STARS ? `⭐ جمع الفصل اليوم ${STARS} نجمة!` : '⭐⭐⭐'; setTimeout(() => confetti(180), 600); };
  }
};
const stripTags = t => String(t).replace(/<[^>]+>/g, '');

/* #####################################################################
   🎬 محرك العرض
   ##################################################################### */
const stage = $('#stage'), slides = [];
let current = -1, auto = false;
try { auto = localStorage.getItem('pc-auto') === '1'; } catch (e) {}

function build() {
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section'); el.className = 'slide';
    (R[s.type] || (() => (el.innerHTML = head(s))))(s, el);
    $$('.rv', el).forEach((r, k) => r.style.setProperty('--i', Math.min(k, 14)));
    stage.appendChild(el); slides.push(el);
  });
  $('#tot').textContent = slides.length;
}
function go(n) {
  n = Math.max(0, Math.min(slides.length - 1, n)); if (n === current) return;
  const old = slides[current], neu = slides[n], fwd = n > current;
  Voice.stop();
  if (old) { old._leave && old._leave(); old.classList.remove('active'); old.classList.toggle('back', fwd); }
  neu.classList.remove('back'); if (!fwd) neu.classList.add('back'); void neu.offsetWidth; neu.classList.remove('back');
  neu.classList.add('active'); current = n;
  if (old) Sound.flip();                       // صوت التنقل بين الشرائح
  neu._enter && neu._enter();
  if (auto && SLIDES[n].say) setTimeout(() => current === n && say(SLIDES[n].say), 700);
  $('#cur').textContent = n + 1;
  $('#progress span').style.width = ((n + 1) / slides.length * 100) + '%';
  $('#prevBtn').disabled = n === 0; $('#nextBtn').disabled = n === slides.length - 1;
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
}
const next = () => go(current + 1), prev = () => go(current - 1);
function fit() { const sc = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${sc})`; }
addEventListener('resize', fit);

document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'PageDown': case 'Enter':
      if (e.key === 'Enter' && e.target.tagName === 'BUTTON') return; e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
    case 'Home': go(0); break;
    case 'End': go(slides.length - 1); break;
    case 'ت': case 'f': case 'F': e.preventDefault(); clap(); break;
  }
  wake();
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setTimeout(() => b.blur(), 0);
  Sound.ac();
  const sp = e.target.closest('[data-say]'); if (sp) { e.stopPropagation(); say(decodeURIComponent(sp.dataset.say), sp); }
  if (e.target.closest('[data-act="next"]')) next();
}, true);
$('#nextBtn').onclick = next; $('#prevBtn').onclick = prev; $('#clapBtn').onclick = clap;
Roster.drawButton($('#clapBtn'));
$('#readBtn').onclick = () => { const s = SLIDES[current]; s.say ? say(s.say, $('#readBtn')) : toast('لا يوجد نص لهذه الشريحة'); };
const autoUI = () => $('#autoBtn').classList.toggle('on', auto);
const muteUI = () => { const b = $('#muteBtn'); b.textContent = MUTED ? '🔇' : '🔈'; b.classList.toggle('on', MUTED); b.title = MUTED ? 'تشغيل الأصوات' : 'إيقاف كل الأصوات'; };
$('#muteBtn').onclick = () => { MUTED = !MUTED; if (MUTED) Voice.stop(); muteUI(); try { localStorage.setItem('pc-mute', MUTED ? '1' : '0'); } catch (e) {} toast(MUTED ? '🔇 العرض الآن بدون أصوات' : '🔈 عادت الأصوات'); };
muteUI();
$('#autoBtn').onclick = () => { auto = !auto; autoUI(); try { localStorage.setItem('pc-auto', auto ? '1' : '0'); } catch (e) {} toast(auto ? '🗣️ سيقرأ حاسوبي كل شريحة تلقائيًا' : '🔇 القراءة التلقائية متوقفة'); };
$('#fsBtn').onclick = () => { const d = document; if (!d.fullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement); else (d.exitFullscreen || d.webkitExitFullscreen).call(d); };
$('#stars').onclick = () => { if (confirm('تصفير نجوم الفصل؟')) { STARS = 0; $('#stars b').textContent = 0; } };

let idleT;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('#controls:hover')) document.body.classList.add('idle'); }, 3500); }
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
addEventListener('wheel', e => e.preventDefault(), { passive: false });

if (location.search.includes('static')) document.head.insertAdjacentHTML('beforeend', '<style>.slide .rv{opacity:1!important;animation:none!important}</style>');
build(); fit(); autoUI();
const startAt = parseInt((location.hash || '').slice(1), 10);
go(Number.isFinite(startAt) ? startAt - 1 : 0);
wake();
</script>
</body>
</html>
