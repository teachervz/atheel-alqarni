<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعاملات الشرطية</title>
<!-- خط عربي واضح (إذا لم يتوفر الإنترنت يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1) ألوان سكراتش
   ========================================================= */
:root{
  --blue:#4C97FF;  --blue-d:#3373CC;  --blue-l:#E5F0FF;
  --motion:#4C97FF; --looks:#9966FF; --sound:#CF63CF; --events:#FFBF00;
  --control:#FFAB19; --pen:#0FBD8C; --operators:#59C059; --sensing:#5CB1D6;
  --purple:#855CD6; --purple-d:#5E3FB0; --purple-l:#F1EBFF;
  --green:#0FBD8C; --green-l:#DDF8EF;
  --orange:#FF8C1A; --orange-l:#FFF1DE;
  --red:#FF6680; --red-l:#FFE5EA;
  --ink:#2B2F4E; --muted:#6E7391; --line:#D4E3FB;
  --shadow:0 16px 40px -20px rgba(51,115,204,.55);
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#F3F8FF;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:#B7CDF3;border-radius:9px}

/* =========================================================
   2) المسرح 1600×900 (16:9) — يشبه محرر سكراتش
   ========================================================= */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;flex:none;width:1600px;height:900px;overflow:hidden;
  background:
    radial-gradient(900px 600px at 100% 0, #D9E8FF 0, transparent 60%),
    radial-gradient(800px 560px at 0 100%, #E8DEFF 0, transparent 60%),
    #F3F8FF}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(76,151,255,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(76,151,255,.08) 2px,transparent 2px);
  background-size:48px 48px}
.deco{position:absolute;pointer-events:none;opacity:.14}

/* شريط القوائم العلوي */
.topbar{position:absolute;top:0;left:0;right:0;height:76px;background:var(--blue);display:flex;align-items:center;gap:26px;padding:0 44px;color:#fff;z-index:5;box-shadow:0 6px 0 var(--blue-d)}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;font-size:27px}
.brand .logo{width:50px;height:50px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.brand small{display:block;font-size:19px;font-weight:600;opacity:.9}
.flagbar{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
.flagbar i{font-style:normal;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:28px}
.prog{width:340px;height:16px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--events),#FFE36E);border-radius:9px;transition:width .5s}
.points{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);padding:8px 22px 8px 12px;border-radius:999px;font-weight:800;font-size:22px}
.points span{width:42px;height:42px;border-radius:50%;background:#FFF4CC;display:grid;place-items:center;font-size:24px}
.points b{font-size:30px;color:var(--orange);min-width:30px;text-align:center}

/* =========================================================
   3) الشرائح
   ========================================================= */
.slide{position:absolute;top:100px;bottom:70px;left:60px;right:60px;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto}
.slide.out{visibility:visible;animation:out .35s ease both}
.slide.active.fx-fade{animation:inFade .55s ease both}
.slide.active.fx-slide-n{animation:inN .6s cubic-bezier(.2,.8,.2,1) both}
.slide.active.fx-slide-p{animation:inP .6s cubic-bezier(.2,.8,.2,1) both}
.slide.active.fx-zoom{animation:inZoom .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes out{to{opacity:0;transform:scale(.97)}}
@keyframes inFade{from{opacity:0}}
@keyframes inN{from{opacity:0;transform:translateX(-90px)}}
@keyframes inP{from{opacity:0;transform:translateX(90px)}}
@keyframes inZoom{from{opacity:0;transform:scale(.92)}}
.slide.play .rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.05)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.s-head{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.s-head h2{font-size:54px;font-weight:900;line-height:1.2}
.s-head h2 .hl{color:var(--blue)}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);color:var(--purple-d);font-size:24px;font-weight:800;padding:8px 20px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.lead{font-size:32px;color:var(--muted);font-weight:600;line-height:1.6;margin-bottom:20px}
.lead b{color:var(--blue-d)}
.note{background:#FFF7E0;border-right:8px solid var(--events);border-radius:20px;padding:16px 28px;font-size:28px;font-weight:600;line-height:1.55;margin-top:20px}
.note b{color:var(--orange)}
.card{background:#fff;border:3px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}
.grow{flex:1;min-height:0}
.row{display:flex;gap:28px;align-items:center}
.scroll{overflow:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:27px;font-weight:800;padding:14px 28px;border-radius:18px;transition:transform .15s,filter .2s;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.orange{background:var(--control);color:#fff}
.btn.ghost{background:#fff;color:var(--blue-d);border:3px solid var(--line)}
.btn.sm{font-size:22px;padding:9px 18px;border-radius:14px}

/* =========================================================
   4) لبنات سكراتش (بالعربي ومن اليمين لليسار)
   ========================================================= */
.script{display:flex;flex-direction:column;align-items:flex-start;gap:0;direction:rtl}
.sb{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:8px 18px 8px 22px;border-radius:8px;color:#fff;font-weight:800;font-size:25px;white-space:nowrap;border:2px solid rgba(0,0,0,.14);margin-bottom:-2px;z-index:1}
.sb::after{content:'';position:absolute;bottom:-9px;right:26px;width:32px;height:9px;background:inherit;border:2px solid rgba(0,0,0,.14);border-top:0;border-radius:0 0 8px 8px;z-index:2}
.sb.cap::after,.sb.c-foot::after{display:none}
.sb.hat{border-radius:44px 44px 8px 8px;padding-top:20px;min-width:240px}
.sb.motion{background:var(--motion)} .sb.looks{background:var(--looks)} .sb.sound{background:var(--sound)}
.sb.events{background:var(--events)} .sb.control{background:var(--control)} .sb.pen{background:var(--pen)}
.sb .in{background:#fff;color:var(--ink);border-radius:999px;padding:2px 14px;min-width:54px;text-align:center;font-weight:800}
.sb .in.txt{border-radius:999px}
.sb .dd{background:rgba(0,0,0,.14);border-radius:10px;padding:2px 12px}
.sb .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:inline-block}
.sb input.in{border:0;outline:0;font-size:25px;width:84px;font-family:inherit}
.cblock{display:flex;flex-direction:column;align-items:flex-start}
.cblock>.sb.c-head{border-radius:8px 8px 0 0;margin-bottom:0}
.cblock>.c-body{display:flex;flex-direction:column;align-items:flex-start;border-right:28px solid var(--control);min-height:44px;padding:4px 0 10px}
.cblock>.sb.c-foot{min-height:30px;width:150px;border-radius:0 0 8px 8px;padding:0}
.cblock.target>.c-body{border-right-color:#E0901A;background:rgba(255,171,25,.08)}

/* =========================================================
   5) أنواع الشرائح
   ========================================================= */
/* الترحيب */
.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;flex:1}
.kicker{display:inline-block;background:var(--events);color:#fff;font-size:28px;font-weight:900;padding:8px 24px;border-radius:999px;box-shadow:0 5px 0 #D99E00}
.welcome h1{font-size:96px;font-weight:900;line-height:1.12;margin:26px 0 18px;color:var(--ink)}
.welcome h1 span{color:var(--blue)}
.w-sub{font-size:36px;color:var(--muted);font-weight:600;line-height:1.5}
.w-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.w-meta span{background:#fff;border:3px solid var(--line);padding:10px 22px;border-radius:999px;font-size:25px;font-weight:700}
.w-art{position:relative;display:flex;flex-direction:column;gap:26px;align-items:center}
.w-stage{width:540px;height:360px;border-radius:28px;background:linear-gradient(180deg,#BFE3FF,#FFFFFF 70%,#E6F7D8 70%);border:6px solid #fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.w-stage .sprite{position:absolute;bottom:46px;right:90px;font-size:130px;animation:bob 2.6s ease-in-out infinite}
.w-stage .bubble{position:absolute;top:40px;right:210px;background:#fff;border:3px solid #C9D4EA;border-radius:24px;padding:14px 22px;font-size:28px;font-weight:800;animation:pop .6s .6s both}
.w-stage .bubble::after{content:'';position:absolute;bottom:-18px;right:34px;border:10px solid transparent;border-top-color:#C9D4EA}
.w-blocks{position:absolute;top:40px;left:-60px;transform:rotate(-4deg)}

/* الأهداف */
.goals{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;flex:1;align-content:center}
.goal{display:flex;align-items:center;gap:20px;padding:22px 28px;font-size:30px;font-weight:700;line-height:1.45;cursor:pointer;transition:.25s}
.goal .gi{flex:none;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:38px;background:var(--blue-l)}
.goal.done{border-color:var(--green);background:linear-gradient(90deg,#fff,var(--green-l))}
.goal.done .gi{background:var(--green);color:#fff}

/* البطاقات القلابة */
.flip-grid{display:grid;gap:26px;flex:1;min-height:0;grid-auto-rows:1fr}
.c2{grid-template-columns:repeat(2,1fr)} .c3{grid-template-columns:repeat(3,1fr)} .c4{grid-template-columns:repeat(4,1fr)}
.flip{perspective:1500px;cursor:pointer;min-height:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.face.front{background:#fff;border:3px solid var(--line);box-shadow:var(--shadow);border-top:14px solid var(--c,var(--blue))}
.face.back{background:var(--c,var(--blue));color:#fff;transform:rotateY(180deg)}
.f-ico{font-size:76px}
.f-q{font-size:34px;font-weight:900;line-height:1.35}
.f-tap{font-size:20px;color:var(--muted);font-weight:700;background:var(--blue-l);padding:6px 16px;border-radius:999px}
.face.back h4{font-size:36px;font-weight:900}
.face.back p{font-size:28px;font-weight:600;line-height:1.55}

/* صندوق الكشف */
.reveal{margin-top:22px;border-radius:26px;cursor:pointer;background:var(--purple);color:#fff;padding:22px 34px;text-align:center;font-size:32px;font-weight:900;box-shadow:0 7px 0 var(--purple-d);transition:transform .2s}
.reveal .rb{display:none;font-size:31px;font-weight:600;line-height:1.6}
.reveal.on{background:#fff;color:var(--ink);border:3px solid var(--purple);box-shadow:var(--shadow)}
.reveal.on .rl{display:none}
.reveal.on .rb{display:block;animation:pop .5s both}
.reveal .rb b{color:var(--purple)}

/* التمهيد */
.hook{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;align-items:center}
.hook .q{font-size:46px;font-weight:900;line-height:1.5}
.hook .q small{display:block;font-size:30px;color:var(--muted);font-weight:600;margin-top:12px}
.robot{font-size:220px;text-align:center;animation:wiggle 3s ease-in-out infinite}

/* الاستكشاف */
.explore{display:grid;grid-template-columns:400px 1fr;gap:30px;flex:1;min-height:0}
.ex-list{display:flex;flex-direction:column;gap:14px}
.ex-tab{flex:1;display:flex;align-items:center;gap:16px;padding:0 22px;background:#fff;border:3px solid var(--line);border-radius:22px;font-size:29px;font-weight:800;text-align:right;transition:.2s;box-shadow:var(--shadow)}
.ex-tab .i{font-size:40px;flex:none;width:52px;text-align:center}
.ex-tab .n{flex:1}
.ex-tab .ck{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:20px;color:#fff}
.ex-tab.seen .ck{background:var(--green);border-color:var(--green)}
.ex-tab.seen .ck::after{content:'✓';font-weight:900}
.ex-tab:hover{transform:translateX(-6px)}
.ex-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;transform:translateX(-12px)}
.ex-panel{position:relative;overflow:hidden}
.ex-pane{position:absolute;inset:0;display:none;flex-direction:column;padding:28px 38px;gap:16px}
.ex-pane.show{display:flex;animation:rise .45s both}
.ex-top{display:flex;align-items:center;gap:26px;padding-bottom:18px;border-bottom:3px dashed var(--line)}
.ex-big{width:110px;height:110px;border-radius:30px;background:var(--blue-l);display:grid;place-items:center;font-size:64px;flex:none}
.ex-top h3{font-size:50px;font-weight:900;line-height:1.2}
.ex-en{display:inline-block;margin-top:8px;direction:ltr;font-size:24px;font-weight:800;color:var(--blue-d);background:var(--blue-l);padding:4px 18px;border-radius:999px}
.ex-def{font-size:33px;font-weight:600;line-height:1.7}
.ex-def b{color:var(--blue-d)}
.ex-eg{margin-top:auto;display:flex;align-items:center;gap:18px;background:#FFF7E0;border-radius:22px;padding:18px 26px;font-size:28px;font-weight:700;line-height:1.5}
.ex-eg span{font-size:42px}
.ex-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-size:32px;font-weight:800;text-align:center}
.ex-start .ex-big{animation:bob 3s ease-in-out infinite}
.shape-demo{display:flex;justify-content:center;align-items:center;flex:1}

/* المخطط الانسيابي */
.fc-shape{display:inline-grid;place-items:center;text-align:center;font-weight:800;font-size:24px;color:#fff;padding:10px 26px;min-width:220px;min-height:76px;line-height:1.35}
.fc-term{background:var(--red);border-radius:999px}
.fc-proc{background:var(--blue);border-radius:6px}
.fc-io{background:var(--green);clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);padding:10px 50px}
.fc-dec{background:var(--control);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);min-width:250px;min-height:150px;padding:10px 46px}
.fc-arrow{font-size:46px;color:var(--muted);line-height:1;text-align:center}
.flowchart{display:flex;flex-direction:column;align-items:center;gap:2px}
.flowchart .fc-shape{min-width:330px;opacity:.12;transition:.4s}
.flowchart .fc-shape.on{opacity:1;animation:pop .45s both}
.flowchart .fc-arrow{opacity:.15;transition:.4s}
.flowchart .fc-arrow.on{opacity:1}

/* الخطوات */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;flex:1;min-height:0}
.step{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px 24px;cursor:pointer;transition:.3s;overflow:hidden}
.step .sn{width:70px;height:70px;border-radius:22px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.step h4{font-size:34px;font-weight:900;line-height:1.3}
.step .sd{font-size:26px;font-weight:600;line-height:1.55;color:var(--muted);opacity:0;transform:translateY(16px);transition:.45s}
.step.on{border-color:var(--c)}
.step.on .sd{opacity:1;transform:none}
.step .tap{margin-top:auto;font-size:20px;color:var(--muted);font-weight:700}
.step.on .tap{display:none}

/* اختيار من متعدد */
.q-box{display:flex;align-items:center;gap:24px;padding:24px 32px;font-size:40px;font-weight:800;line-height:1.5;margin-bottom:24px}
.q-ico{flex:none;width:90px;height:90px;border-radius:26px;background:var(--blue-l);display:grid;place-items:center;font-size:50px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{position:relative;display:flex;align-items:center;gap:18px;padding:20px 30px 20px 84px;min-height:112px;font-size:34px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:26px;box-shadow:var(--shadow);text-align:right;transition:.2s}
.opt:hover:not(:disabled){transform:translateY(-4px);border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt .l{position:absolute;left:20px;top:50%;margin-top:-25px;width:50px;height:50px;border-radius:14px;background:var(--blue-l);color:var(--blue-d);font-size:26px;font-weight:900;display:grid;place-items:center}
.opt.ok{background:var(--green-l);border-color:var(--green)}
.opt.ok .l{background:var(--green);color:#fff}
.opt.no{background:var(--red-l);border-color:var(--red);opacity:.75}
.solved .opt:not(.ok){opacity:.45}
.fb{min-height:60px;font-size:36px;font-weight:900;text-align:center;margin-top:16px}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.explain{display:none;background:var(--blue-l);border-radius:20px;padding:14px 24px;font-size:27px;font-weight:600;text-align:center;line-height:1.5}
.solved .explain{display:block;animation:rise .5s both}
.multi{display:flex;flex-direction:column;flex:1;min-height:0}
.m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:26px;font-weight:800;color:var(--muted)}
.m-dots{display:flex;gap:8px}
.m-dots i{width:40px;height:12px;border-radius:9px;background:var(--line);transition:.3s}
.m-dots i.on{background:var(--blue)}
.mq{display:none}.mq.show{display:block;animation:rise .45s both}
.m-nav{display:flex;justify-content:center;gap:18px;margin-top:auto}

/* صح أم خطأ */
.tf{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.tf-row{display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding:14px 24px;transition:.3s}
.tf-row .t{flex:1;font-size:30px;font-weight:700;line-height:1.45}
.tf-row .n{flex:none;width:52px;height:52px;border-radius:16px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-size:26px;font-weight:900}
.tf-row .bt{display:flex;gap:12px}
.tf-row.ok{border-color:var(--green);background:var(--green-l)}
.tf-row .fix{flex-basis:100%;display:none;font-size:24px;font-weight:700;color:var(--purple-d);padding-right:70px}
.tf-row.ok .fix{display:block;animation:rise .4s both}

/* التوصيل */
.match{display:grid;grid-template-columns:1fr 1fr;gap:20px 80px;flex:1;min-height:0;align-content:center}
.m-col{display:flex;flex-direction:column;gap:18px}
.m-item{min-height:96px;padding:14px 26px;font-size:28px;font-weight:800;line-height:1.4;background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow);text-align:right;display:flex;align-items:center;gap:16px;transition:.2s}
.m-item:hover:not(:disabled){border-color:var(--blue)}
.m-item.sel{border-color:var(--blue);background:var(--blue-l);transform:scale(1.03)}
.m-item.done{border-color:var(--green);background:var(--green-l);cursor:default}
.m-item.bad{animation:shake .4s}
.m-item .tag{flex:none;width:44px;height:44px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900}
.m-item.done .tag{background:var(--green)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ترتيب الخطوات */
.order{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;min-height:0}
.o-pool,.o-done{display:flex;flex-direction:column;gap:14px}
.o-item{font-size:28px;font-weight:800;padding:18px 24px;border-radius:20px;background:#fff;border:3px solid var(--line);text-align:right;box-shadow:var(--shadow);transition:.25s;line-height:1.4}
.o-item:hover:not(:disabled){border-color:var(--blue);transform:translateX(-6px)}
.o-item:disabled{opacity:.25;filter:blur(1px)}
.o-done{list-style:none;position:relative;border:3px dashed var(--line);border-radius:26px;padding:16px;background:rgba(255,255,255,.6);flex:1}
.o-done:empty::before{content:'👆 اضغطي الخطوات بالترتيب الصحيح';position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:var(--muted);font-weight:700}
.o-done li{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;background:var(--green-l);border:3px solid var(--green);border-radius:18px;padding:12px 18px;animation:rise .35s both;line-height:1.4}
.o-done li i{flex:none;font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.o-msg{font-size:30px;font-weight:900;color:var(--green);text-align:center;min-height:44px;margin-top:10px}

/* فكري - زاوجي - شاركي */
.tps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;flex:1;min-height:0}
.phase{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:22px;cursor:pointer;transition:.3s}
.phase.on{border-color:var(--blue);background:linear-gradient(180deg,#fff,var(--blue-l));transform:translateY(-6px)}
.phase .pi{font-size:76px}
.phase h4{font-size:42px;font-weight:900}
.phase p{font-size:24px;color:var(--muted);line-height:1.5;font-weight:600}
.phase .tm{font-size:42px;font-weight:900;color:var(--blue-d);background:var(--blue-l);padding:4px 28px;border-radius:999px;direction:ltr}
.phase .tm.warn{color:var(--red)}

/* معلومة / لمحة تاريخية */
.info{display:grid;grid-template-columns:360px 1fr;gap:44px;flex:1;align-items:center}
.info .art{font-size:180px;text-align:center;background:#fff;border-radius:50%;width:340px;height:340px;display:grid;place-items:center;box-shadow:var(--shadow);border:8px solid var(--c,var(--purple))}
.info .txt{font-size:36px;font-weight:600;line-height:1.75}
.info .txt b{color:var(--c,var(--purple))}
.info .tag{display:inline-block;background:var(--c,var(--purple));color:#fff;font-size:28px;font-weight:900;padding:6px 24px;border-radius:999px;margin-bottom:16px}

/* التطبيق العملي */
.practice{display:grid;grid-template-columns:1fr 430px;gap:40px;flex:1;min-height:0;align-items:center}
.pr-list{list-style:none;display:flex;flex-direction:column;gap:16px}
.pr-list li{display:flex;align-items:center;gap:20px;padding:18px 26px;font-size:29px;font-weight:700;line-height:1.45}
.pr-list li i{flex:none;font-style:normal;width:60px;height:60px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
.pr-side{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px}

/* المؤقت */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px}
.t-ring{position:relative;width:250px;height:250px}
.t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-ring circle{fill:none;stroke-width:9}
.t-ring .bg{stroke:var(--line);fill:#fff}
.t-ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer.warn .fg{stroke:var(--red)}
.t-num{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:900;direction:ltr}

/* الملخص */
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;min-height:0;grid-auto-rows:1fr}
.rc{display:flex;flex-direction:column;gap:12px;padding:24px 28px;cursor:pointer;border-top:14px solid var(--c);transition:.25s}
.rc .ri{font-size:52px}
.rc h4{font-size:32px;font-weight:900}
.rc p{font-size:25px;font-weight:600;line-height:1.55;color:var(--muted);filter:blur(7px);transition:.4s}
.rc.on p{filter:none;color:var(--ink)}

/* الختام */
.closing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.closing .ci{font-size:130px;animation:bob 3s ease-in-out infinite}
.closing h1{font-size:78px;font-weight:900}
.closing .sc{font-size:34px;font-weight:800;background:#fff;border:3px solid var(--line);padding:12px 34px;border-radius:999px}
.closing .sc b{color:var(--orange);font-size:44px}
.hw{font-size:28px;max-width:1300px;background:#FFF7E0;border-right:8px solid var(--events);padding:16px 30px;border-radius:20px;line-height:1.6;text-align:right;font-weight:600}

/* =========================================================
   6) المحاكيات
   ========================================================= */
.sim{display:grid;grid-template-columns:380px 1fr 470px;gap:18px;flex:1;min-height:0}
.sim.two{grid-template-columns:1fr 500px}
.pane{display:flex;flex-direction:column;min-height:0;background:#fff;border:3px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.pane>h5{flex:none;font-size:22px;font-weight:900;padding:12px 18px;background:var(--blue-l);color:var(--blue-d);display:flex;align-items:center;gap:10px}
.pane>h5 .sp{margin-inline-start:auto}
.palette{flex:1;min-height:0;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.palette .sb{cursor:pointer;transition:transform .12s;font-size:22px;min-height:52px}
.palette .sb:hover{transform:translateX(-5px)}
.palette .grp{font-size:19px;font-weight:900;color:var(--muted);margin-top:4px}
.workspace{flex:1;min-height:0;overflow:auto;padding:22px;background-image:radial-gradient(#D6E2F5 1.6px,transparent 1.7px);background-size:22px 22px}
.workspace .sb{cursor:pointer}
.workspace .sb:hover{filter:brightness(1.07)}
.ws-empty{color:var(--muted);font-size:24px;font-weight:700;line-height:1.6;padding:12px}
.ws-bar{flex:none;display:flex;gap:10px;padding:10px 14px;border-top:3px solid var(--line);flex-wrap:wrap}
.stagebox{display:flex;flex-direction:column;gap:14px;min-height:0}
.st-bar{display:flex;align-items:center;gap:10px}
.st-bar .flag,.st-bar .stop{width:58px;height:52px;border-radius:12px;background:#fff;border:3px solid var(--line);font-size:30px;display:grid;place-items:center}
.st-bar .flag{color:#4CBF56}
.st-bar .flag:hover,.st-bar .stop:hover{background:var(--blue-l)}
.st-bar .st-name{margin-inline-start:auto;font-size:21px;font-weight:800;color:var(--muted)}
.cv{width:470px;height:352px;border-radius:18px;border:3px solid var(--line);background:#fff;display:block;box-shadow:var(--shadow)}
.mission{display:flex;flex-direction:column;gap:10px;padding:16px 20px;font-size:24px;font-weight:700;line-height:1.45}
.mission .mt{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--purple-d)}
.mission .ok{color:var(--green);font-weight:900}
.sim-msg{min-height:40px;font-size:26px;font-weight:900;text-align:center}
.sim-msg.ok{color:var(--green)} .sim-msg.no{color:var(--red)}

/* شبكة "اتبعي التعليمات" */
.grid-game{display:grid;grid-template-columns:1fr 560px;gap:36px;flex:1;min-height:0}
.gg-board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:6px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:12px;aspect-ratio:6/5;align-self:center;width:100%;position:relative}
.gg-cell{border-radius:12px;background:var(--blue-l);display:grid;place-items:center;font-size:54px}
.gg-cell.wall{background:#C7D3E8}
.gg-cell.path{background:#FFF1C2}
.gg-actor{position:absolute;font-size:64px;transition:left .35s ease,top .35s ease;display:grid;place-items:center;pointer-events:none}
.gg-side{display:flex;flex-direction:column;gap:16px;min-height:0}
.gg-cmds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gg-prog{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:16px}
.gg-prog span{background:var(--motion);color:#fff;font-size:26px;font-weight:800;padding:8px 16px;border-radius:12px;animation:pop .3s both}
.gg-prog span.now{outline:4px solid var(--events)}
.gg-prog:empty::before{content:'برنامجك سيظهر هنا… 🧩';color:var(--muted);font-size:24px;font-weight:700}

/* لوحة الكائنات (الدرس الثاني) */
.spr-sim{display:grid;grid-template-columns:1fr 520px;gap:26px;flex:1;min-height:0}
.spr-stage{position:relative;width:520px;height:390px;border-radius:20px;border:3px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.spr-stage.jurassic{background:linear-gradient(180deg,#FFB86B 0,#FFD9A0 45%,#7BC67B 45%,#4E9F4E 100%)}
.spr-stage .actor{position:absolute;font-size:96px;line-height:1;transform-origin:center;transition:left .25s,top .25s,transform .25s,opacity .25s;display:grid;place-items:center}
.spr-stage .actor.sel{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--blue))}
.spr-stage .say{position:absolute;background:#fff;border:3px solid #C9D4EA;border-radius:18px;padding:8px 16px;font-size:22px;font-weight:800;white-space:nowrap;transform:translate(-30%,-100%)}
.info-bar{display:grid;grid-template-columns:repeat(3,auto);gap:12px 18px;align-items:center;padding:16px 20px;font-size:22px;font-weight:800;justify-content:start}
.info-bar label{display:flex;align-items:center;gap:8px;white-space:nowrap}
.info-bar input{width:110px;font-size:22px;font-weight:800;padding:6px 10px;border:3px solid var(--line);border-radius:12px;outline:none;text-align:center;direction:ltr}
.info-bar input.nm{width:170px;direction:rtl}
.info-bar input:focus{border-color:var(--blue)}
.eye{display:flex;border:3px solid var(--line);border-radius:12px;overflow:hidden}
.eye button{padding:4px 14px;font-size:24px}
.eye button.on{background:var(--blue);color:#fff}
.sp-list{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;padding:16px;position:relative}
.sp-thumb{position:relative;width:120px;height:120px;border-radius:16px;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;cursor:pointer}
.sp-thumb small{font-size:16px;font-weight:800;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-thumb.sel{border-color:var(--blue);background:var(--blue-l)}
.sp-thumb .del{position:absolute;top:-12px;left:-12px;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;display:none}
.sp-thumb.sel .del{display:grid;place-items:center}
.add-sp{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column-reverse;align-items:center;gap:10px}
.add-sp .main{width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;font-size:38px;box-shadow:0 6px 0 var(--blue-d)}
.add-sp .opts2{display:none;flex-direction:column;gap:10px}
.add-sp:hover .opts2,.add-sp.open .opts2{display:flex}
.add-sp .opts2 button{width:62px;height:62px;border-radius:50%;background:var(--purple);color:#fff;font-size:28px;position:relative}
.add-sp .opts2 button span{position:absolute;left:74px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:18px;font-weight:800;padding:4px 12px;border-radius:10px;white-space:nowrap}
.ctx{position:absolute;z-index:9;background:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:170px}
.ctx button{font-size:22px;font-weight:800;padding:10px 18px;text-align:right}
.ctx button:hover{background:var(--blue);color:#fff}
.lib{position:absolute;inset:0;z-index:8;background:rgba(43,47,78,.55);display:flex;align-items:center;justify-content:center}
.lib-box{width:1120px;height:560px;background:#fff;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;animation:pop .35s both}
.lib-head{background:var(--blue);color:#fff;font-size:30px;font-weight:900;padding:14px 26px;display:flex;align-items:center}
.lib-head button{margin-inline-start:auto;font-size:28px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2)}
.lib-cats{display:flex;gap:10px;padding:14px 22px;border-bottom:3px solid var(--line)}
.lib-cats button{font-size:22px;font-weight:800;padding:8px 20px;border-radius:999px;background:var(--blue-l);color:var(--blue-d)}
.lib-cats button.on{background:var(--blue);color:#fff}
.lib-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:20px;align-content:start}
.lib-grid button{height:150px;border-radius:18px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:66px}
.lib-grid button small{font-size:18px;font-weight:800;color:var(--muted);direction:ltr}
.lib-grid button:hover{border-color:var(--blue);background:var(--blue-l)}

/* المظاهر */
.cos-sim{display:grid;grid-template-columns:220px 1fr 520px;gap:22px;flex:1;min-height:0}
.cos-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px}
.cos{position:relative;border:3px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:#fff}
.cos .k{position:absolute;top:6px;right:10px;font-size:18px;font-weight:900;color:var(--muted)}
.cos svg{width:130px;height:96px}
.cos small{font-size:17px;font-weight:800;direction:ltr}
.cos.sel{border-color:var(--looks);background:var(--purple-l)}
.paint{flex:1;display:grid;place-items:center;background:#fff}
.paint svg{width:420px;height:320px}

/* =========================================================
   7) شريط التحكم
   ========================================================= */
#controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);padding:4px;border-radius:999px;box-shadow:0 18px 40px -16px rgba(51,115,204,.6);z-index:40;transition:opacity .4s,transform .4s;font-size:clamp(12px,.9vw,15px);opacity:.6}
#controls:hover{opacity:1}
.cb{padding:5px 14px;border-radius:999px;font-weight:800;color:var(--blue-d);font-size:inherit;transition:background .2s}
.cb:hover{background:var(--blue-l)}
.cb:disabled{opacity:.35;cursor:default}
.cb.primary{background:var(--blue);color:#fff}
.cb.primary:hover{background:var(--blue-d)}
.cb.clap{font-size:1.3em;padding:1px 10px;line-height:1.2;background:#FFF4CC}
.cb-num{font-weight:900;color:var(--muted);padding:0 8px;min-width:56px;text-align:center}
.cb-num b{color:var(--blue)}
.cb-sep{width:1px;height:20px;background:var(--line)}
body.idle #controls{opacity:0;transform:translate(-50%,26px);pointer-events:none}
body.idle{cursor:none}
#hint{position:fixed;bottom:14px;right:16px;display:flex;gap:12px;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:999px;z-index:39;transition:opacity .4s}
body.idle #hint{opacity:0}
kbd{font-family:inherit;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-weight:900}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font-size:clamp(18px,2vw,30px);font-weight:900;padding:12px 32px;border-radius:999px;z-index:60;transition:.35s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--green)} #toast.no{background:var(--red)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fx-c{position:absolute;width:14px;height:18px;border-radius:3px;margin:-9px 0 0 -7px}
.fx-clap{position:absolute;bottom:40px;line-height:1}

/* محتوى الشريحة في المنتصف عموديًا (مثل العرض التقديمي) */
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.tf{justify-content:center}
.order,.match,.goals,.tps{align-content:center}

/* ضبط المقاسات لمسرح 1600×900 */
.sb{min-height:50px;font-size:22px;padding:6px 16px 6px 20px}
.sb.hat{padding-top:16px;min-width:200px}
.sb input.in{font-size:22px;width:70px}
.cblock>.c-body{border-right-width:24px;min-height:36px}
.cblock>.sb.c-foot{min-height:24px;width:130px}
.w-blocks{top:auto;bottom:-34px;left:-30px}
.flowchart .fc-shape{min-width:300px;min-height:52px;font-size:21px;padding:6px 22px}
.flowchart .fc-arrow{font-size:28px}
.pr-list{gap:12px}
.pr-list li{padding:12px 22px;font-size:26px}
.pr-list li i{width:50px;height:50px;font-size:26px}
.practice .lead{font-size:28px;margin-bottom:14px}
.o-item{padding:13px 22px;font-size:26px}
.o-pool,.o-done{gap:11px}
.o-done li{padding:9px 16px;font-size:24px}
.cos svg{width:110px;height:76px}
.cos{padding:4px}
.cos-list{gap:8px;padding:10px}
.palette{gap:12px}
.mission{padding:12px 18px;font-size:22px}
.sp-thumb{width:104px;height:104px;font-size:48px}
.tf-row{padding:10px 22px}
.tf-row .t{font-size:28px}
.multi .mid{justify-content:center}
.multi .mq.show{display:block}

/* =========================================================
   8) لبنات إضافية: الاستشعار والعمليات والكتل الشرطية
   ========================================================= */
.sb.sensing,.rp.sensing,.bool.sensing{background:var(--sensing)}
.sb.operators,.rp.operators,.bool.operators{background:var(--operators)}
.rp{display:inline-flex;align-items:center;gap:8px;padding:3px 14px;border-radius:999px;color:#fff;font-weight:800;border:2px solid rgba(0,0,0,.14);white-space:nowrap;min-height:40px}
.bool{display:inline-flex;align-items:center;gap:8px;padding:4px 30px;color:#fff;font-weight:800;white-space:nowrap;min-height:44px;
  clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,20px 100%,0 50%)}
.bool.slot{background:rgba(0,0,0,.2);min-width:96px}
.cmpw{display:inline-flex;align-items:center;gap:10px;direction:ltr}
.cmpw>b{font-size:1.15em}
.flg{font-size:28px;color:#3FB14A;background:#fff;border-radius:8px;padding:0 6px}
.cblock>.sb.c-mid{border-radius:0 8px 8px 0;min-height:40px;margin-bottom:0}
.cblock>.sb.c-mid::after{display:none}
.sb.run,.rp.run,.bool.run{filter:brightness(1.22) drop-shadow(0 0 7px #FFD500)}
.ex-pane .shape-demo .script{transform:scale(1.08);transform-origin:center}

/* =========================================================
   9) محاكي سكراتش المصغّر
   ========================================================= */
.vm-wrap{display:grid;grid-template-columns:1fr 540px;gap:24px;flex:1;min-height:0}
.vm-left{display:flex;flex-direction:column;gap:16px;min-height:0}
.vm-code{display:flex;flex-direction:column;gap:22px}
.vm-spr{display:flex;flex-direction:column;gap:14px}
.vm-spr>h6{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--purple-d);background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 18px 4px 8px;align-self:flex-start}
.vm-spr>h6 span{font-size:30px}
.vm-scripts{display:flex;flex-wrap:wrap;gap:22px 34px;align-items:flex-start}
.vm-vers{display:flex;gap:8px;flex-wrap:wrap}
.vm-vers button{font-size:18px;font-weight:800;padding:5px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--blue-d)}
.vm-vers button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vm-stage{position:relative;width:520px;height:390px;border-radius:20px;border:3px solid var(--line);background:#fff;overflow:hidden;box-shadow:var(--shadow);flex:none;touch-action:none}
.vm-sp{position:absolute;line-height:1;display:grid;place-items:center;cursor:pointer;transition:opacity .2s}
.vm-sp .vm-e{display:block;transition:transform .08s linear}
.vm-say{position:absolute;z-index:3;max-width:330px;background:#fff;border:3px solid #C9D4EA;border-radius:18px;padding:7px 14px;font-size:19px;font-weight:800;line-height:1.45;color:var(--ink);pointer-events:none;animation:pop .3s both}

  function draw(sp){
    const kk = k(), e = sp.el, f = e.firstChild;
    const cc = sp.cos[sp.ci]; if(f._c !== cc){ f._c = cc; if(cc.h) f.innerHTML = cc.h; else f.textContent = cc.e; }
    const half = sp.size * .6;
    e.style.left = ((W/2 + sp.x) * kk - half) + 'px'; e.style.top = ((H/2 - sp.y) * kk - half) + 'px';
    e.style.width = e.style.height = half*2 + 'px';
    e.style.opacity = sp.show ? 1 : 0;
    const fl = sp.faceLeft ? ' scaleX(-1)' : '';
    f.style.transform = sp.rot === 'all' ? `rotate(${sp.dir - 90}deg)${fl}` : sp.rot === 'lr' ? `${sp.dir < 0 ? 'scaleX(-1)' : ''}${fl}` : fl;
    const b = sp.bub;
    if(sp.say && sp.show){
      if(b.textContent !== sp.say){ b.textContent = sp.say; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }
      b.style.display = 'block';
      const bw = b.offsetWidth, bh = b.offsetHeight, bx = Math.min(Math.max(6, (W/2 + sp.x) * kk - bw*.35), box.clientWidth - bw - 6);
      b.style.left = bx + 'px'; b.style.top = Math.max(6, (H/2 - sp.y) * kk - half - bh + 6) + 'px';
    } else b.style.display = 'none';
  }
  const drawAll = () => vm.sprites.forEach(draw);

  /* ---------- الحركة والاستشعار ---------- */
  function fence(sp){ const r = R0(sp); sp.x = Math.max(-W/2 + r, Math.min(W/2 - r, sp.x)); sp.y = Math.max(-H/2 + r, Math.min(H/2 - r, sp.y)); }
  function step(sp, n){ const a = sp.dir * Math.PI / 180; sp.x += n * Math.sin(a); sp.y += n * Math.cos(a); fence(sp); }
  function bounce(sp){
    const r = R0(sp);
    if(sp.x >= W/2 - r - .5 || sp.x <= -W/2 + r + .5){ sp.dir = norm(-sp.dir); }
    if(sp.y >= H/2 - r - .5 || sp.y <= -H/2 + r + .5){ sp.dir = norm(180 - sp.dir); }
    fence(sp);
  }
  const hit = (a, b) => b.show && a.show && Math.abs(a.x - b.x) < (R0(a) + R0(b)) * .85 && Math.abs(a.y - b.y) < (R0(a) + R0(b)) * .85;
  function touching(sp, what){
    if(what === 'مؤشر الفأرة') return vm.mouse.in && Math.abs(vm.mouse.x - sp.x) < R0(sp) && Math.abs(vm.mouse.y - sp.y) < R0(sp);
    if(what === 'الحافة'){ const r = R0(sp); return Math.abs(sp.x) >= W/2 - r - .5 || Math.abs(sp.y) >= H/2 - r - .5; }
    return vm.sprites.some(o => o !== sp && (o.name === what || o.group === what) && hit(sp, o));
  }
  const touchColor = (sp, c) => vm.sprites.some(o => o !== sp && o.color === c && hit(sp, o));

  function ev(sp, x){
    if(x == null) return '';
    if(typeof x !== 'object') return x;
    glow(x);
    switch(x.k){
      case 'answer': return vm.answer;
      case 'join':   return String(ev(sp, x.a)) + String(ev(sp, x.b));
      case 'lt':     return cmpv(ev(sp, x.a), ev(sp, x.b)) < 0;
      case 'gt':     return cmpv(ev(sp, x.a), ev(sp, x.b)) > 0;
      case 'eq':     return cmpv(ev(sp, x.a), ev(sp, x.b)) === 0;
      case 'key':    return x.v === 'أي مفتاح' ? vm.keys.size > 0 : vm.keys.has(x.v);
      case 'touch':  return touching(sp, x.v);
      case 'tcolor': return touchColor(sp, x.c);
      case 'ccolor': return sp.color === x.c1 && touchColor(sp, x.c2);
    }
    return '';
  }
  function glow(b){
    (nodes[b._id] || []).forEach(n => { n.classList.add('run'); clearTimeout(n._g); n._g = setTimeout(() => n.classList.remove('run'), 260); });
  }
  function emit(type, sp, val){
    const key = type + ':' + (sp ? sp.name : '');
    vm.count[key] = (vm.count[key] || 0) + 1;
    onEvent && onEvent({ type, sp, val }, vm);
  }

  /* ---------- التنفيذ ---------- */
  const tick = g => new Promise((res, rej) => setTimeout(() => g === vm.gen ? res() : rej(HALT), 1000/30));
  async function wait(sec, g){ const end = performance.now() + sec*1000; while(performance.now() < end){ if(g !== vm.gen) throw HALT; await sleep(Math.min(50, end - performance.now())); } if(g !== vm.gen) throw HALT; }
  async function exec(sp, list, g){
    for(const b of list){
      if(g !== vm.gen) throw HALT;
      glow(b);
      switch(b.k){
        case 'move':   step(sp, +ev(sp, b.n) || 0); break;
        case 'turn':   sp.dir = norm(sp.dir + (+ev(sp, b.n) || 0)); break;
        case 'point':  sp.dir = norm(+ev(sp, b.n) || 0); break;
        case 'bounce': bounce(sp); break;
        case 'rot':    sp.rot = ROT[b.v] || 'all'; break;
        case 'goto':
          if(b.v === 'مؤشر الفأرة'){ if(vm.mouse.in){ sp.x = vm.mouse.x; sp.y = vm.mouse.y; fence(sp); } }
          else { sp.x = rnd(-190, 190); sp.y = rnd(-130, 130); emit('goto', sp); Sound.pop(); }
          break;
        case 'say': {
          const t = String(ev(sp, b.v)), my = sp.sayTok = (sp.sayTok || 0) + 1;
          sp.say = t; draw(sp); emit('say', sp, t); Sound.tone(700, 0, .05, 'triangle', .05);
          if(b.s != null){ await wait(+ev(sp, b.s) || 0, g); if(sp.sayTok === my){ sp.say = ''; } }
          break;
        }
        case 'next':   sp.ci = (sp.ci + 1) % sp.cos.length; break;
        case 'switch': sp.ci = Math.max(0, sp.cos.findIndex(c => c.n === b.v)); break;
        case 'sound':  (Sound[b.snd] || Sound.pop)(); break;
        case 'wait':   await wait(+ev(sp, b.n) || 0, g); break;
        case 'ask':    await ask(sp, String(ev(sp, b.v)), g); break;
        case 'bcast':  emit('bcast', sp, b.v); broadcast(b.v); break;
        case 'bcastW': emit('bcast', sp, b.v); await Promise.all(broadcast(b.v)); break;
        case 'stop':   draw(sp); if(b.v === 'الكل'){ emit('stopall', sp); stopAll(); } throw HALT;
        case 'repeat': { const n = Math.min(500, +ev(sp, b.n) || 0); for(let i=0;i<n;i++){ await exec(sp, b.body || [], g); draw(sp); await tick(g); } break; }
        case 'forever': for(;;){ await exec(sp, b.body || [], g); draw(sp); await tick(g); }
        case 'until':  while(!ev(sp, b.cond)){ await exec(sp, b.body || [], g); draw(sp); await tick(g); } break;
        case 'if':     if(ev(sp, b.cond)) await exec(sp, b.body || [], g); break;
        case 'ifelse': await exec(sp, ev(sp, b.cond) ? (b.body || []) : (b.body2 || []), g); break;
      }
      draw(sp);
    }
  }
  function ask(sp, q, g){
    sp.say = q; draw(sp);
    const bar = $('.vm-ask', el), inp = $('input', bar);
    bar.classList.add('on'); inp.value = ''; setTimeout(() => inp.focus(), 50);
    return new Promise((res, rej) => {
      askDone = v => {
        askDone = null; bar.classList.remove('on'); inp.blur();
        if(v == null || g !== vm.gen) return rej(HALT);
        vm.answer = v; $('.vm-mon b', el).textContent = v; sp.say = ''; draw(sp); emit('answer', sp, v); res();
      };
    });
  }
  const submit = () => { const inp = $('.vm-ask input', el); if(askDone) askDone(inp.value.trim()); };
  $('.vm-ask button', el).onclick = submit;
  $('.vm-ask input', el).addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } e.stopPropagation(); });

  function start(sp, script){
    const g = vm.gen; vm.running++; ui();
    return exec(sp, script.slice(1), g)
      .catch(e => { if(e !== HALT) console.error(e); })
      .finally(() => { vm.running--; ui(); if(!vm.running && g === vm.gen) emit('end'); });
  }
  function broadcast(msg){
    const ps = [];
    vm.sprites.forEach(sp => sp.scripts.forEach(sc => { if(sc[0] && sc[0].k === 'recv' && sc[0].v === msg) ps.push(start(sp, sc)); }));
    return ps;
  }
  function stopAll(){
    vm.gen++; if(askDone) askDone(null);
    vm.sprites.forEach(sp => { sp.say = ''; draw(sp); });
    ui();
  }
  function flag(){
    stopAll(); reset(); vm.keys.clear(); $$('.vm-pad button', el).forEach(b => b.classList.remove('on'));
    emit('flag');
    vm.sprites.forEach(sp => sp.scripts.forEach(sc => sc[0] && sc[0].k === 'flag' && start(sp, sc)));
  }
  function ui(){ $('.flag', el).classList.toggle('on', vm.running > 0); }

  /* ---------- الفأرة ولوحة المفاتيح ---------- */
  const mpos = e => { const r = box.getBoundingClientRect(); vm.mouse.x = (e.clientX - r.left) / r.width * W - W/2; vm.mouse.y = H/2 - (e.clientY - r.top) / r.height * H; vm.mouse.in = true; };
  box.addEventListener('pointermove', mpos);
  box.addEventListener('pointerdown', mpos);
  box.addEventListener('pointerleave', () => vm.mouse.in = false);
  $$('.vm-pad button', el).forEach(b => {
    const on = e => { e.preventDefault(); vm.keys.add(b.dataset.key); b.classList.add('on'); };
    const off = () => { vm.keys.delete(b.dataset.key); b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, off));
  });
  const trap = (e, down) => {
    const name = KEYMAP[e.key]; if(!name || !vm.running) return false;
    e.preventDefault(); down ? vm.keys.add(name) : vm.keys.delete(name);
    const pb = $(`.vm-pad button[data-key="${name}"]`, el); if(pb) pb.classList.toggle('on', down);
    return true;
  };

  $('.flag', el).onclick = () => { Sound.pop(); flag(); };
  $('.stop', el).onclick = () => { const was = vm.running > 0; stopAll(); if(was) emit('stop'); Sound.flip(); };
  build();
  return {
    vm, build, flag, stopAll, drawAll,
    show(){ KEYTRAP = trap; drawAll(); },
    leave(){ stopAll(); if(KEYTRAP === trap) KEYTRAP = null; }
  };
}

/* ==================================================================
   🎞️ أنواع الشرائح
   ================================================================== */
const head = s => `<div class="s-head rv">${s.strategy?`<span class="badge">${s.strategy}</span>`:''}<h2>${s.title}</h2></div>`;
const R = {}, INIT = {};

/* --- الترحيب --- */
R.welcome = s => `<div class="welcome">
  <div class="rv"><span class="kicker">${s.kicker}</span>
    <h1>${s.heading || LESSON.title}</h1>
    <p class="w-sub">${s.subtitle}</p>
    <div class="w-meta"><span>📚 ${LESSON.subject}</span><span>🎓 ${LESSON.grade}</span><span>👩‍🏫 ${LESSON.teacher}</span></div></div>
  <div class="w-art rv"><div class="w-stage"><div class="bubble">${s.bubble}</div><div class="sprite">${s.sprite || '🐱'}</div></div>
    <div class="w-blocks">${scriptHTML(s.blocks || [])}</div></div></div>`;

/* --- التحضير (من لوحة الإدارة) --- */
R.attendance = s => `${head(s)}<div class="rs-host scroll-host" style="flex:1;min-height:0"></div>`;
INIT.attendance = el => Roster.attendance($('.rs-host', el), LESSON_GRADE);

/* --- البطاقات القلابة --- */
R.flip = s => `${head(s)}<div class="flip-grid c${s.cols || s.cards.length}">${s.cards.map((c, i) => `
  <div class="flip rv" style="--c:${c.color || FXC[i%FXC.length]};animation-delay:${i*.08}s"><div class="flip-in">
    <div class="face front"><div class="f-ico">${c.icon}</div><div class="f-q">${c.q}</div><span class="f-tap">👆 اضغطي لكشف الإجابة</span></div>
    <div class="face back"><h4>${c.title}</h4><p>${c.a}</p></div></div></div>`).join('')}</div>
  ${s.link ? `<div class="reveal rv"><div class="rl">${s.link.label}</div><div class="rb">${s.link.text}</div></div>` : ''}`;
INIT.flip = el => {
  $$('.flip', el).forEach(f => f.onclick = () => { f.classList.toggle('on'); Sound.flip(); });
  bindReveal(el);
};
function bindReveal(el){ $$('.reveal', el).forEach(r => r.onclick = () => { if(r.classList.toggle('on')) Sound.pop(); }); }

/* --- الأهداف --- */
R.goals = s => `${head(s)}<div class="goals">${s.items.map((g, i) => `<div class="goal card rv" style="animation-delay:${i*.08}s"><span class="gi">${g.icon}</span><span>${g.text}</span></div>`).join('')}</div>`;
INIT.goals = el => $$('.goal', el).forEach(g => g.onclick = () => { g.classList.toggle('done'); g.querySelector('.gi').dataset.i ??= g.querySelector('.gi').textContent; g.querySelector('.gi').textContent = g.classList.contains('done') ? '✓' : g.querySelector('.gi').dataset.i; Sound.pop(); });

/* --- التمهيد --- */
R.hook = s => `${head(s)}<div class="hook"><div class="rv"><div class="q">${s.question}<small>${s.sub || ''}</small></div>
  <div class="reveal"><div class="rl">💡 اكشفي الإجابة</div><div class="rb">${s.answer}</div></div></div>
  <div class="robot rv">${s.art || '🤖'}</div></div>`;
INIT.hook = bindReveal;

/* --- الاستكشاف (قائمة + تفاصيل) --- */
R.explore = s => `${head(s)}<div class="explore"><div class="ex-list">${s.items.map((it, i) => `<button class="ex-tab rv" data-k="${i}" style="animation-delay:${i*.06}s"><span class="i">${it.icon}</span><span class="n">${it.name}</span><span class="ck"></span></button>`).join('')}</div>
  <div class="ex-panel card rv"><div class="ex-start"><div class="ex-big">${s.startIcon || '👈'}</div><div>${s.startText || 'اختاري من القائمة لتكتشفي…'}</div></div>
  ${s.items.map(it => `<div class="ex-pane"><div class="ex-top"><div class="ex-big">${it.big || it.icon}</div><div><h3>${it.name}</h3>${it.en?`<span class="ex-en">${it.en}</span>`:''}</div></div>
    ${it.html || it.script ? `<div class="shape-demo">${it.html || scriptHTML(it.script)}</div>` : ''}<div class="ex-def">${it.def}</div>${it.eg?`<div class="ex-eg"><span>💡</span><div>${it.eg}</div></div>`:''}</div>`).join('')}</div></div>`;
INIT.explore = el => {
  const tabs = $$('.ex-tab', el), panes = $$('.ex-pane', el);
  tabs.forEach((t, k) => t.onclick = () => {

/* --- خطوات مرقّمة تُكشف بالضغط --- */
R.steps = s => `${head(s)}${s.lead?`<p class="lead rv">${s.lead}</p>`:''}<div class="steps">${s.items.map((it, i) => `<div class="step card rv" style="--c:${it.color};animation-delay:${i*.08}s"><span class="sn">${i+1}</span><h4>${it.icon} ${it.name}</h4><div class="sd">${it.text}</div><span class="tap">👆 اضغطي</span></div>`).join('')}</div>
  ${s.note?`<div class="note rv">${s.note}</div>`:''}`;
INIT.steps = el => $$('.step', el).forEach(st => st.onclick = () => { st.classList.toggle('on'); Sound.pop(); });

/* --- المخطط الانسيابي (يُبنى خطوة بخطوة) بجانب المقطع البرمجي --- */
R.flowchart = s => `${head(s)}<div class="row grow" style="align-items:stretch">
  <div class="card rv" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px">
    <div class="flowchart">${s.nodes.map((n, i) => `${i?'<div class="fc-arrow">⬇</div>':''}<div class="fc-shape fc-${n.shape}">${n.text}</div>`).join('')}</div>
    <div class="row"><button class="btn blue fc-next">➕ الخطوة التالية</button><button class="btn ghost fc-reset">↺</button></div></div>
  ${s.side ? `<div class="card rv" style="width:620px;padding:26px 30px;display:flex;flex-direction:column;gap:16px"><h4 style="font-size:32px;font-weight:900">${s.side.title}</h4><div class="lead" style="margin:0">${s.side.text}</div></div>` : ''}</div>`;
INIT.flowchart = el => {
  const items = $$('.flowchart > *', el); let k = 0;
  $('.fc-next', el).onclick = () => {
    if(k >= items.length) return;
    items[k].classList.add('on'); if(items[k].classList.contains('fc-arrow')) items[++k]?.classList.add('on'); k++;
    Sound.pop(); if(k >= items.length){ Sound.ok(); addPoint(el.id + 'fc'); }
  };
  $('.fc-reset', el).onclick = () => { items.forEach(i => i.classList.remove('on')); k = 0; Sound.flip(); };
};

/* --- اختيار من متعدد (سؤال أو أكثر) --- */
const mcqHTML = (q, id) => `<div class="qgroup" data-id="${id}"><div class="q-box card"><span class="q-ico">${q.icon || '❓'}</span><span>${q.q}</span></div>
  <div class="opts">${q.options.map((o, k) => `<button class="opt" data-ok="${k === q.answer ? 1 : 0}"><span>${o}</span><span class="l">${LETTERS[k]}</span></button>`).join('')}</div>
  <div class="fb"></div>${q.explain?`<div class="explain">${q.explain}</div>`:''}</div>`;
R.mcq = s => {
  const qs = s.questions || [s];
  if(qs.length === 1) return head(s) + `<div class="mid rv">${mcqHTML(qs[0], 0)}</div>`;
  return head(s) + `<div class="multi rv"><div class="m-top"><span>السؤال <b class="m-n">1</b> من ${qs.length}</span><div class="m-dots">${qs.map((_, i) => `<i class="${i?'':'on'}"></i>`).join('')}</div></div>
    <div class="mid">${qs.map((q, i) => `<div class="mq${i?'':' show'}">${mcqHTML(q, i)}</div>`).join('')}</div>
    <div class="m-nav"><button class="btn ghost m-prev">→ السابق</button><button class="btn blue m-next">التالي ←</button></div></div>`;
};
INIT.mcq = el => {
  $$('.opt', el).forEach(b => b.onclick = () => {
    const g = b.closest('.qgroup'); if(g.classList.contains('solved')) return;
    const fb = $('.fb', g);
    if(b.dataset.ok === '1'){
      b.classList.add('ok'); g.classList.add('solved'); $$('.opt', g).forEach(x => x.disabled = true);
      fb.className = 'fb ok'; fb.textContent = ['أحسنتِ! 🎉','رائع يا مبرمجة! 🌟','إجابة صحيحة ✅'][Math.floor(Math.random()*3)];
      Sound.ok(); burstFrom(b); addPoint(el.id + 'q' + g.dataset.id);
    } else { b.classList.add('no'); b.disabled = true; fb.className = 'fb no'; fb.textContent = 'حاولي مرة أخرى 💪'; Sound.no(); }
  });
  const mqs = $$('.mq', el); if(!mqs.length) return;
  let k = 0;
  const show = d => { k = Math.max(0, Math.min(mqs.length - 1, k + d)); mqs.forEach((m, i) => m.classList.toggle('show', i === k)); $$('.m-dots i', el).forEach((x, i) => x.classList.toggle('on', i <= k)); $('.m-n', el).textContent = k + 1; Sound.flip(); };
  $('.m-next', el).onclick = () => show(1); $('.m-prev', el).onclick = () => show(-1);
};

/* --- صح أم خطأ --- */
R.tf = s => `${head(s)}<div class="tf scroll">${s.items.map((it, i) => `<div class="tf-row card rv" data-a="${it.answer?1:0}" style="animation-delay:${i*.06}s">
  <span class="n">${i+1}</span><span class="t">${it.text}</span><div class="bt"><button class="btn sm green" data-v="1">✔ صحيحة</button><button class="btn sm" style="background:var(--red);color:#fff" data-v="0">✖ خطأ</button></div>
  <div class="fix">${it.answer ? '✅ صحيحة' : '💡 التصحيح: ' + it.fix}</div></div>`).join('')}</div>`;
INIT.tf = el => $$('.tf-row', el).forEach((r, i) => $$('button', r).forEach(b => b.onclick = () => {
  if(r.classList.contains('ok')) return;
  if(b.dataset.v === r.dataset.a){ r.classList.add('ok'); Sound.ok(); burstFrom(b); addPoint(el.id + 'tf' + i); }
  else { Sound.no(); r.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}], 300); }
}));

/* --- التوصيل --- */
R.match = s => {
  const rights = shuffle(s.pairs.map((p, i) => ({t:p.b, i})));
  return `${head(s)}<div class="match"><div class="m-col">${s.pairs.map((p, i) => `<button class="m-item rv" data-side="a" data-i="${i}"><span class="tag">${i+1}</span>${p.a}</button>`).join('')}</div>
    <div class="m-col">${rights.map(r => `<button class="m-item rv" data-side="b" data-i="${r.i}"><span class="tag">؟</span>${r.t}</button>`).join('')}</div></div>`;
};
INIT.match = el => {
  let sel = null, done = 0; const n = $$('[data-side=a]', el).length;
  $$('.m-item', el).forEach(b => b.onclick = () => {
    if(b.classList.contains('done')) return;
    if(!sel || sel.dataset.side === b.dataset.side){ $$('.m-item.sel', el).forEach(x => x.classList.remove('sel')); sel = b; b.classList.add('sel'); Sound.pop(); return; }
    if(sel.dataset.i === b.dataset.i){
      [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
      $('.tag', b.dataset.side === 'b' ? b : sel).textContent = +b.dataset.i + 1;
      Sound.ok(); burstFrom(b); if(++done === n){ addPoint(el.id + 'm'); toast('أحسنتِ! وصّلتِ الكل 🎉', 'ok'); }
    } else { [sel, b].forEach(x => { x.classList.add('bad'); setTimeout(() => x.classList.remove('bad', 'sel'), 400); }); Sound.no(); }
    sel = null;
  });
};

/* --- ترتيب الخطوات --- */
R.order = s => `${head(s)}${s.lead?`<p class="lead rv">${s.lead}</p>`:''}<div class="order">
  <div class="o-pool rv">${shuffle(s.items.map((t, i) => ({t, i}))).map(o => `<button class="o-item" data-i="${o.i}">${o.t}</button>`).join('')}
    <button class="btn ghost o-reset" style="margin-top:auto">↺ إعادة</button></div>
  <div style="display:flex;flex-direction:column" class="rv"><ol class="o-done"></ol><div class="o-msg"></div></div></div>`;
INIT.order = el => {
  let next = 0; const n = $$('.o-item', el).length, done = $('.o-done', el), msg = $('.o-msg', el);
  $$('.o-item', el).forEach(b => b.onclick = () => {
    if(+b.dataset.i === next){
      b.disabled = true; done.insertAdjacentHTML('beforeend', `<li><i>${next+1}</i>${b.innerHTML}</li>`); next++; Sound.pop();
      if(next === n){ msg.textContent = '🎉 ترتيب صحيح! أحسنتِ'; Sound.ok(); burstFrom(done); addPoint(el.id + 'o'); }
    } else { Sound.no(); b.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'none'}], 300); msg.textContent = ''; }
  });
  $('.o-reset', el).onclick = () => { next = 0; done.innerHTML = ''; msg.textContent = ''; $$('.o-item', el).forEach(b => b.disabled = false); Sound.flip(); };
};

/* --- فكري - زاوجي - شاركي --- */
R.tps = s => `${head(s)}<div class="q-box card rv"><span class="q-ico">💭</span><span>${s.question}</span></div>
  <div class="tps">${[['🤔','فكّري','وحدكِ… اكتبي خطوات الخوارزمية في دفترك'],['👭','زاوجي','قارني خطواتكِ مع زميلتكِ وأكملا الناقص'],['📢','شاركي','اعرضا الخوارزمية على الصف']].map(([i, n, h], k) => `
    <div class="phase card rv" data-sec="${s.times[k]}"><span class="pi">${i}</span><h4>${n}</h4><p>${h}</p><span class="tm">${fmt(s.times[k])}</span></div>`).join('')}</div>
  ${s.answer ? `<div class="reveal rv"><div class="rl">💡 نموذج إجابة</div><div class="rb">${s.answer}</div></div>` : ''}`;
const fmt = t => `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
INIT.tps = el => {
  bindReveal(el);
  $$('.phase', el).forEach(p => p.onclick = () => {
    $$('.phase', el).forEach(x => { x.classList.remove('on'); clearInterval(x._t); });
    p.classList.add('on'); Sound.pop();
    let left = +p.dataset.sec; const tm = $('.tm', p);
    tm.classList.remove('warn'); tm.textContent = fmt(left);
    p._t = setInterval(() => { left--; tm.textContent = fmt(Math.max(0, left)); if(left <= 10) tm.classList.add('warn'); if(left <= 0){ clearInterval(p._t); Sound.ok(); } }, 1000);
  });
};
STOP.push(el => $$('.phase', el).forEach(x => clearInterval(x._t)));

/* --- معلومة / لمحة تاريخية --- */
R.info = s => `${head(s)}<div class="info" style="--c:${s.color || 'var(--purple)'}"><div class="art rv">${s.art}</div>
  <div class="rv"><span class="tag">${s.tag}</span><div class="txt">${s.text}</div>${s.note?`<div class="note">${s.note}</div>`:''}</div></div>`;

/* --- تطبيق عملي على الحاسب مع مؤقت --- */
R.practice = s => `${head(s)}<div class="practice"><div><p class="lead rv">${s.lead}</p><ul class="pr-list">${s.items.map((t, i) => `<li class="card rv" style="animation-delay:${i*.07}s"><i>${i+1}</i><span>${t}</span></li>`).join('')}</ul></div>
  <div class="pr-side card rv"><div class="timer" data-sec="${s.minutes*60}"><div class="t-ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="t-num">${fmt(s.minutes*60)}</div></div>
    <div class="row"><button class="btn green t-go">▶ ابدئي</button><button class="btn ghost t-rs">↺</button></div></div>
    ${s.link ? `<a class="btn blue" href="${s.link}" target="_blank" style="text-decoration:none">🐱 افتحي سكراتش</a>` : ''}</div></div>`;
INIT.practice = el => {
  const t = $('.timer', el), total = +t.dataset.sec, fg = $('.fg', t), num = $('.t-num', t), go = $('.t-go', el);
  let left = total;
  const paint = () => { num.textContent = fmt(left); fg.style.strokeDashoffset = 276.5 * (1 - left/total); t.classList.toggle('warn', left <= 30); };
  go.onclick = () => {
    if(t._id){ clearInterval(t._id); t._id = null; go.textContent = '▶ متابعة'; return; }
    go.textContent = '⏸ إيقاف'; Sound.pop();
    t._id = setInterval(() => { left--; paint(); if(left <= 0){ clearInterval(t._id); t._id = null; Sound.ok(); go.textContent = '▶ ابدئي'; left = total; } }, 1000);
  };
  $('.t-rs', el).onclick = () => { clearInterval(t._id); t._id = null; left = total; paint(); go.textContent = '▶ ابدئي'; };
};
STOP.push(el => { const t = $('.timer', el); if(t && t._id){ clearInterval(t._id); t._id = null; const g = $('.t-go', el); if(g) g.textContent = '▶ متابعة'; } });

/* --- الملخص --- */
R.recap = s => `${head(s)}<div class="recap">${s.items.map((it, i) => `<div class="rc card rv" style="--c:${it.color};animation-delay:${i*.06}s"><span class="ri">${it.icon}</span><h4>${it.title}</h4><p>${it.text}</p></div>`).join('')}</div>`;
INIT.recap = el => $$('.rc', el).forEach(c => c.onclick = () => { c.classList.toggle('on'); Sound.pop(); });

/* --- الختام --- */
R.closing = s => `<div class="closing"><div class="ci rv">${s.icon || '🏆'}</div><h1 class="rv">${s.title}</h1>
  <div class="sc rv">⭐ نقاط الصف اليوم: <b class="pts">0</b></div>${s.hw?`<div class="hw rv">${s.hw}</div>`:''}
  <button class="btn orange rv cl-clap">👏 صفّقن لأنفسكن</button></div>`;
INIT.closing = el => { $('.cl-clap', el).onclick = clap; };

/* ==================================================================
   🎮 المحاكيات
   ================================================================== */
/* --- محاكي سكراتش: يعرض المقاطع البرمجية ويشغّلها على المنصة ---
   sprites: [{name, e | costumes:[{n,e}], x, y, dir, size, color, faceLeft, scripts:[[...]]}]
   versions: [{label, scripts:{اسم الكائن:[[...]]}}]  نسخ مختلفة من المقاطع
   tasks: [{text, test:(e, vm) => bool}]   table: {head:[..], rows:[..]}   pad:true أزرار الأسهم */
R.vm = s => `${head(s)}<div class="vm-wrap">
  <div class="vm-left">
    <div class="pane rv grow"><h5>🧩 المقاطع البرمجية ${s.versions ? `<span class="sp vm-vers">${s.versions.map((v, i) => `<button data-v="${i}" class="${i?'':'on'}">${v.label}</button>`).join('')}</span>` : ''}</h5><div class="workspace vm-code"></div></div>
    ${s.tasks ? `<div class="pane rv" style="flex:none"><h5>🎯 مهامّكِ</h5><div class="vm-tasks">${s.tasks.map((t, i) => `<div class="mission" data-t="${i}"><span>⬜ ${t.text}</span></div>`).join('')}</div></div>` : ''}
    ${s.table ? `<div class="pane rv" style="flex:none"><h5>🧪 ${s.table.title || 'جدول الاختبار'}</h5><table class="vm-table"><tr><th>${s.table.head[0]}</th>${s.table.rows.map(r => `<td class="k" data-r="${r}">${r}</td>`).join('')}</tr><tr><th>${s.table.head[1]}</th>${s.table.rows.map(r => `<td data-o="${r}">…</td>`).join('')}</tr></table></div>` : ''}
    ${s.note ? `<div class="note rv" style="margin:0;font-size:23px">${s.note}</div>` : ''}
  </div>
  <div class="stagebox rv"><div class="st-bar"><button class="flag" title="تشغيل">⚑</button><button class="stop" title="إيقاف">⬣</button><span class="st-name">${s.hint || '🖥️ المنصة'}</span></div>
    <div class="vm-stage bg-${s.bg || 'white'}"><div class="vm-mon"${s.monitor ? '' : ' style="display:none"'}>الإجابة <b></b></div><div class="vm-ask"><input placeholder="اكتبي إجابتكِ هنا ثم Enter…"><button>✔</button></div></div>
    ${s.pad ? `<div class="vm-pad">${[['السهم الأيسر','◀'],['السهم العلوي','▲'],['السهم السفلي','▼'],['السهم الأيمن','▶']].map(([k, t]) => `<button data-key="${k}">${t}</button>`).join('')}</div>` : ''}
    <div class="sim-msg"></div></div></div>`;
INIT.vm = (el, s) => {
  const msg = $('.sim-msg', el), done = new Set();
  let row = null, said = false;
  const setMsg = (t, ok=true) => { msg.className = 'sim-msg ' + (ok ? 'ok' : 'no'); msg.textContent = t; };
  function onEvent(e, vm){
    if(s.table){
      const keys = s.table.rows.map(String), cell = r => $(`[data-o="${r}"]`, el);
      const mark = r => $$('.vm-table td', el).forEach(td => td.classList.toggle('now', r != null && (td.dataset.r === r || td.dataset.o === r)));
      if(e.type === 'flag'){ row = null; said = false; mark(null); }
      if(e.type === 'answer'){ const v = String(e.val).trim(); row = keys.includes(v) ? v : null; said = false; mark(row); if(!row) setMsg('💡 جرّبي القيم الموجودة في الجدول', false); else msg.textContent = ''; }
      if(e.type === 'say' && row && !said){ said = true; const td = cell(row); td.textContent = e.val; td.className = 'got'; }
      if(e.type === 'end' && row){
        if(!said){ const td = cell(row); td.textContent = '🤐 لا يقول شيئًا!'; td.className = 'nil'; Sound.no(); }
        mark(null); row = null;
        if(keys.every(r => cell(r).className)){ addPoint(el.id + 'tb'); if(s.table.done) setMsg(s.table.done, !s.table.bad); }
      }
    }
    if(s.tasks) s.tasks.forEach((t, i) => {
      if(done.has(i) || !t.test(e, vm)) return;
      done.add(i); const m = $(`[data-t="${i}"] span`, el); m.textContent = '✅ ' + t.text; m.classList.add('ok'); Sound.ok();
      if(done.size === s.tasks.length){ addPoint(el.id + 'vm'); setMsg(s.done || '🎉 أنجزتِ كل المهام!'); burstFrom($('.vm-stage', el)); }
    });
    if(e.type === 'end' && !s.tasks && !s.table){ addPoint(el.id + 'vm'); if(s.done) setMsg(s.done); }
    if(e.type === 'stopall' && s.over) setMsg(s.over, false);
    if(e.type === 'flag' && !s.table) msg.textContent = '';
  }
  const M = VM(el, s, onEvent);
  if(s.versions){
    const apply = i => { M.stopAll(); M.build(s.versions[i].scripts); $$('.vm-vers button', el).forEach((b, j) => b.classList.toggle('on', i === j)); msg.textContent = s.versions[i].tip || ''; msg.className = 'sim-msg'; };
    $$('.vm-vers button', el).forEach(b => b.onclick = () => { apply(+b.dataset.v); Sound.flip(); });
    apply(0);
  }
  el._onShow = () => M.show();
  el._leave = () => M.leave();
};

/* --- آلة المقارنة: أكبر من / أصغر من / يساوي --- */
R.cmp = s => `${head(s)}<div class="cmp-sim">
  <div class="card rv cmp-main">
    <div class="cmp-blk"><input class="ca" value="${s.a ?? 15}"><span class="op">&lt;</span><input class="cb2" value="${s.b ?? 50}"></div>
    <div class="cmp-ops">${[['lt','<','أصغر من'],['gt','>','أكبر من'],['eq','=','يساوي']].map(([k, o, n], i) => `<button data-op="${k}" class="${i?'':'on'}">${o} ${n}</button>`).join('')}</div>
    <button class="btn green cmp-go">🔍 افحصي الشرط</button>
    <div class="cmp-res"></div></div>
  <div class="card rv" style="padding:24px 30px;display:flex;flex-direction:column;gap:14px">
    <h4 style="font-size:30px;font-weight:900">🎯 تحدّيات سريعة</h4>
    ${s.challenges.map((c, i) => `<div class="mission" data-t="${i}" style="font-size:25px;padding:6px 0"><span>⬜ ${c.text}</span></div>`).join('')}
    <div class="note" style="font-size:23px;margin-top:auto">💡 الشرط له نتيجتان فقط: <b>صحيحة true</b> أو <b>خطأ false</b></div></div></div>`;
INIT.cmp = (el, s) => {
  let op = 'lt'; const res = $('.cmp-res', el), done = new Set();
  const SYM = { lt:'<', gt:'>', eq:'=' };
  $$('[data-op]', el).forEach(b => b.onclick = () => { op = b.dataset.op; $$('[data-op]', el).forEach(x => x.classList.toggle('on', x === b)); $('.op', el).textContent = SYM[op]; res.className = 'cmp-res'; res.textContent = ''; Sound.pop(); });
  $$('input', el).forEach(i => i.oninput = () => { res.className = 'cmp-res'; res.textContent = ''; });
  $('.cmp-go', el).onclick = () => {
    const a = $('.ca', el).value, b = $('.cb2', el).value, c = cmpv(a, b);
    const r = op === 'lt' ? c < 0 : op === 'gt' ? c > 0 : c === 0;
    res.className = 'cmp-res ' + (r ? 't' : 'f'); res.textContent = r ? '✅ صحيحة true' : '❌ خطأ false';
    r ? Sound.ok() : Sound.no();
    s.challenges.forEach((ch, i) => {
      if(done.has(i) || !ch.test(+a, op, +b, r)) return;
      done.add(i); const m = $(`[data-t="${i}"] span`, el); m.textContent = '✅ ' + ch.text; m.classList.add('ok'); burstFrom(m);
      if(done.size === s.challenges.length) addPoint(el.id + 'cmp');
    });
  };
};

/* --- البوصلة: لبنة اتجه نحو الاتجاه --- */
R.dir = s => `${head(s)}<div class="dir-sim">
  <div class="compass rv"><div class="ray"></div><div class="cat">${s.sprite || '🐈'}</div>
    ${[0,45,90,135,180,-135,-90,-45].map(d => { const a = d*Math.PI/180; return `<div class="arr"><button data-d="${d}" style="left:${Math.sin(a)*218}px;top:${-Math.cos(a)*218}px">${d}</button></div>`; }).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:22px">
    <div class="card rv" style="padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="script"><div class="sb motion">اتجه نحو الاتجاه <input class="in dir-in" value="90" inputmode="numeric" style="width:90px"></div></div>
      <div class="lead" style="margin:0;text-align:center;font-size:28px">اكتبي رقمًا بين <b>-180</b> و <b>180</b> أو اضغطي على البوصلة</div></div>
    <div class="info-dirs card rv" style="padding:22px 28px;font-size:27px;font-weight:700;line-height:1.9">
      ⬆️ <b>0</b> للأعلى &nbsp; ➡️ <b>90</b> لليمين<br>⬇️ <b>180</b> للأسفل &nbsp; ⬅️ <b>-90</b> لليسار</div>
    <div class="note rv" style="margin:0">${s.note || ''}</div></div></div>`;
INIT.dir = (el, s) => {
  const cat = $('.cat', el), ray = $('.ray', el), inp = $('.dir-in', el), seen = new Set();
  const set = d => {
    d = norm(+d || 0);
    cat.style.transform = `rotate(${d - 90}deg) ${s.faceLeft === false ? '' : 'scaleX(-1)'}`;
    ray.style.transform = `rotate(${d - 90}deg)`;
    $$('[data-d]', el).forEach(b => b.classList.toggle('on', +b.dataset.d === d));
    seen.add(d); if(seen.size >= 5) addPoint(el.id + 'dir');
  };
  $$('[data-d]', el).forEach(b => b.onclick = () => { inp.value = b.dataset.d; set(b.dataset.d); Sound.pop(); });
  inp.oninput = () => set(inp.value);
  set(90);
};

/* --- جدول المهارات (مثل الأهداف لكن بحجم أصغر) --- */
R.skills = s => R.goals(s).replace('class="goals"', 'class="goals compact"');
INIT.skills = el => INIT.goals(el);

/* ==================================================================
   🚀 البناء والتنقل
   ================================================================== */
const host = $('#slides');
SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide'; el.id = 's' + i;
  el.innerHTML = R[s.type](s, i);
  host.appendChild(el);
});
const els = $$('.slide', host);
SLIDES.forEach((s, i) => INIT[s.type]?.(els[i], s));
$('#total').textContent = SLIDES.length;
$('#brandName').textContent = LESSON.title;
$('#brandSub').textContent = `${LESSON.unit} • ${LESSON.lessonNo}`;

let cur = 0;
function play(el){ el.classList.remove('play'); void el.offsetWidth; el.classList.add('play'); }
function go(n){
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if(n === cur) return;
  const old = els[cur], nw = els[n], dir = n > cur ? 'n' : 'p';
  STOP.forEach(f => f(old)); old._leave?.();
  old.className = 'slide out'; setTimeout(() => { if(!old.classList.contains('active')) old.className = 'slide'; }, 380);
  nw.className = `slide active fx-${(SLIDES[n].fx || 'slide')}${SLIDES[n].fx === 'slide' || !SLIDES[n].fx ? '-' + dir : ''}`;
  cur = n; play(nw); nw._onShow?.(); updateUI(); Sound.flip();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
function updateUI(){
  $('#num').textContent = cur + 1;
  $('#btnPrev').disabled = cur === 0; $('#btnNext').disabled = cur === SLIDES.length - 1;
  $('#progFill').style.width = (cur / (SLIDES.length - 1) * 100) + '%';
  history.replaceState(null, '', '#' + (cur + 1));
}
$('#btnNext').onclick = next; $('#btnPrev').onclick = prev;
$('#btnClap').onclick = clap;
$('#btnFs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
Roster.drawButton($('#btnClap'));

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA'){ if(e.key === 'Escape') e.target.blur(); return; }
  if(KEYTRAP && KEYTRAP(e, true)) return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace'){ e.preventDefault(); prev(); }
  else if(e.key === 'ت' || e.code === 'KeyF'){ e.preventDefault(); if(!e.repeat) clap(); }
  else if(e.key === 'Home'){ e.preventDefault(); go(0); }
  else if(e.key === 'End'){ e.preventDefault(); go(SLIDES.length - 1); }
});
document.addEventListener('keyup', e => { if(KEYTRAP) KEYTRAP(e, false); });
addEventListener('wheel', e => { if(!e.target.closest('.scroll, .rs-grid, .workspace, .palette, .sp-list, .lib-grid, .cos-list, .vm-code')) e.preventDefault(); }, {passive:false});
addEventListener('touchmove', e => { if(!e.target.closest('.scroll, .rs-grid, .workspace, .palette, .sp-list, .lib-grid, .cos-list, .vm-code, input')) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if(!e.target.closest('.sp-list')) e.preventDefault(); });

/* إخفاء الشريط عند عدم تحريك الفأرة */
const controls = $('#controls'); let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if(!controls.matches(':hover')) document.body.classList.add('idle'); }, 2600); }
['mousemove','mousedown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive:true}));

/* ملاءمة المسرح للشاشة */
const stage = $('#stage');
function fit(){ stage.style.transform = `scale(${Math.min(innerWidth/1600, innerHeight/900)})`; els[cur]._onShow?.(); }
addEventListener('resize', fit); fit();

(function start(){
  const h = parseInt((location.hash || '').slice(1), 10);
  cur = (h >= 1 && h <= SLIDES.length) ? h - 1 : 0;
  els[cur].classList.add('active', 'fx-zoom'); play(els[cur]); els[cur]._onShow?.();
  updateUI(); wake();
})();
</script>
</body>
</html>
