<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التنسيق المتقدم في إكسل | عرض تفاعلي</title>
<!-- خط عربي واضح (إن لم يتوفر الإنترنت سيُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والمتغيرات العامة
   ========================================================= */
:root{
  --p900:#0B3D23; --p800:#0E5A32; --p700:#107C41; --p600:#1D9A55; --p500:#33B56E;
  --p400:#6FCF97; --p300:#A7E3C1; --p200:#CDEFDB; --p100:#E3F6EA; --p50:#F4FBF7;
  --accent:#FFB84C; --accent2:#FFD66B; --pink:#F472B6; --teal:#14B8A6;
  --ok:#15803D; --okbg:#DCFCE7; --okbd:#86EFAC;
  --bad:#BE123C; --badbg:#FFE4E6; --badbd:#FDA4AF;
  --ink:#10241A; --muted:#5B6B62; --white:#fff;
  --dark:#16261D;
  --mono:'Cascadia Code','Consolas','Menlo','DejaVu Sans Mono','Courier New','Tajawal',monospace;
  --shadow:0 14px 40px rgba(11,61,35,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#052E16}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.idle{cursor:none}
button,input{font-family:inherit}
button{cursor:pointer}
input{-webkit-user-select:text;user-select:text}
b,strong{font-weight:800}

/* =========================================================
   2) مسرح العرض 16:9 (1920×1080) يتم تكبيره/تصغيره ليملأ الشاشة
   ========================================================= */
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 30% 20%,#14532D,#052E16 70%)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
  background:var(--p50);overflow:hidden;
  background-image:radial-gradient(rgba(29,154,85,.10) 2px,transparent 2px);background-size:44px 44px}
#stage::before,#stage::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none;z-index:0}
#stage::before{width:720px;height:720px;top:-300px;right:-240px;background:radial-gradient(circle,rgba(111,207,151,.35),transparent 70%)}
#stage::after{width:640px;height:640px;bottom:-280px;left:-220px;background:radial-gradient(circle,rgba(255,184,76,.25),transparent 70%)}
#slides{position:absolute;inset:0;z-index:1}

/* شريط التقدم أعلى الشاشة */
#progress{position:absolute;top:0;left:0;right:0;height:8px;background:rgba(29,154,85,.12);z-index:40}
#progress span{display:block;height:100%;width:0;background:linear-gradient(270deg,#2FB36A,#FFB84C);transition:width .6s cubic-bezier(.2,.8,.2,1);border-radius:0 0 0 8px}

/* =========================================================
   3) الشرائح وتأثيرات الانتقال
   ========================================================= */
.slide{position:absolute;inset:0;padding:58px 100px 128px;display:flex;flex-direction:column;gap:22px;
  opacity:0;visibility:hidden;pointer-events:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;z-index:2}
.slide.active.t-fade{animation:sFade .7s ease both}
.slide.active.t-zoom{animation:sZoom .75s cubic-bezier(.2,.8,.2,1) both}
.slide.active.t-slide.fwd{animation:sSlideF .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active.t-slide.back{animation:sSlideB .7s cubic-bezier(.2,.8,.2,1) both}
.slide.leaving{visibility:visible;z-index:1;animation:sOut .45s ease both;pointer-events:none}
@keyframes sFade{from{opacity:0}to{opacity:1}}
@keyframes sZoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes sSlideF{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes sSlideB{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes sOut{from{opacity:1}to{opacity:0;transform:scale(.97)}}

/* ظهور العناصر بالتتابع */
.slide.active .anim{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 180ms)}
@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}

/* رأس الشريحة */
.shead{display:flex;flex-direction:column;align-items:flex-start;gap:12px;flex-shrink:0}
.badge{font-size:26px;font-weight:700;background:var(--p100);color:var(--p700);padding:8px 24px;border-radius:999px;border:2px solid var(--p200)}
.stitle{font-size:62px;font-weight:900;color:var(--p900);line-height:1.2}
.ssub{font-size:32px;color:var(--muted)}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}
.row-center{display:flex;justify-content:center;gap:18px}

/* زر إعادة الشريحة */
.slide-reset{position:absolute;top:44px;left:56px;width:58px;height:58px;border-radius:50%;border:none;background:#fff;color:var(--p600);
  font-size:30px;box-shadow:var(--shadow);opacity:.55;z-index:5;transition:opacity .2s,transform .2s}
.slide-reset:hover{opacity:1;transform:rotate(-90deg)}

/* =========================================================
   4) عناصر مشتركة (أزرار، كود، نتائج)
   ========================================================= */
.btn{font-size:30px;font-weight:700;padding:16px 34px;border-radius:18px;border:none;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#1D9A55,#178A4A);color:#fff;box-shadow:0 10px 24px rgba(29,154,85,.35)}
.btn-soft{background:var(--p100);color:var(--p700)}
.btn-soft:hover{background:var(--p200)}
.btn-clap{background:linear-gradient(135deg,#FFD66B,#FFB84C);color:#4A2A00;font-size:38px;padding:20px 44px;border-radius:24px;box-shadow:0 12px 26px rgba(255,184,76,.45)}

code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;background:var(--p100);color:var(--p700);padding:1px 12px;border-radius:10px;font-size:.88em;font-weight:700}

/* صندوق الكود (داكن) */
.code{position:relative;direction:ltr;text-align:left;background:var(--dark);color:#EDEAFF;font-family:var(--mono);
  font-size:34px;line-height:1.5;padding:48px 32px 24px;border-radius:24px;white-space:pre;overflow:hidden;box-shadow:0 14px 30px rgba(11,30,20,.25)}
.code::before{content:"";position:absolute;top:18px;left:22px;width:14px;height:14px;border-radius:50%;background:#FF5F57;box-shadow:24px 0 #FEBC2E,48px 0 #28C840}
.code.sm{font-size:26px;padding:42px 24px 18px}
.code.xs{font-size:23px;line-height:1.38;padding:38px 20px 14px}
.code.lg{font-size:42px}
/* ألوان الكود على الخلفية الداكنة */
.dk .t-kw,.code .t-kw{color:#FF9E64;font-weight:700}
.dk .t-bool,.code .t-bool{color:#FFCB6B;font-weight:700}
.dk .t-fn,.code .t-fn{color:#D6A8FF}
.dk .t-str,.code .t-str{color:#A5E07A}
.dk .t-num,.code .t-num{color:#7FDBFF}
.dk .t-op,.code .t-op{color:#FF8AC8}
.dk .t-com,.code .t-com{color:#7F7A9E}
/* كود داخل السطر (خلفية فاتحة) */
.icode{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.icode .t-kw{color:#C2410C}.icode .t-bool{color:#B45309}.icode .t-fn{color:#7E22CE}
.icode .t-str{color:#15803D}.icode .t-num{color:#0369A1}.icode .t-op{color:#BE185D}

.pill{display:inline-block;font-family:var(--mono);font-weight:800;padding:6px 28px;border-radius:999px;font-size:40px;direction:ltr;unicode-bidi:isolate}
.pill.true{background:var(--okbg);color:var(--ok);border:3px solid var(--okbd)}
.pill.false{background:var(--badbg);color:var(--bad);border:3px solid var(--badbd)}

/* رسائل التغذية الراجعة */
.fb{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;flex-shrink:0}
.fb-main{font-size:46px;font-weight:900}
.fb-main.ok{color:var(--ok)}
.fb-main.bad{color:#BE185D}
.fb-explain{font-size:30px;color:#344A3E;background:#fff;padding:12px 30px;border-radius:18px;box-shadow:var(--shadow);line-height:1.6}

.note{font-size:28px;background:#FFF7E6;border-right:8px solid var(--accent);padding:14px 26px;border-radius:16px;color:#5B4A1F;flex-shrink:0;line-height:1.5}
.tag{font-size:30px;font-weight:700;background:#fff;padding:10px 28px;border-radius:999px;box-shadow:var(--shadow);color:var(--p800)}

/* =========================================================
   5) المؤقت (عداد تنازلي)
   ========================================================= */
.timer{display:flex;align-items:center;gap:12px;direction:ltr}
.tm-ring{position:relative;width:96px;height:96px}
.tm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring circle{fill:none;stroke-width:9}
.tm-bg{stroke:var(--p100)}
.tm-fg{stroke:var(--p600);stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.warn .tm-fg{stroke:#F43F5E}
.tm-txt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:25px;font-weight:800;color:var(--p900)}
.tm-play,.tm-reset{width:60px;height:60px;border-radius:50%;border:none;background:var(--p600);color:#fff;font-size:24px;transition:transform .15s}
.tm-play:hover,.tm-reset:hover{transform:scale(1.08)}
.tm-reset{background:var(--p100);color:var(--p700);font-size:28px}
.timer.running .tm-ring{animation:beat 1s ease-in-out infinite}
.timer.sm .tm-ring{width:76px;height:76px}.timer.sm .tm-txt{font-size:21px}
.timer.sm .tm-play,.timer.sm .tm-reset{width:50px;height:50px;font-size:20px}
@keyframes beat{50%{transform:scale(1.05)}}

/* =========================================================
   6) شريحة الترحيب والختام
   ========================================================= */
.welcome,.closing{height:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:center}
.w-text,.cl-text{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.chip{font-size:28px;font-weight:700;background:#fff;color:var(--p700);padding:10px 26px;border-radius:999px;box-shadow:var(--shadow)}
.w-title{font-size:96px;font-weight:900;line-height:1.18;background:linear-gradient(135deg,#0E5A32,#178A4A 60%,#0D9488);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:8px}
.w-sub{font-size:38px;color:var(--muted);font-weight:500}
.w-teacher{font-size:32px;font-weight:700;background:var(--p600);color:#fff;padding:12px 30px;border-radius:18px}
.w-start{font-size:26px;color:var(--muted)}
kbd{font-family:var(--mono);background:#fff;border:2px solid var(--p200);border-bottom-width:4px;border-radius:8px;padding:0 10px;color:var(--p700);font-size:.9em}
.w-visual{position:relative}
.floaty{position:absolute;font-size:74px;animation:floaty 4.5s ease-in-out infinite alternate;pointer-events:none}
.floaty.d2{animation-delay:-1.5s}.floaty.d3{animation-delay:-3s}
@keyframes floaty{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}


.cl-emoji{font-size:110px;line-height:1;animation:floaty 3s ease-in-out infinite alternate}
.cl-title{font-size:84px;font-weight:900;color:var(--p900);line-height:1.2}
.cl-msg{font-size:38px;color:#344A3E;line-height:1.6}
.cl-next{font-size:30px;color:var(--p700);font-weight:700}
.cl-task{font-size:30px;background:#FFF7E6;border:2px dashed var(--accent);padding:12px 26px;border-radius:18px;color:#5B4A1F}

/* =========================================================
   7) بطاقات قلب (أهداف + مراجعة)
   ========================================================= */
.obj-grid,.rev-grid{flex:1;min-height:0;display:grid;gap:24px}
.obj-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.rev-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
.flip{perspective:1400px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip:hover .flip-in{transform:translateY(-4px)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:24px 30px;text-align:center;box-shadow:var(--shadow)}
.front{background:#fff;border:3px solid var(--p100)}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1D9A55,#2FB36A);color:#fff}
.face.back code{background:rgba(255,255,255,.22);color:#fff}
.f-ico{font-size:78px;line-height:1}
.front b{font-size:40px;color:var(--p900)}
.front small{font-size:24px;color:var(--muted)}
.obj-grid .back p{font-size:40px;font-weight:700;line-height:1.55}
.rev-grid .f-ico{font-size:60px}
.rev-grid .front b{font-size:32px;line-height:1.4}
.rev-grid .back p{font-size:32px;font-weight:700;line-height:1.55}
.mode-bar{display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:12px 18px;box-shadow:var(--shadow);flex-shrink:0;border:3px dashed var(--p200)}
.mode-lbl{font-size:30px;font-weight:800;color:var(--p700);white-space:nowrap}
.mode-show{flex:1;display:flex;align-items:center;gap:16px;background:var(--p50);border-radius:18px;padding:6px 22px;transition:background .3s}
.mode-show.picked{background:#FFF3D6}
.mode-ico{font-size:50px;line-height:1}
.mode-txt{font-size:36px;color:var(--p900)}
.rev-grid .flip:nth-child(4n+2) .back{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.rev-grid .flip:nth-child(4n+3) .back{background:linear-gradient(135deg,#10B981,#0EA5E9)}
.rev-grid .flip:nth-child(4n+4) .back{background:linear-gradient(135deg,#F59E0B,#EC4899)}

/* =========================================================
   8) الاختيار من متعدد
   ========================================================= */
.mcq{flex:1;min-height:0;display:grid;gap:44px;align-content:center}
.mcq.with-side{grid-template-columns:1fr 1.05fr;align-items:center}
.mcq-opts{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mcq.with-side .mcq-opts{grid-template-columns:1fr;gap:18px}
.mcq-side{display:flex;flex-direction:column;gap:24px}
.opt{min-height:104px;display:flex;align-items:center;gap:22px;padding:16px 26px;background:#fff;border:3px solid var(--p100);border-radius:26px;
  font-size:38px;font-weight:700;color:var(--ink);text-align:right;box-shadow:var(--shadow);transition:transform .18s,border-color .2s,background .2s,opacity .3s}
.opt:hover{transform:translateY(-4px);border-color:var(--p300)}
.opt:active{transform:scale(.97)}
.o-ico{width:70px;height:70px;border-radius:20px;background:var(--p50);display:grid;place-items:center;font-size:40px;flex-shrink:0;color:var(--p700);font-weight:900}
.o-txt .icode{font-size:44px}
.opt.correct{background:var(--okbg);border-color:#4ADE80}
.opt.correct .o-ico{background:#4ADE80;color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--badbd);opacity:.7}
.opt.dim{opacity:.4;pointer-events:none}
.scenario{background:#fff;border-radius:28px;padding:28px 32px;display:flex;gap:26px;align-items:center;box-shadow:var(--shadow);border:3px solid var(--p100)}
.sc-emoji{font-size:96px;line-height:1;flex-shrink:0}
.scenario p{font-size:36px;line-height:1.6;font-weight:500}

/* =========================================================
   9) لعبة التصنيف (أنواع البيانات)
   ========================================================= */
.cls{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
.cls-top{display:flex;gap:24px}
.cls-card{width:820px;height:260px;background:var(--dark);border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 24px 50px rgba(11,30,20,.3);transition:background .35s}
.cls-card.good{background:#14532D}
.cls-val{font-family:var(--mono);font-size:104px;font-weight:800;color:#fff;line-height:1.2}
.cls-hint{font-size:32px;color:var(--accent2);min-height:44px;font-weight:700}
.cls-cats{display:flex;gap:28px}
.cat{width:310px;height:150px;border-radius:30px;background:#fff;border:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:var(--shadow);transition:transform .18s,background .2s}
.cat:hover{transform:translateY(-5px);background:color-mix(in srgb,var(--c) 10%,white)}
.cat b{font-family:var(--mono);font-size:54px;color:var(--c)}
.cat small{font-size:28px;color:#344A3E;font-weight:700}

/* =========================================================
   10) ترتيب خطوات باي تشارم
   ========================================================= */
.ord-info{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex-shrink:0}
.fact{background:#fff;border-radius:24px;padding:16px 22px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.fact span{font-size:50px}
.fact p{font-size:26px;line-height:1.45}
.ord-game{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:36px}
.ord-pool{display:flex;flex-direction:column;gap:16px}
.ord-pool h4{font-size:32px;color:var(--p700);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start}
.step{font-size:28px;padding:16px 24px;background:#fff;border:3px dashed var(--p300);border-radius:18px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .2s}
.step:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--p600)}
.ord-pool .ide-code{font-size:28px;min-height:110px;padding:22px 28px}
.ord-pool .ide-out{min-height:110px}
.ord-pool .ide-out-text{font-size:26px}
.slots{list-style:none;display:flex;flex-direction:column;gap:12px;justify-content:center}
.slot{height:68px;border-radius:18px;background:rgba(255,255,255,.55);border:3px dashed var(--p200);display:flex;align-items:center;gap:16px;padding:0 16px;font-size:28px;transition:background .3s,border-color .3s}
.slot .num{width:46px;height:46px;border-radius:50%;background:var(--p100);display:grid;place-items:center;font-weight:900;color:var(--p700);flex-shrink:0}
.slot.filled{background:#fff;border-style:solid;border-color:var(--p400)}
.slot.filled .num{background:var(--p600);color:#fff}

/* =========================================================
   11) العصف الذهني
   ========================================================= */
.bs{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}
.bs-board{flex:1;min-height:0;background:#fff;border-radius:34px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:22px;overflow:hidden;box-shadow:var(--shadow);
  background-image:radial-gradient(var(--p100) 2px,transparent 2px);background-size:32px 32px}
.bs-center{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#1D9A55,#2FB36A);color:#fff;padding:16px 44px;border-radius:999px;font-size:36px;font-weight:700;box-shadow:0 12px 30px rgba(29,154,85,.35)}
.bs-center span{font-size:56px}
.bs-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;align-content:flex-start}
.note-card{font-size:29px;font-weight:700;padding:14px 24px;border-radius:14px;background:var(--bg);rotate:var(--rot);box-shadow:0 8px 18px rgba(11,61,35,.12);max-width:600px;line-height:1.5}
.bs-bar{display:flex;gap:16px;align-items:center;flex-shrink:0}
.bs-input{flex:1;font-size:30px;padding:18px 26px;border-radius:18px;border:3px solid var(--p200);background:#fff;outline:none;color:var(--ink)}
.bs-input:focus{border-color:var(--p500)}

/* =========================================================
   12) مختبر المقارنة
   ========================================================= */
.lab{flex:1;min-height:0;display:grid;grid-template-columns:.9fr 1.1fr;gap:40px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:center}
.opbtn{height:128px;background:#fff;border:3px solid var(--p100);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:var(--shadow);transition:transform .15s,background .2s}
.opbtn:hover{transform:translateY(-4px)}
.opbtn code{font-size:50px;background:none;padding:0;color:var(--p700)}
.opbtn span{font-size:27px;color:#344A3E;font-weight:700}
.opbtn.sel{background:var(--p600);border-color:var(--p600)}
.opbtn.sel code,.opbtn.sel span{color:#fff}
.lab-main{background:#fff;border-radius:34px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:22px;box-shadow:var(--shadow)}
.steppers{display:flex;gap:26px;justify-content:center;direction:ltr}
.stp{display:flex;align-items:center;gap:12px;background:var(--p50);border-radius:22px;padding:10px 16px;border:2px solid var(--p100)}
.stp-name{font-family:var(--mono);font-size:40px;color:var(--p700);font-weight:800}
.stp button{width:60px;height:60px;border-radius:16px;border:none;background:var(--p600);color:#fff;font-size:40px;line-height:1;transition:transform .12s}
.stp button:active{transform:scale(.9)}
.stp-val{font-family:var(--mono);font-size:52px;min-width:90px;text-align:center}
.lab-result{display:flex;align-items:center;justify-content:center;gap:24px;font-size:36px;font-weight:700;flex-wrap:wrap}

/* =========================================================
   13) ماذا تتوقعين؟ (بطاقات الكود)
   ========================================================= */

/* =========================================================
   14) فكري – زاوجي – شاركي
   ========================================================= */
.tps{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.tps-q{font-size:38px;font-weight:800;color:var(--p900);margin-top:22px;text-align:center}
.tps-phases{display:flex;flex-direction:column;gap:20px}
.phase{background:#fff;border-radius:26px;padding:16px 24px;display:flex;align-items:center;gap:20px;border:4px solid transparent;box-shadow:var(--shadow);transition:border-color .3s,background .3s}
.phase.on{border-color:var(--p400);background:#EEF9F2}
.ph-ico{font-size:62px;line-height:1}
.ph-txt{flex:1}
.ph-txt b{display:block;font-size:40px;color:var(--p900)}
.ph-txt small{font-size:26px;color:var(--muted)}
.tps-answer{display:flex;align-items:center;justify-content:center;gap:26px;min-height:96px;flex-shrink:0}
.ans{font-size:30px;display:flex;align-items:center;gap:18px;line-height:1.5;max-width:1250px}


/* =========================================================
   16) التعلم التعاوني (المجموعات)
   ========================================================= */
.grp-top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0}
.grp-top p{font-size:32px;font-weight:700;color:#344A3E}
.grp-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto 1fr;gap:22px}
.gcard{grid-column:span 2;background:#fff;border-radius:26px;padding:14px 20px 16px;border-top:10px solid var(--c);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-height:0}
.gcard:nth-child(n+4){grid-column:span 3}
.g-head{display:flex;justify-content:space-between;align-items:center}
.g-name{font-size:30px;font-weight:900;color:var(--c)}
.star{font-size:28px;background:#FFF7E6;border:2px solid #FFE2A8;border-radius:999px;padding:4px 18px;font-weight:800;color:#8A5A00}
.g-body{flex:1;display:flex;gap:16px;align-items:center}
.g-body .code{flex:1;min-width:0}
.g-foot{display:flex;flex-direction:column;align-items:center;gap:8px;width:200px;flex-shrink:0;text-align:center}
.g-foot .btn{font-size:24px;padding:12px 16px}
.g-ans{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;color:#344A3E;min-height:30px}
.g-ans .pill{font-size:26px;padding:2px 18px}

/* =========================================================
   17) صح أم خطأ
   ========================================================= */
.tf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.tf-dots{display:flex;gap:14px;direction:rtl}
.dot{width:22px;height:22px;border-radius:50%;background:var(--p200);cursor:pointer;transition:transform .2s,background .2s}
.dot.cur{transform:scale(1.35);box-shadow:0 0 0 4px var(--p300)}
.dot.ok{background:#4ADE80}.dot.bad{background:var(--badbd)}
.tf-card{width:1340px;min-height:210px;background:#fff;border-radius:36px;padding:36px 56px;box-shadow:var(--shadow);display:flex;align-items:center;gap:30px;border:3px solid var(--p100)}
.tf-num{font-size:38px;width:82px;height:82px;border-radius:50%;background:var(--p600);color:#fff;display:grid;place-items:center;flex-shrink:0;font-weight:900}
.tf-text{font-size:48px;font-weight:700;line-height:1.5;color:var(--p900)}
.tf-btns{display:flex;gap:40px}
.tfb{width:300px;height:108px;font-size:44px;font-weight:900;border-radius:28px;border:4px solid;transition:transform .15s,background .2s}
.tfb:hover{transform:translateY(-4px)}
.tfb.yes{background:#F0FDF4;border-color:var(--okbd);color:var(--ok)}
.tfb.no{background:#FFF1F2;border-color:var(--badbd);color:var(--bad)}
.tfb.right{background:#4ADE80;color:#fff;border-color:#22C55E}
.tfb.wrongp{opacity:.45}
.tf-nav{display:flex;gap:20px}

/* =========================================================
   18) تحدي الدقيقة
   ========================================================= */
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0}
.ch-top p{font-size:32px;font-weight:700;color:#344A3E}
.ch-found{font-size:40px;font-weight:900;background:#fff;padding:8px 32px;border-radius:999px;box-shadow:var(--shadow);color:var(--ok)}
.ch-wrap{flex:1;min-height:0;position:relative}
.ch-grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:22px;transition:filter .4s}
.chip-code{font-size:42px;background:#fff;border:4px solid var(--p100);border-radius:28px;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s,background .25s,border-color .25s}
.chip-code:hover{transform:translateY(-5px)}
.chip-code.hit{background:var(--okbg);border-color:#4ADE80}
.chip-code.miss{background:var(--badbg);border-color:var(--badbd);opacity:.7}
.chip-code.missed{border:4px dashed #22C55E}
.ch-grid.locked{filter:blur(10px);pointer-events:none}
.ch-lock{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;font-weight:900;color:var(--p700);pointer-events:none;transition:opacity .3s}
.ch-lock.gone{opacity:0}
.ch-grid.over .chip-code{pointer-events:none}

/* =========================================================
   19) شريط التحكم السفلي + التلميحات
   ========================================================= */
#controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;box-shadow:0 14px 40px rgba(11,61,35,.25);
  z-index:40;transition:opacity .45s,transform .45s}
#controls.hide{opacity:0;transform:translate(-50%,40px);pointer-events:none}
.cbtn{height:64px;padding:0 28px;border-radius:999px;border:none;background:var(--p100);color:var(--p700);font-size:28px;font-weight:800;display:flex;align-items:center;gap:10px;transition:transform .15s,background .2s}
.cbtn:hover{background:var(--p200);transform:translateY(-2px)}
.cbtn:active{transform:scale(.94)}
.cbtn:disabled{opacity:.35;pointer-events:none}
.cbtn.primary{background:var(--p600);color:#fff}
.cbtn.primary:hover{background:var(--p700)}
.cbtn.icon{width:64px;padding:0;justify-content:center}
.clap-btn{width:72px;padding:0;justify-content:center;font-size:36px;background:linear-gradient(135deg,#FFD66B,#FFB84C)}
.clap-btn:hover{background:linear-gradient(135deg,#FFE08A,#FFC266)}
.counter{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--p900);min-width:120px;text-align:center}
.sep{width:2px;height:40px;background:var(--p100)}
#hint{position:absolute;top:18px;left:140px;font-size:21px;color:var(--muted);background:rgba(255,255,255,.8);padding:8px 16px;border-radius:14px;z-index:40;transition:opacity .45s;direction:rtl}
#hint.hide{opacity:0}
#hint kbd{font-size:18px}

/* التحضير */
.att-bar{display:flex;align-items:center;gap:14px;flex-shrink:0}
.att-bar .tag{font-size:26px;padding:8px 22px}
.att-bar .btn{font-size:26px;padding:12px 24px}
.t-ok{color:var(--ok)!important}.t-late{color:#B45309!important}.t-bad{color:var(--bad)!important}
.att-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:18px}
.stu{background:#fff;border:4px solid var(--okbd);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);transition:background .25s,border-color .25s,transform .15s,opacity .25s}
.stu:hover{transform:translateY(-4px)}
.stu .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1D9A55,#2FB36A);color:#fff;font-size:32px;font-weight:900;display:grid;place-items:center}
.stu .nm{font-size:32px;font-weight:800;color:var(--p900)}
.stu .st{font-size:22px;font-weight:700;color:var(--ok)}
.stu[data-s=a]{background:#FFF5F6;border-color:var(--badbd);opacity:.75}
.stu[data-s=a] .av{background:#FDA4AF}.stu[data-s=a] .st{color:var(--bad)}
.stu[data-s=l]{background:#FFFBEB;border-color:#FCD34D}
.stu[data-s=l] .av{background:linear-gradient(135deg,#F59E0B,#FBBF24)}.stu[data-s=l] .st{color:#B45309}
.cls-sw{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:28px;font-weight:800;color:var(--p800)}
.csw{font-size:28px;font-weight:800;padding:10px 30px;border-radius:999px;border:3px solid var(--p200);background:#fff;color:var(--p700);transition:transform .15s,background .2s}
.csw:hover{transform:translateY(-3px)}
.csw.on{background:var(--p600);color:#fff;border-color:var(--p600)}
.csw small{font-size:20px;opacity:.8}
.att-tip{font-size:24px;color:var(--muted);text-align:center;flex-shrink:0}

/* نافذة القرعة */
#draw{position:absolute;inset:0;z-index:80;background:rgba(5,46,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#draw.on{opacity:1;visibility:visible}
.dr-card{position:relative;width:1150px;background:#fff;border-radius:44px;padding:48px 60px 40px;display:flex;flex-direction:column;align-items:center;gap:22px;box-shadow:0 40px 90px rgba(0,0,0,.35);transform:scale(.9);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#draw.on .dr-card{transform:none}
.dr-x{position:absolute;top:24px;left:28px;width:58px;height:58px;border-radius:50%;border:none;background:var(--p100);color:var(--p700);font-size:28px}
.dr-title{font-size:40px;font-weight:900;color:var(--p700)}
.dr-name{width:100%;min-height:190px;display:grid;place-items:center;font-size:100px;font-weight:900;color:var(--p900);background:var(--p50);border-radius:32px;border:4px dashed var(--p200);transition:background .3s,color .3s}
.dr-name.win{background:linear-gradient(135deg,#1D9A55,#0D9488);color:#fff;border-style:solid;border-color:transparent}
.dr-info{font-size:28px;color:var(--muted);font-weight:700}
.dr-btns{display:flex;gap:18px}
.dr-go{font-size:36px;padding:18px 48px}
.dr-picked{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:44px}
.dr-picked span{font-size:22px;background:var(--p100);color:var(--p700);padding:6px 16px;border-radius:999px;font-weight:700}

.hidden{display:none!important}
.shead.compact{flex-direction:row;align-items:center;gap:22px}
.shead.compact .stitle{font-size:44px}
/* التلميح المضيء */
.glow{outline:3px solid #FFB84C!important;outline-offset:2px;animation:glowP 1.1s ease-in-out infinite;position:relative;z-index:2}
@keyframes glowP{50%{box-shadow:0 0 0 6px rgba(255,184,76,.45),0 0 26px rgba(255,184,76,.9)}}
/* لوحة المهمة */
.pc-guide{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.pg-h{font-size:26px;font-weight:900;color:var(--p700)}
.pg-steps{list-style:none;display:flex;flex-direction:column;gap:7px}
.pg-steps li{display:flex;gap:10px;align-items:center;font-size:19px;line-height:1.4;padding:7px 10px;border-radius:14px;background:var(--p50);color:#344A3E;transition:background .3s,opacity .3s}
.pg-steps li code{font-size:16px}
.pg-n{width:34px;height:34px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.pg-steps li.cur{background:#FFF3D6;outline:3px solid var(--accent)}
.pg-steps li.done{opacity:.55}
.pg-steps li.done .pg-n{background:#4ADE80;color:#fff}
.pg-done{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.pg-ok{background:#F0FDF4;border-right:6px solid #4ADE80;padding:10px 14px;border-radius:12px;font-size:21px;font-weight:800;color:var(--ok)}
.pg-tt{font-size:20px;color:var(--p800)}
.pg-tc{text-align:left;background:var(--p50);border:2px solid var(--p100);border-radius:12px;padding:7px 12px;font-size:18px;transition:transform .15s,border-color .2s}
.pg-tc:hover{transform:translateY(-2px);border-color:var(--p400)}
.pg-tc small{display:block;direction:rtl;text-align:right;color:var(--muted);font-size:15px;font-family:'Tajawal'}
.pg-msg{flex:1;min-height:0;overflow:auto;font-size:19px;line-height:1.55}
.pg-err{background:#FFF1F2;border-right:6px solid #FB7185;padding:10px 14px;border-radius:12px;color:#5f1d2b}
.pg-err small{color:var(--muted)}
.pg-okm{background:#F0FDF4;border-right:6px solid #4ADE80;padding:10px 14px;border-radius:12px;color:var(--ok);font-weight:700}
.pg-hint{font-size:19px;padding:10px 14px;flex-shrink:0}

/* طبقة التصفيق والاحتفال */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.clap-float{position:absolute;bottom:90px;animation:clapUp 1.9s cubic-bezier(.2,.7,.3,1) forwards;opacity:0}
@keyframes clapUp{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(0,-60px) scale(1.1)}
  100%{opacity:0;transform:translate(var(--dx),-620px) rotate(var(--r)) scale(.9)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}

/* =========================================================
   📊 عناصر إكسل المشتركة (خلية، جدول مصغّر)
   ========================================================= */
.cellbox{display:inline-block;direction:ltr;unicode-bidi:isolate;font-family:'Segoe UI','Tajawal',sans-serif;font-weight:700;background:#fff;border:2px solid #9DB8A8;padding:0 14px;border-radius:6px;color:#10241A}
.cellbox.big{font-size:64px;padding:14px 40px;border:4px solid #107C41;border-radius:14px;min-width:280px;text-align:center;box-shadow:var(--shadow)}
.cellbox.q{color:var(--p600);border-style:dashed}
.cellpair{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
.cellpair .arrow{font-size:60px;color:var(--p600);font-weight:900}
.cell-lbl{font-size:30px;font-weight:800;color:var(--p700);text-align:center}
.ans-chip{display:inline-block;font-weight:900;font-size:40px;padding:6px 28px;border-radius:999px;background:var(--okbg);color:var(--ok);border:3px solid var(--okbd);white-space:nowrap}
.ans-chip.sm{font-size:26px;padding:2px 18px}
.acc{display:flex;justify-content:space-between;gap:10px;direction:ltr;width:100%}

/* الجدول المصغّر (الترحيب والختام) */
.xm{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px rgba(11,61,35,.28);font-family:'Segoe UI','Tajawal',sans-serif}
.xm-bar{height:58px;background:#107C41;color:#fff;display:flex;align-items:center;gap:14px;padding:0 22px;font-size:24px;font-weight:700}
.xm-logo{width:36px;height:36px;border-radius:8px;background:#fff;color:#107C41;display:grid;place-items:center;font-weight:900}
.xm-bar .sp{flex:1}
.xm-bar i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.5)}
.xm-t{width:100%;border-collapse:collapse;font-size:27px;table-layout:fixed;color:#10241A}
.xm-t th{background:#F3F3F3;color:#666;font-weight:600;font-size:19px;border:1px solid #DADADA;height:42px}
.xm-t td{border:1px solid #E1E1E1;padding:0 12px;height:50px;text-align:right;white-space:nowrap;overflow:hidden;transition:background .5s}
.xm-t td.num{text-align:left;direction:ltr}
.xm .c1,.xm .d1,.xm .r2b{display:none}
.xm.on1 .c0,.xm.on2 .d0,.xm.on3 .r2a{display:none}
.xm.on1 .c1,.xm.on2 .d1{display:inline;animation:rise .5s both}
.xm.on3 .r2b{display:table-row}
.xm.on2 tr.hdr td{font-weight:800;background:#E2EFDA}
.xm .m3{text-align:center;background:#C6E0B4;font-weight:800;animation:rise .5s both}

/* =========================================================
   🔬 مختبر تنسيق الأرقام
   ========================================================= */
.fl-vals{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.fl-lbl{font-size:28px;font-weight:800;color:var(--p800)}
.fl-v{font-size:32px;font-weight:800;padding:6px 26px;border-radius:14px;border:3px solid var(--p200);background:#fff;color:var(--p700);direction:ltr;font-family:'Segoe UI','Tajawal',sans-serif;transition:transform .15s}
.fl-v:hover{transform:translateY(-3px)}
.fl-v.sel{background:var(--p600);color:#fff;border-color:var(--p600)}
.fl-sheet{border:2px solid #D0D0D0;border-radius:16px;overflow:hidden;font-family:'Segoe UI','Tajawal',sans-serif;background:#fff}
.fl-fx{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:2px solid #E3E3E3;font-size:26px;background:#FAFAFA}
.fl-nb{border:1px solid #CCC;padding:0 16px;background:#fff}
.fl-fxi{font-style:italic;color:#888;font-family:serif}
.fl-raw{font-weight:700}
.fl-cellrow{display:grid;grid-template-columns:70px 1fr}
.fl-hdr{background:#F3F3F3;display:grid;place-items:center;font-size:26px;color:#555;border-left:1px solid #DDD}
.fl-cell{height:130px;display:flex;align-items:center;justify-content:flex-end;padding:0 30px;font-size:76px;font-weight:800;color:#10241A;outline:4px solid #107C41;outline-offset:-4px;direction:ltr}
.fl-cell .acc{direction:ltr}
.fl-dec{display:flex;gap:14px;justify-content:center}
.fl-dec .btn{font-size:24px;padding:12px 20px}
.fl-exp{font-size:29px;text-align:center;color:#344A3E;min-height:46px;line-height:1.5}

/* بطاقات مهمة المجموعات + تفكير زوجي */
.g-task{flex:1;font-size:27px;line-height:1.6;font-weight:700;color:var(--p900);background:var(--p50);border-radius:18px;padding:12px 18px}
.tps-vis{background:#fff;border-radius:30px;padding:40px 30px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;align-items:center}
.ord-fin{background:#fff;border-radius:26px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;align-items:center}
.cls-val{font-family:inherit;font-size:76px;text-align:center;padding:0 30px}
.cat b{font-family:inherit;font-size:42px}
.chip-code{font-family:'Segoe UI','Tajawal',sans-serif;font-weight:800}

/* =========================================================
   🎮 محاكي مايكروسوفت إكسل
   ========================================================= */
.xls{flex:1;min-height:0;display:grid;grid-template-columns:1fr 390px;gap:20px}
.xw{position:relative;display:grid;grid-template-rows:40px 38px 124px 42px 1fr 40px 28px;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 20px 50px rgba(11,61,35,.3);font-family:'Segoe UI','Tajawal',Tahoma,sans-serif;color:#222;min-height:0;border:1px solid #C8C8C8}
.xw .sp{flex:1}
.xt{display:flex;align-items:center;gap:18px;background:#107C41;color:#fff;padding:0 16px;font-size:16px;white-space:nowrap}
.xt-tg{display:inline-block;width:34px;height:18px;border-radius:9px;border:2px solid #fff;vertical-align:middle;position:relative}
.xt-tg::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.xt-name{font-weight:700;font-size:17px}
.xt-search{background:rgba(255,255,255,.18);border-radius:6px;padding:3px 50px;font-size:15px;color:#E8F5EC}
.xtabs{display:flex;align-items:flex-end;gap:2px;background:#F3F3F3;padding:0 10px;border-bottom:1px solid #D6D6D6}
.xtab{padding:6px 14px 7px;font-size:16px;cursor:pointer;border-bottom:3px solid transparent;color:#333;white-space:nowrap}
.xtab:hover{background:#E6E6E6}

/* حركات بسيطة عبر Web Animations API */
function shake(n) { n.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-14px)' }, { transform: 'translateX(14px)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 420, easing: 'ease-out' }); }
function bump(n, s = 1.08) { n.animate([{ transform: 'scale(1)' }, { transform: `scale(${s})` }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' }); }
function popIn(n) { if (n) n.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.06)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' }); }

/* ---------- الأصوات (Web Audio API — بدون ملفات خارجية) ---------- */
const Sound = {
  ctx: null, _noise: null,
  ac() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  noise() {
    if (this._noise) return this._noise;
    const c = this.ac(), b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (this._noise = b);
  },
  tone(freq, start, dur, type = 'sine', vol = .2) {
    const c = this.ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(c.destination); o.start(start); o.stop(start + dur + 0.05);
  },
  /* تصفيق جماعي قصير */
  clap() {
    try {
      const c = this.ac(), now = c.currentTime;
      const master = c.createGain(); master.gain.value = 0.9;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      hp.connect(master).connect(c.destination);
      for (let i = 0; i < 34; i++) {
        const t = now + Math.pow(Math.random(), 1.4) * 1.5;
        for (let j = 0; j < 2; j++) {                     // كل تصفيقة = نبضتان سريعتان
          const tt = t + j * 0.009;
          const src = c.createBufferSource(); src.buffer = this.noise();
          const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900 + Math.random() * 1700; bp.Q.value = 0.7 + Math.random();
          const g = c.createGain(), peak = (0.25 + Math.random() * 0.4) * (j ? 0.6 : 1);
          g.gain.setValueAtTime(0.0001, tt);
          g.gain.exponentialRampToValueAtTime(peak, tt + 0.003);
          g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07 + Math.random() * 0.08);
          src.connect(bp).connect(g).connect(hp);
          src.start(tt, Math.random() * 0.6, 0.2);
        }
      }
      master.gain.setValueAtTime(0.9, now + 1.3);
      master.gain.linearRampToValueAtTime(0.0001, now + 1.8);
    } catch (e) {}
  },
  success() { try { const t = this.ac().currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { this.tone(f, t + i * 0.09, 0.45, 'triangle', 0.22); this.tone(f * 2, t + i * 0.09, 0.25, 'sine', 0.05); }); } catch (e) {} },
  wrong()   { try { const t = this.ac().currentTime; this.tone(392, t, 0.22, 'sine', 0.18); this.tone(311, t + 0.16, 0.32, 'sine', 0.18); } catch (e) {} },
  pop()     { try { const c = this.ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(480, t); o.frequency.exponentialRampToValueAtTime(950, t + 0.08); g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.16); } catch (e) {} },
  star()    { try { const t = this.ac().currentTime; this.tone(1318.5, t, 0.2, 'triangle', 0.16); this.tone(1760, t + 0.08, 0.3, 'triangle', 0.16); } catch (e) {} },
  tick()    { try { this.tone(1000, this.ac().currentTime, 0.06, 'square', 0.04); } catch (e) {} },
  bell()    { try { const t = this.ac().currentTime; this.tone(880, t, 1.3, 'sine', 0.25); this.tone(1320, t, 1.0, 'sine', 0.12); this.tone(880, t + 0.35, 1.3, 'sine', 0.2); } catch (e) {} }
};

/* ---------- قصاصات الاحتفال ---------- */
const Confetti = {
  cvs: $('#confetti'), parts: [], running: false,
  burst(n = 150) {
    const c = this.cvs, dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    this.ctx = c.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#1D9A55', '#2FB36A', '#A7E3C1', '#FFB84C', '#FFD66B', '#F472B6', '#14B8A6'];
    for (let i = 0; i < n; i++) this.parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .35, y: innerHeight * .4,
      vx: (Math.random() - .5) * 18, vy: -Math.random() * 15 - 5,
      s: 7 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      col: cols[i % cols.length], round: Math.random() < .3
    });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.loop()); }
  },
  loop() {
    const g = this.ctx; g.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.y < innerHeight + 30);
    for (const p of this.parts) {
      p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col;
      if (p.round) { g.beginPath(); g.arc(0, 0, p.s / 2, 0, 7); g.fill(); } else g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      g.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.loop());
    else { this.running = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  }
};

/* ---------- المؤقت ---------- */
class Timer {
  constructor(host, seconds, opts = {}) {
    this.total = seconds; this.left = seconds; this.opts = opts; this.running = false;
    host.innerHTML = `<div class="timer ${opts.size || ''}">
      <button class="tm-play" title="تشغيل / إيقاف">▶</button>
      <div class="tm-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="tm-bg"/><circle cx="50" cy="50" r="44" class="tm-fg"/></svg><span class="tm-txt"></span></div>
      <button class="tm-reset" title="إعادة المؤقت">↺</button></div>`;
    this.root = host.firstElementChild;
    $('.tm-play', this.root).onclick = () => this.running ? this.stop() : this.start();
    $('.tm-reset', this.root).onclick = () => this.reset();
    this.draw();
  }
  draw() {
    const c = Math.max(0, Math.ceil(this.left));
    $('.tm-txt', this.root).textContent = `${String(Math.floor(c / 60)).padStart(2, '0')}:${String(c % 60).padStart(2, '0')}`;
    $('.tm-fg', this.root).style.strokeDashoffset = 276.46 * (1 - this.left / this.total);
    this.root.classList.toggle('warn', this.left <= 10);
  }
  start() {
    if (this.left <= 0 || this.running) return;
    this.running = true; this.root.classList.add('running'); $('.tm-play', this.root).textContent = '⏸';
    let last = performance.now(), shown = Math.ceil(this.left);
    this.iv = setInterval(() => {
      const now = performance.now(); this.left -= (now - last) / 1000; last = now;
      const c = Math.ceil(this.left);
      if (c !== shown) { shown = c; if (c <= 5 && c > 0) Sound.tick(); }
      if (this.left <= 0) { this.left = 0; this.stop(); Sound.bell(); this.opts.onEnd && this.opts.onEnd(); }
      this.draw();
    }, 200);
    this.opts.onStart && this.opts.onStart();
  }
  stop() { clearInterval(this.iv); this.running = false; this.root.classList.remove('running'); $('.tm-play', this.root).textContent = '▶'; }
  reset() { this.stop(); this.left = this.total; this.draw(); }
}

/* ================================================================
   📊  تنسيق قيم الخلايا كما في إكسل
   ================================================================ */
const AR_DIG = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const HMONTHS = ['محرم', 'صفر', 'ربيع الأول', 'ربيع الآخر', 'جمادى الأولى', 'جمادى الآخرة', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة'];
const CUR = 'ر.س';
const DEF_DEC = { number: 2, currency: 2, accounting: 2, comma: 2, percent: 0 };
const SAMPLE_DATE = { y: 1442, m: 9, d: 23 };
const decOf = v => { const s = String(v), i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; };
const group = s => { const [i, f] = s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f !== undefined ? '.' + f : ''); };
const p2 = n => String(n).padStart(2, '0');
const rawOf = v => v == null ? '' : typeof v === 'object' ? `${v.y}/${p2(v.m)}/${p2(v.d)}` : String(v);
const stripTags = h => String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

/* يُرجع القيمة كما تظهر في الخلية حسب التنسيق fmt وعدد المنازل العشرية dec */
function fmtValue(v, fmt, dec) {
  if (v === '' || v == null) return '';
  if (typeof v === 'object') {
    switch (fmt) {
      case 'dateShort': return AR_DIG(`${v.y}/${p2(v.m)}/${p2(v.d)}`);
      case 'dateDMY':   return AR_DIG(`${p2(v.d)}/${p2(v.m)}/${v.y}`);
      case 'dateLong':  return AR_DIG(`${v.d} ${HMONTHS[v.m - 1]} ${v.y}`);
      default:          return rawOf(v);
    }
  }
  if (typeof v !== 'number') return esc(v);
  const d = dec ?? DEF_DEC[fmt] ?? decOf(v);
  switch (fmt) {
    case 'number':     return v.toFixed(d);
    case 'currency':   return `${group(v.toFixed(d))} ${CUR}`;
    case 'accounting': return `<span class="acc"><span>${CUR}</span><span>${group(v.toFixed(d))}</span></span>`;
    case 'percent':    return (v * 100).toFixed(d) + '%';
    case 'comma':      return group(v.toFixed(d));
    default:           return dec != null ? v.toFixed(d) : String(v);
  }
}

      const td = e.target.closest('td.xc'); if (!td) return;
      const p = { c: +td.dataset.c, r: +td.dataset.r };
      if (e.button === 2 && td.classList.contains('sel')) return;   // زر أيمن داخل التحديد يُبقيه
      if (e.shiftKey) st.foc = p; else { st.anc = p; st.foc = p; }
      selecting = true; gw.setPointerCapture(e.pointerId); paintSel();
    });
    gw.addEventListener('pointermove', e => {
      if (drag) {
        const p = rel(e.clientX, e.clientY), o = S().icons[drag.i];
        o.x = drag.ox + p.x - drag.p0.x; o.y = drag.oy + p.y - drag.p0.y;
        drag.n.style.left = o.x + 'px'; drag.n.style.top = o.y + 'px'; return;
      }
      if (!selecting) return;
      const n = document.elementFromPoint(e.clientX, e.clientY), td = n && n.closest && n.closest('td.xc');
      if (!td || !grid.contains(td)) return;
      const p = { c: +td.dataset.c, r: +td.dataset.r };
      if (p.c !== st.foc.c || p.r !== st.foc.r) { st.foc = p; paintSel(); }
    });
    ['pointerup', 'pointercancel'].forEach(ev => gw.addEventListener(ev, () => { selecting = false; drag = null; }));
    grid.addEventListener('dblclick', e => { const td = e.target.closest('td.xc'); td && editCell(td); });
    gw.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (!e.target.closest('td.xc')) return;
      const p = rel(e.clientX, e.clientY);
      const d = popAt(`<div class="xpi" data-a="na"><span class="ic">✂️</span>قص</div><div class="xpi" data-a="na"><span class="ic">📄</span>نسخ</div><div class="xpi" data-a="na"><span class="ic">📋</span>خيارات اللصق</div><div class="xpsep"></div>
        <div class="xpi" data-a="clr"><span class="ic">⌫</span>مسح المحتويات</div><div class="xpi" data-a="fc"><span class="ic">▦</span>تنسيق خلايا...</div>`, p.x, p.y);
      $$('.xpi', d).forEach(n => n.onclick = () => {
        const a = n.dataset.a; closePops();
        if (a === 'fc') openFC('num'); else if (a === 'clr') applyAll(x => delete x.v); else NAf();
      });
    });

    /* ---- ربط الأزرار ---- */
    $$('.xtab', el).forEach(t => t.onclick = () => {
      const k = t.dataset.tab;
      if (k === 'file') return openBS('info');
      if (k !== 'home' && k !== 'insert') return NAf();
      st.tab = k; closePops();
      $$('.xtab', el).forEach(x => x.classList.toggle('on', x.dataset.tab === k));
      $$('.xrb', el).forEach(x => x.classList.toggle('hidden', x.dataset.rb !== k));
      Sound.pop(); refresh();
    });
    $$('.xrib [data-cmd]', el).forEach(b => b.onclick = () => cmd(b.dataset.cmd, b));
    $$('[data-na]', el).forEach(b => b.onclick = NAf);
    $('.st-add', el).onclick = addSheet;
    $('.rb-fill .swatch', el).style.background = st.fill;

    /* ---- خطوات المهمة + التلميحات المضيئة ---- */
    function check() {
      const m = st.sheets.find(x => x.main), g = k => (m && m.cells[k]) || {}, r = R();
      const C = ['C4', 'C5', 'C6', 'C7', 'C8', 'C9'], H = ['A3', 'B3', 'C3', 'D3'];
      const now = [
        m === S() && r.c1 === 2 && r.c2 === 2 && r.r1 <= 4 && r.r2 >= 9,
        C.every(k => ['currency', 'accounting'].includes(g(k).fmt)),
        DTYPES.includes(g('A1').fmt),
        !!m && m.merges.some(x => x.r1 === 2 && x.r2 === 2 && x.c1 === 0 && x.c2 >= 3),
        H.every(k => g(k).b && g(k).fill),
        st.sheets.some(x => x.icons.length),
        st.added,
        st.renamed,
        st.saved && st.file !== BOOK
      ];
      let ch = false;
      now.forEach((v, i) => { if (v && !st.done[i]) { st.done[i] = true; ch = true; } });
      if (ch) { renderSteps(); Sound.star(); if (st.done.every(Boolean)) finish(); }
    }
    function renderSteps() {
      const cur = st.done.indexOf(false);
      $$('.pg-steps li', el).forEach((li, i) => { li.classList.toggle('done', st.done[i]); li.classList.toggle('cur', i === cur); $('.pg-n', li).textContent = st.done[i] ? '✓' : i + 1; });
    }
    function finish() {
      if (st.finished) return; st.finished = true; celebrate();
      $('.pg-steps', el).classList.add('hidden'); $('.pg-done', el).classList.remove('hidden');
    }
    function refresh() {
      $$('.glow', el).forEach(n => n.classList.remove('glow'));
      if (!st.hints) return;
      const i = st.done.indexOf(false); if (i < 0) return;
      const has = q => $(q, el), r = R();
      const g = q => { const n = typeof q === 'string' ? has(q) : q; n && n.classList.add('glow'); };
      const cells = ks => ks.forEach(k => g(`td[data-k="${k}"]`));
      const home = () => st.tab === 'home' || (g('[data-tab="home"]'), false);
      const isR = (c1, c2, r1, r2) => r.c1 === c1 && r.c2 === c2 && r.r1 === r1 && r.r2 === r2;
      if (has('.bsx') && i !== 8) return g('.bs-back');
      if (i <= 4 && !S().main) return g(`.xs-tab[data-i="${st.sheets.findIndex(x => x.main)}"]`);
      switch (i) {
        case 0: return cells(['C4', 'C5', 'C6', 'C7', 'C8', 'C9']);
        case 1:
          if (has('.xpop [data-nf]')) return g('[data-nf="currency"]');
          if (has('.fc')) return g(has('[data-cat="currency"].sel') ? '.fc-ok' : '[data-cat="currency"]');
          if (!(r.c1 === 2 && r.c2 === 2 && r.r1 <= 4 && r.r2 >= 9)) return cells(['C4', 'C5', 'C6', 'C7', 'C8', 'C9']);
          return home() && g('.nf-drop');
        case 2:
          if (has('.fc')) {
            if (!has('.fc-tabs [data-t="num"].on')) return g('.fc-tabs [data-t="num"]');
            if (!has('[data-cat="date"].sel')) return g('[data-cat="date"]');
            return g('.fc-ok');
          }
          if (has('.xpop [data-nf]')) return g('[data-nf="dateShort"]');
          if (!isR(0, 0, 1, 1)) return cells(['A1']);
          return home() && g('[data-cmd="dlg:num"]');
        case 3:
          if (has('.fc')) {
            if (!has('.fc-tabs [data-t="align"].on')) return g('.fc-tabs [data-t="align"]');
            return g(has('.fc-merge:checked') ? '.fc-ok' : has('.fc-merge').parentElement);
          }
          if (!isR(0, 3, 2, 2)) return cells(['A2', 'B2', 'C2', 'D2']);
          return home() && g('.rb-merge');
        case 4: {
          const m = st.sheets.find(x => x.main);
          if (!(r.c1 === 0 && r.c2 >= 3 && r.r1 === 3 && r.r2 === 3)) return cells(['A3', 'B3', 'C3', 'D3']);
          return home() && g(['A3', 'B3', 'C3', 'D3'].every(k => (m.cells[k] || {}).b) ? '.rb-fill' : '.rb-b');
        }
        case 5:
          if (has('.icd')) return g(has('.ic-cell.on') ? '.icd-ins' : has('.icd-in').value.trim() ? '.ic-cell' : '.icd-search');
          return g(st.tab === 'insert' ? '.rb-icons' : '[data-tab="insert"]');
        case 6: return g('.st-add');
        case 7: return g(has('.xs-tab input') ? '.xs-tab input' : st.added ? '.xs-tab.on' : '.st-add');
        case 8:
          if (has('.sv')) return g('.sv-save');
          if (!has('.bsx')) return g('[data-tab="file"]');
          return g(st.bs === 'saveas' ? '.bs-browse' : '[data-bs="saveas"]');
      }
    }
    $('.pg-hint', el).onclick = e => { st.hints = !st.hints; e.currentTarget.textContent = '💡 التلميحات: ' + (st.hints ? 'تعمل' : 'متوقفة'); refresh(); };

    /* اختصارات لوحة المفاتيح */
    const onKey = e => {
      if (!el.classList.contains('active') || (e.target.matches && e.target.matches('input, textarea'))) return;
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'س')) { e.preventDefault(); st.saved ? toast('💾 تم الحفظ') : openBS('saveas'); }
      else if ((e.ctrlKey || e.metaKey) && (k === 'b' || k === 'لا')) { e.preventDefault(); cmd('b'); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && !$('.xmodal', el)) { e.preventDefault(); applyAll(x => delete x.v); }
      else if (e.key === 'F2' && !$('.xmodal', el)) { const td = $('td.act', grid); td && editCell(td); }
    };

    renderTabs(); renderGrid(); setTitle(); renderSteps();
    return {
      interactive: true,
      enter() { document.addEventListener('keydown', onKey); },
      leave() { document.removeEventListener('keydown', onKey); }
    };
  },

      const it = s.items[i];
      $('.tf-num', el).textContent = i + 1; $('.tf-text', el).innerHTML = it.text;
      $$('.tfb', el).forEach(b => b.classList.remove('right', 'wrongp'));
      fb.innerHTML = '';
      if (solved[i]) {
        $(`.tfb[data-a="${it.answer ? 1 : 0}"]`, el).classList.add('right');
        fb.innerHTML = `<div class="fb-main ok">${it.answer ? 'العبارة صحيحة ✔️' : 'العبارة خاطئة ✖️'}</div><div class="fb-explain">${it.why}</div>`;
      }
      $('[data-act=prev]', el).disabled = i === 0;
      $('[data-act=next]', el).disabled = i === s.items.length - 1;
      dots(); if (anim) popIn($('.tf-card', el));
    };
    $$('.tfb', el).forEach(b => b.onclick = () => {
      if (solved[i]) return;
      const it = s.items[i], ans = b.dataset.a === '1';
      if (ans === it.answer) {
        solved[i] = true; if (first[i] === null) first[i] = true;
        b.classList.add('right'); bump(b); celebrate();
        fb.innerHTML = `<div class="fb-main ok">${MESSAGES.correct}</div><div class="fb-explain">${it.why}</div>`;
      } else {
        if (first[i] === null) first[i] = false;
        b.classList.add('wrongp'); shake(b); Sound.wrong();
        fb.innerHTML = `<div class="fb-main bad">${MESSAGES.wrong}</div>`;
      }
      popIn(fb.firstElementChild); dots();
    });
    $('[data-act=prev]', el).onclick = () => { if (i > 0) { i--; show(true); Sound.pop(); } };
    $('[data-act=next]', el).onclick = () => { if (i < s.items.length - 1) { i++; show(true); Sound.pop(); } };
    $$('.dot', el).forEach(d => d.onclick = () => { i = +d.dataset.k; show(true); Sound.pop(); });
    show(false);
    return { interactive: true };
  },


  /* ---------- تحدي الدقيقة ---------- */
  challenge(s, el) {
    const nTrue = s.chips.filter(c => c.v).length; let found = 0, started = false, over = false, t0 = 0;
    el.innerHTML = head(s) + `<div class="sbody">
      <div class="ch-top anim"><p>${s.instruction}</p><span class="ch-found">✅ <b>0</b> / ${nTrue}</span><div class="tslot"></div></div>
      <div class="ch-wrap anim">
        <div class="ch-grid locked">${s.chips.map((c, k) => `<button class="chip-code" data-k="${k}"><span dir="auto">${c.text}</span></button>`).join('')}</div>
        <div class="ch-lock">⏱️ اضغطي ▶ لبدء التحدي</div>
      </div>
      <div class="fb" style="min-height:80px"></div></div>`;
    const grid = $('.ch-grid', el), fb = $('.fb', el);
    const timer = new Timer($('.tslot', el), s.seconds || 60, {
      onStart() {
        if (!started) { started = true; t0 = performance.now(); grid.classList.remove('locked'); $('.ch-lock', el).classList.add('gone'); }
      },
      onEnd() {
        if (over) return; over = true; grid.classList.add('over');
        $$('.chip-code', el).forEach(ch => { if (s.chips[+ch.dataset.k].v && !ch.classList.contains('hit')) ch.classList.add('missed'); });
        fb.innerHTML = `<div class="fb-main bad">⏰ انتهى الوقت! وجدتنّ ${found} من ${nTrue}</div>`; popIn(fb.firstElementChild);
      }
    });
    $$('.chip-code', el).forEach(ch => ch.onclick = () => {
      if (!started || over || ch.classList.contains('hit') || ch.classList.contains('miss')) return;
      if (s.chips[+ch.dataset.k].v) {
        ch.classList.add('hit'); found++; $('.ch-found b', el).textContent = found; bump(ch); Sound.star();
        if (found === nTrue) {
          over = true; timer.stop(); grid.classList.add('over');
          const secs = Math.round((performance.now() - t0) / 1000);
          fb.innerHTML = `<div class="fb-main ok">🏆 رائع! أنجزتنّ التحدي في ${secs} ثانية</div>`; popIn(fb.firstElementChild); celebrate();
        }
      } else { ch.classList.add('miss'); shake(ch); Sound.wrong(); }
    });
    return { interactive: true, leave() { timer.stop(); } };
  },

  /* ---------- المراجعة ---------- */
  review(s, el) {
    const modes = s.answerModes || [];
    el.innerHTML = head(s) + `<div class="sbody">
      ${modes.length ? `<div class="mode-bar anim">
        <span class="mode-lbl">🎭 جاوبي بشكل مختلف:</span>
        <div class="mode-show"><span class="mode-ico">❔</span><b class="mode-txt">اضغطي الزر لاختيار طريقة الإجابة</b></div>
        <button class="btn btn-primary" data-act="mode">🎲 كيف تجاوبين؟</button>
      </div>` : ''}
      <div class="rev-grid">${s.cards.map(c => `
      <div class="flip anim"><div class="flip-in">
        <div class="face front"><span class="f-ico">${c.icon}</span><b>${c.q}</b></div>
        <div class="face back"><p>${c.a}</p></div>
      </div></div>`).join('')}</div></div>`;
    $$('.flip', el).forEach(f => f.onclick = () => { f.classList.toggle('flipped'); Sound.pop(); });

    /* عجلة عشوائية تختار طريقة الإجابة */
    let spinning = false, last = -1, tm;
    const btn = $('[data-act=mode]', el);
    if (btn) btn.onclick = () => {
      if (spinning) return; spinning = true;
      const show = $('.mode-show', el);
      show.classList.remove('picked');
      let pick; do { pick = Math.floor(Math.random() * modes.length); } while (modes.length > 1 && pick === last);
      last = pick;
      let n = 0; const total = 14 + pick;           // عدد الدورات
      const spin = () => {
        const m = modes[n % modes.length];
        $('.mode-ico', el).textContent = m.icon; $('.mode-txt', el).textContent = m.text;
        Sound.tick();
        if (n < total) { n++; tm = setTimeout(spin, 60 + n * 9); }
        else {
          const f = modes[pick];
          $('.mode-ico', el).textContent = f.icon; $('.mode-txt', el).textContent = f.text;
          show.classList.add('picked'); bump(show, 1.12); Sound.success(); spinning = false;
        }
      };
      spin();
    };
    return { interactive: true, leave() { clearTimeout(tm); spinning = false; } };
  },


  /* ---------- الختام ---------- */
  closing(s, el) {
    el.innerHTML = `<div class="closing">
      <div class="cl-text">
        <div class="cl-emoji anim">🏆</div>
        <h1 class="cl-title anim">${s.title}</h1>
        <p class="cl-msg anim">${s.message}</p>
        <p class="cl-next anim">${s.next}</p>
        <div class="cl-task anim">${s.task}</div>
        <button class="btn btn-clap anim" data-act="clap">👏 صفّقن لأنفسكنّ</button>
      </div>
      <div class="w-visual anim">
        ${miniSheet(s.fileName, true)}
        <span class="floaty" style="top:-70px;right:-10px">⭐</span>
        <span class="floaty d2" style="bottom:-60px;left:0">💚</span>
        <span class="floaty d3" style="top:40%;left:-80px">🚀</span>
      </div></div>`;
    $('[data-act=clap]', el).onclick = () => clap();
    let t;
    return {
      enter() { clearTimeout(t); t = setTimeout(() => Confetti.burst(120), 500); },
      leave() { clearTimeout(t); }
    };
  }
};

/* ================================================================
   📋 التحضير (يُحفظ تلقائيًا في المتصفح لليوم الحالي)
   ================================================================ */
let CUR_CLASS = Object.keys(CLASSES)[0];
try { const c = localStorage.getItem('att-class'); if (c && CLASSES[c]) CUR_CLASS = c; } catch (e) {}
let STUDENTS = CLASSES[CUR_CLASS], ATT_KEY, ATT;
function loadAtt() {
  STUDENTS = CLASSES[CUR_CLASS];
  ATT_KEY = 'att-' + new Date().toISOString().slice(0, 10) + '-' + CUR_CLASS;
  ATT = STUDENTS.map(() => 'p');                 // p حاضرة | a غائبة | l متأخرة
  try { const sv = JSON.parse(localStorage.getItem(ATT_KEY)); if (Array.isArray(sv) && sv.length === STUDENTS.length) ATT = sv; } catch (e) {}
}
loadAtt();
function setClass(c) {
  if (!CLASSES[c] || c === CUR_CLASS) return;
  CUR_CLASS = c; try { localStorage.setItem('att-class', c); } catch (e) {}
  loadAtt(); Draw.picked = []; $('#drName').textContent = 'من ستجيب الآن؟ 🤔'; $('#drName').classList.remove('win');
  SLIDES.forEach((sl, i) => { if (sl.type === 'attendance') build(i); });
  Sound.success();
}
function saveAtt() { try { localStorage.setItem(ATT_KEY, JSON.stringify(ATT)); } catch (e) {} }
function copyText(t) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); };
  try { navigator.clipboard.writeText(t).catch(fallback); } catch (e) { fallback(); }
}

/* ================================================================
   🎯 قرعة الأسماء — بدون تكرار حتى تنتهي جميع الحاضرات
   ================================================================ */
const Draw = {
  open: false, spinning: false, picked: [], tm: null,
  el: () => $('#draw'),
  avail() { return STUDENTS.filter((n, k) => ATT[k] !== 'a'); },
  info() {
    $('#drTitle').textContent = '🎯 قرعة الأسماء — ' + CUR_CLASS;
    const av = this.avail();
    $('#drInfo').textContent = av.length ? `اختيرت ${this.picked.filter(n => av.includes(n)).length} من ${av.length} طالبة حاضرة` : 'لا توجد طالبات حاضرات — راجعي التحضير';
    $('#drPicked').innerHTML = this.picked.map(n => `<span>${n}</span>`).join('');
  },
  show() { this.el().classList.add('on'); this.open = true; this.info(); Sound.pop(); },
  hide() { this.el().classList.remove('on'); this.open = false; clearTimeout(this.tm); this.spinning = false; },
  reset() { this.picked = []; $('#drName').textContent = 'جولة جديدة! 🎲'; $('#drName').classList.remove('win'); this.info(); Sound.pop(); },
  spin() {
    if (this.spinning) return;
    const av = this.avail(); if (!av.length) return this.info();
    let pool = av.filter(n => !this.picked.includes(n));
    if (!pool.length) { this.picked = []; pool = av.slice(); }
    const winner = pool[Math.floor(Math.random() * pool.length)];
    const nm = $('#drName'); nm.classList.remove('win'); this.spinning = true;
    let n = 0; const steps = 22;
    const tick = () => {
      nm.textContent = av[Math.floor(Math.random() * av.length)]; Sound.tick();
      if (n++ < steps) this.tm = setTimeout(tick, 45 + n * n * 0.35);
      else {
        nm.textContent = winner; nm.classList.add('win'); bump(nm, 1.15);
        this.picked.push(winner); this.spinning = false; this.info(); celebrate();
      }
    };
    tick();
  }
};

/* ================================================================
   🎬  بناء الشرائح والتنقل
   ================================================================ */
const stage = $('#stage'), slidesEl = $('#slides');
const built = [];
let cur = 0;

/* ملاءمة المسرح لحجم الشاشة مع الحفاظ على نسبة 16:9 */
function fit() {
  const sc = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${sc})`;
}
addEventListener('resize', fit); fit();

/* رسم شريحة (وإعادة رسمها عند الضغط على ↺) */
function build(i) {
  const b = built[i], s = SLIDES[i];
  b.api && b.api.leave && b.api.leave();
  const R = RENDERERS[s.type];
  b.el.innerHTML = '';
  b.api = R ? (R(s, b.el) || {}) : (b.el.innerHTML = `<h2 class="stitle">نوع شريحة غير معروف: ${s.type}</h2>`, {});
  $$('.anim', b.el).forEach((n, k) => n.style.setProperty('--i', Math.min(k, 14)));
  if (b.api.interactive) {
    const r = document.createElement('button');
    r.className = 'slide-reset'; r.title = 'إعادة الشريحة من البداية'; r.textContent = '↺';
    r.onclick = () => { build(i); if (i === cur && built[i].api.enter) built[i].api.enter(); Sound.pop(); };
    b.el.appendChild(r);
  }
}

SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide t-' + (s.transition || 'slide');
  slidesEl.appendChild(el);
  built.push({ el, api: {} });
  build(i);
});

function updateUI() {
  $('#curN').textContent = cur + 1;
  $('#totN').textContent = SLIDES.length;
  $('#progress span').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  $('#prevBtn').disabled = cur === 0;
  $('#nextBtn').disabled = cur === SLIDES.length - 1;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
}

function go(n) {
  if (n < 0 || n >= SLIDES.length || n === cur) return;
  const dir = n > cur ? 'fwd' : 'back';
  const old = built[cur];
  old.api.leave && old.api.leave();
  old.el.classList.remove('active', 'fwd', 'back');
  old.el.classList.add('leaving');
  setTimeout(() => old.el.classList.remove('leaving'), 460);
  cur = n;
  const nw = built[cur];
  nw.el.classList.remove('leaving');
  void nw.el.offsetWidth;                       // لإعادة تشغيل الحركات
  nw.el.classList.add('active', dir);
  nw.api.enter && nw.api.enter();
  updateUI();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);

/* البداية (يمكن فتح شريحة محددة بإضافة #رقم للرابط) */
(function start() {
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= SLIDES.length) cur = h - 1;
  built[cur].el.classList.add('active', 'fwd');
  built[cur].api.enter && built[cur].api.enter();
  updateUI();
})();

/* ---------- أزرار شريط التحكم ---------- */
$('#nextBtn').onclick = next;
$('#prevBtn').onclick = prev;
$('#clapBtn').onclick = clap;
$('#drawBtn').onclick = () => Draw.show();
$('#drClose').onclick = () => Draw.hide();
$('#drGo').onclick = () => Draw.spin();
$('#drReset').onclick = () => Draw.reset();
$('#draw').onclick = e => { if (e.target.id === 'draw') Draw.hide(); };
function toggleFS() {
  const d = document;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
$('#fsBtn').onclick = toggleFS;

/* إزالة التركيز عن الأزرار بعد الضغط حتى لا يضغطها Space مرة أخرى */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && document.activeElement === b) b.blur();
});

/* ---------- لوحة المفاتيح ---------- */
window.addEventListener('keydown', e => {
  const typing = e.target.matches && e.target.matches('input, textarea');
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  /* أثناء فتح نافذة القرعة */
  if (Draw.open) {
    if (k === 'Escape') Draw.hide();
    else if (k === ' ' || k === 'Enter' || k === 'ق') { if (!e.repeat) Draw.spin(); }
    else if (k === 'ت' || k === 't' || k === 'T') { if (!e.repeat) clap(); }
    else return;
    e.preventDefault(); return;
  }
  if (k === 'ق') { e.preventDefault(); Draw.show(); return; }
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown') { e.preventDefault(); if (!e.repeat) next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); if (!e.repeat) prev(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
  else if (k === 'ت' || k === 't' || k === 'T') { e.preventDefault(); if (!e.repeat) clap(); }
  else if (k === 'f' || k === 'F') { e.preventDefault(); toggleFS(); }
  else return;
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}, true);

/* منع التمرير بعجلة الماوس أو اللمس */
addEventListener('wheel', e => { if (!e.target.closest('.scroll, textarea')) e.preventDefault(); }, { passive: false });
addEventListener('touchmove', e => { if (!e.target.closest('input, textarea, .scroll')) e.preventDefault(); }, { passive: false });

/* ---------- إخفاء شريط التحكم تلقائيًا ---------- */
const controls = $('#controls'), hint = $('#hint');
let hideT;
function showControls() {
  controls.classList.remove('hide'); hint.classList.remove('hide'); document.body.classList.remove('idle');
  clearTimeout(hideT);
  hideT = setTimeout(() => {
    if (controls.matches(':hover')) return showControls();
    controls.classList.add('hide'); hint.classList.add('hide'); document.body.classList.add('idle');
  }, 2800);
}
addEventListener('pointermove', showControls);
addEventListener('pointerdown', showControls);
showControls();
</script>
</body>
