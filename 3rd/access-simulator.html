<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>محاكي أكسس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: lesson strip → instruction card → scaled Access window (1000×620). Single light look on purpose: it mirrors the real app. */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#1b2230; --muted:#5b6578; --line:#dde2ea;
  --step:#0b78c2; --step-soft:#e3f1fb; --tip:#e2007a; --tip-soft:#fde8f3;
  --acc:#a4373a; --ok:#1f8a4c; --warn:#d97706;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-win:"Segoe UI",Tahoma,"IBM Plex Sans Arabic",Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;padding:16px;padding-block:14px 40px}
*{box-sizing:border-box}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 22px var(--f-win)}
.brand h1{font:700 22px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mode{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.mode button{border:0;background:transparent;font:600 14px var(--f-ui);padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
.mode button.on{background:var(--ink);color:#fff}
.mode button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--step);outline-offset:2px}
.lessons{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lgroup .gl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;min-width:150px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font:500 13px var(--f-ui);cursor:pointer;color:var(--ink);display:flex;gap:6px;align-items:center}
.chip .n{font:700 11px var(--f-win);background:var(--line);border-radius:999px;width:20px;height:20px;display:grid;place-items:center}
.chip.on{background:var(--step);border-color:var(--step);color:#fff}
.chip.on .n{background:#fff;color:var(--step)}
.chip.fin .n{background:var(--ok);color:#fff}
.guide{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.g-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.g-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px}
.g-meta b{color:var(--ink);font:700 16px var(--f-disp)}
.prog{display:flex;gap:3px;flex-wrap:wrap}
.prog i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--step)}
.prog i.c{background:var(--warn)}
.g-step{display:flex;gap:12px;align-items:flex-start}
.stepnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--step);color:#fff;display:grid;place-items:center;font:700 16px var(--f-win);box-shadow:0 0 0 4px var(--step-soft)}
.g-text{font-size:18px;line-height:1.7;min-width:0}
.g-text b{color:var(--step)}
.g-text .exp{display:inline-block;background:#fff6dd;border:1px dashed #e0b44c;border-radius:6px;padding:0 8px;font-weight:700;color:#7a4b00;direction:rtl}
.tip{background:var(--tip-soft);border-inline-start:4px solid var(--tip);border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.6;color:#5c0a33}
.tip b{color:var(--tip)}
.done{background:#e8f6ee;border:1px solid #b6e0c6;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.done h3{margin:0;font:700 18px var(--f-disp);color:var(--ok)}
.g-ctrl{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font:600 14px var(--f-ui);cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#e9edf3}
.btn.pri{background:var(--step);border-color:var(--step);color:#fff}
.btn.pri:hover{background:#0969a9}
.btn.auto{background:var(--tip);border-color:var(--tip);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.row2{display:flex;gap:6px}
.row2 .btn{flex:1}
.score{font-size:12.5px;color:var(--muted);text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);justify-content:center;cursor:pointer}
#stage{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(20,30,50,.14)}
#win{position:absolute;top:0;right:0;width:1000px;height:620px;transform-origin:top right;background:#fff;font-family:var(--f-win);font-size:12px;color:#222;direction:rtl;overflow:hidden;user-select:none;-webkit-user-select:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:#b42318}
#badge{position:fixed;width:30px;height:30px;border-radius:50%;background:var(--step);color:#fff;font:700 15px var(--f-win);display:grid;place-items:center;z-index:40;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff}
#badge[hidden]{display:none}
#cursor{position:fixed;z-index:55;pointer-events:none;width:26px;height:30px;transition:left .65s cubic-bezier(.4,.1,.2,1),top .65s cubic-bezier(.4,.1,.2,1);left:-60px;top:-60px}
.ripple{position:fixed;z-index:54;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid var(--tip);pointer-events:none;animation:rip .5s ease-out forwards}
.ripple.r{border-color:var(--warn)}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
#ghost{position:fixed;z-index:56;pointer-events:none;background:#fff3c4;border:1px solid #c9a227;padding:2px 8px;font:12px var(--f-win);border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.foot{color:var(--muted);font-size:12.5px;line-height:1.6}
@media (max-width:760px){.guide{grid-template-columns:1fr}.g-ctrl{min-width:0}.g-text{font-size:16px}.lgroup .gl{min-width:0;width:100%}}
@media (prefers-reduced-motion:reduce){#cursor{transition:none}.ripple{animation:none;display:none}.glow{animation:none!important}}

/* ===== Access window ===== */
#win button{font-family:inherit}
.glow{outline:3px solid #ff9d00!important;outline-offset:1px;animation:pulse 1.1s ease-in-out infinite;position:relative;z-index:3}
@keyframes pulse{50%{outline-color:#ffd27a;box-shadow:0 0 0 6px rgba(255,157,0,.25)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
[data-t]{cursor:pointer}
input[data-t],select[data-t]{cursor:text}
/* desktop */
.desk{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,#2f7fd3,#0d3a7a 70%);}
.desk .wall{position:absolute;left:60px;top:70px;color:rgba(255,255,255,.85);font:600 28px var(--f-win)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;background:#1f2a38;display:flex;align-items:center;gap:4px;padding:0 6px}
.tb-i{width:36px;height:32px;display:grid;place-items:center;border-radius:4px;color:#cfd8e3}
.tb-i:hover{background:#2e3b4d}
.startbtn{width:44px;height:34px;display:grid;place-items:center;border-radius:4px}
.startbtn:hover{background:#2e3b4d}
.smenu{position:absolute;right:0;bottom:40px;width:330px;height:430px;background:#2b2b2b;color:#fff;display:flex;box-shadow:0 0 20px rgba(0,0,0,.5)}
.smenu .rail{width:48px;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:#ddd;border-left:1px solid #3a3a3a}
.smenu .apps{flex:1;overflow-y:auto;padding:8px 10px;direction:ltr}
.smenu .apps::-webkit-scrollbar{width:6px}.smenu .apps::-webkit-scrollbar-thumb{background:#666}
.smenu .let{color:#bbb;font-size:12px;padding:8px 6px 4px}
.smenu .app{display:flex;align-items:center;gap:10px;padding:6px;border-radius:2px;font-size:13px}
.smenu .app:hover{background:#3d3d3d}
.app .ico{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;font:700 12px var(--f-win);color:#fff}
/* frame */
.title{height:32px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12.5px}
.title .q{display:flex;gap:10px;align-items:center}
.title .q span{width:24px;height:22px;display:grid;place-items:center;border-radius:2px}
.title .q span:hover{background:rgba(255,255,255,.15)}
.title .ctr{display:flex;gap:16px;align-items:center;direction:ltr}
.title .ctr>span:not(.user){font-size:14px;width:28px;text-align:center}
.title .user{font-size:12px}
.rtab svg{width:13px;height:13px}
.user{display:flex;align-items:center;gap:6px}
.user i{width:22px;height:22px;border-radius:50%;background:#c2185b;color:#fff;font:600 10px var(--f-win);display:grid;place-items:center;font-style:normal}
.rtabs{height:28px;display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:#f3f3f3;border-bottom:1px solid #d6d6d6}
.rtab{padding:5px 11px;font-size:12.5px;color:#333;border-bottom:3px solid transparent}
.rtab:hover{background:#e6e6e6}
.rtab.on{border-bottom-color:var(--acc);font-weight:700;color:#111}
.rtab.ctx{color:var(--acc)}
.rtab.tell{margin-right:auto;color:#555;display:flex;gap:4px;align-items:center}
.ribbon{height:92px;background:#f3f3f3;border-bottom:1px solid #d0d0d0;display:flex;align-items:stretch;padding:4px 4px 0;overflow:hidden}
.rg{display:flex;flex-direction:column;border-left:1px solid #d6d6d6;padding:0 4px}
.rg .its{flex:1;display:flex;gap:2px;align-items:flex-start}
.rg .gl{font-size:10.5px;color:#666;text-align:center;padding:2px 0 3px;white-space:nowrap}
.rb{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:2px;font-size:11.5px;color:#222;white-space:nowrap;border:1px solid transparent}
.rb:hover{background:#dcdcdc}
.rb.big{flex-direction:column;justify-content:flex-start;width:auto;min-width:46px;max-width:78px;text-align:center;white-space:normal;line-height:1.25;padding:3px 4px;height:68px}
.rb.big svg{width:28px;height:28px}
.rb svg{width:15px;height:15px;flex:none}
.rb.on{background:#cfcfcf}
.rb.dis{color:#999}
.smallcol{display:flex;flex-direction:column;gap:1px}
.fmt{display:flex;flex-direction:column;gap:4px;padding:4px;color:#555;font-size:11px}
.fmt .fb{display:flex;gap:4px;align-items:center}
.fmt .box{border:1px solid #bbb;background:#fff;padding:1px 6px;min-width:110px}
.main{position:absolute;top:152px;bottom:22px;left:0;right:0;display:flex}
.nav{width:220px;border-left:1px solid #c8c8c8;background:#fff;display:flex;flex-direction:column;flex:none}
.nav-h{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:17px;color:var(--acc);border-bottom:1px solid #e0e0e0}
.nav-h small{font-size:11px;color:#666}
.nav-s{margin:4px 6px;border:1px solid #c8c8c8;padding:2px 6px;color:#999;display:flex;justify-content:space-between}
.nav-g{font-weight:700;padding:5px 8px 2px;display:flex;justify-content:space-between;color:#333}
.nav-i{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;margin:0 2px;font-size:12px}
.nav-i:hover{background:#f0d6d7}
.nav-i.on{background:#f4b6b9}
.nav-i svg{width:15px;height:15px;flex:none}
.doc{flex:1;position:relative;background:#fff;display:flex;flex-direction:column;min-width:0}
.dtabs{height:24px;display:flex;align-items:flex-end;background:#f6f6f6;border-bottom:1px solid #c8c8c8;padding-right:4px}
.dtab{display:flex;align-items:center;gap:5px;padding:3px 8px;font-size:12px;background:#ececec;border:1px solid #c8c8c8;border-bottom:0;margin-left:2px}
.dtab.on{background:#fff;border-top:2px solid var(--acc);font-weight:700}
.dtab svg{width:14px;height:14px}
.dtab .x{color:#777;margin-right:4px}
.dbody{flex:1;position:relative;overflow:hidden}
.empty-doc{position:absolute;inset:0;background:#e6e6e6}
.status{position:absolute;bottom:0;left:0;right:0;height:22px;background:#f0f0f0;border-top:1px solid #d0d0d0;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:11px;color:#444}
/* datasheet */
.ds{position:absolute;inset:0;overflow:auto;background:#fff}
.ds table{border-collapse:collapse;font-size:12px}
.ds th{background:#f0f0f0;border:1px solid #d4d4d4;font-weight:400;padding:3px 8px;text-align:right;white-space:nowrap;min-width:90px;height:22px}
.ds th.sel,.ds td.sel{min-width:18px;width:18px;padding:0;background:#f0f0f0;text-align:center;color:#555}
.ds th.add{color:#777;font-style:italic;min-width:100px;background:#fbe9a8}
.ds td{border:1px solid #e4e4e4;padding:2px 8px;height:21px;white-space:nowrap}
.ds td.num{text-align:left;direction:ltr}
.ds tr.cur td{background:#d9e8f6}
.ds tr.newrow td.sel{color:#999}
.ds tr.edit td.sel{color:#333}
.ds tr.fill td{border-color:#f0f0f0}
.cell{width:100%;min-width:120px;border:1px solid #4a90d9;padding:1px 4px;font:12px var(--f-win);background:#fffde6;outline:0}
/* design */
.dv{position:absolute;inset:0;display:flex;flex-direction:column}
.dv .grid{height:230px;overflow:auto;border-bottom:4px solid #ddd}
.dv table{border-collapse:collapse;width:100%;font-size:12.5px}
.dv th{background:#fce4a0;border:1px solid #d9c27a;padding:3px 8px;text-align:right;font-weight:700}
.dv th.sel{width:20px;background:#ececec;border-color:#d4d4d4}
.dv td{border:1px solid #e0e0e0;padding:0 8px;height:22px}
.dv td.sel{width:20px;background:#f0f0f0;text-align:center;padding:0}
.dv tr.on td{background:#fde7e4}
.dv tr.on td.sel{background:#f3c7c0}
.dv td .tw{display:flex;justify-content:space-between}
.dv select,.dv .cell{font:12.5px var(--f-win);width:100%;min-width:0}
.dv select{border:1px solid #4a90d9;background:#fffde6}
.props{flex:1;display:flex;gap:10px;padding:6px 8px;overflow:hidden}
.props .pbox{width:430px;border:1px solid #ccc;font-size:11.5px;flex:none}
.props .ptabs{display:flex;gap:2px;padding:3px 4px 0;background:#f4f4f4;border-bottom:1px solid #ccc}
.props .ptabs span{padding:2px 10px;border:1px solid #ccc;border-bottom:0;background:#e9e9e9}
.props .ptabs span.on{background:#fff}
.props table{width:100%;border-collapse:collapse}
.props td{border:1px solid #e3e3e3;padding:1px 6px;height:19px}
.props td:first-child{width:46%;color:var(--acc)}
.props select{font:11.5px var(--f-win);width:100%;border:1px solid #4a90d9;background:#fffde6}
.props .help{flex:1;display:grid;place-items:center;color:#555;font-size:11.5px;line-height:1.6;padding:0 20px;text-align:center}
.dv .ptitle{font-size:11px;color:#555;text-align:center;padding-top:4px}
/* rel & query canvas */
.canvas{position:absolute;inset:0;background:#fff;overflow:hidden}
.canvas svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tbox{position:absolute;width:200px;background:#fff;border:1px solid #a4373a;box-shadow:2px 2px 0 rgba(0,0,0,.08);font-size:11.5px}
.tbox .th{padding:4px 8px;font-weight:700;border-bottom:1px solid #a4373a;background:#fff}
.tbox .tf{padding:2px 8px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.tbox .tf:hover{background:#f6dcdc}
.tbox .tf svg{width:11px;height:11px;flex:none}
.tbox .tf.drag{background:#f4b6b9}
.qd{position:absolute;inset:0;display:flex;flex-direction:column}
.qd .up{position:relative;height:250px;border-bottom:5px solid #c9c9e8;background:#fff}
.qd .low{flex:1;overflow:auto;background:#fff;padding:6px}
.qgrid{border-collapse:collapse;font-size:11.5px}
.qgrid th{text-align:left;font-weight:400;color:#333;padding:1px 6px;white-space:nowrap;direction:rtl}
.qgrid td{border:1px solid #d6d6d6;width:118px;height:20px;padding:0 4px;text-align:center}
.qgrid td.l{text-align:right}
.qgrid select,.qgrid .cell{width:100%;min-width:0;font:11.5px var(--f-win)}
.qgrid select{border:1px solid #4a90d9;background:#fffde6}
.chk{display:inline-block;width:12px;height:12px;border:1px solid #666;position:relative;vertical-align:middle}
.chk.on:after{content:"";position:absolute;left:3px;top:0;width:3px;height:7px;border:solid #222;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* pane */
.pane{position:absolute;left:0;top:0;bottom:0;width:210px;background:#fff;border-right:1px solid #c8c8c8;box-shadow:3px 0 8px rgba(0,0,0,.08);display:flex;flex-direction:column;padding:8px;gap:6px;z-index:5}
.pane .ph{display:flex;justify-content:space-between;align-items:center}
.pane .ph b{font-size:17px;color:var(--acc);font-weight:400}
.pane .px{font-size:16px;width:22px;height:22px;display:grid;place-items:center}
.pane .pt{display:flex;gap:10px;font-size:12px;color:#666;border-bottom:1px solid #ddd;padding-bottom:3px}
.pane .pt span.on{color:#000;font-weight:700;border-bottom:2px solid var(--acc)}
.pane .ps{border:1px solid #ccc;padding:2px 6px;color:#999}
.pane .pl{flex:1;border:1px solid #ccc;padding:2px;overflow:auto}
.pane .pi{padding:2px 6px}
.pane .pi.on{background:#f4b6b9}
.pane .pb{border:1px solid #bbb;padding:4px;text-align:center;background:#f7f7f7}
.pane .pb:hover{background:#eee}
/* form view */
.fv{position:absolute;inset:0;overflow:auto;background:#fff;display:flex;flex-direction:column}
.fv .fh{background:#dfe5ee;padding:16px 20px;font-size:20px;color:#3d4a5c;border-bottom:1px solid #c8d0dc}
.fv .fb{flex:1;display:flex}
.fv .rsel{width:16px;background:#e8e8e8;border-left:1px solid #ccc;display:flex;justify-content:center;padding-top:6px;color:#333}
.fv .rsel.on{background:#bcd3ee}
.fv .fields{flex:1;padding:14px 20px;display:flex;flex-direction:column;gap:9px}
.fv .fr{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px}
.fv .fr label{color:#555}
.fv .fr .v{border:1px solid #b8b8b8;padding:3px 6px;min-height:24px;max-width:520px;background:#fff}
.fv .fr .v.s{max-width:90px}
.fv .fr .cell{max-width:520px;height:24px}
.fv .rnav{display:flex;align-items:center;gap:6px;border-top:1px solid #ccc;background:#f3f3f3;padding:3px 8px;font-size:11.5px}
.fv .rnav .nb{padding:0 4px;color:#333}
.fv .rnav input{width:56px;text-align:center;font:11.5px var(--f-win);border:1px solid #aaa;padding:1px}
.fv .rnav .flt{color:#999;margin-right:10px}
/* dialogs */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.12);display:grid;place-items:center;z-index:20}
.dlg{background:#fff;border:1px solid #888;box-shadow:0 8px 28px rgba(0,0,0,.3);font-size:12px}
.dlg .dh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
.dlg .dbtns{display:flex;gap:8px;justify-content:flex-start;padding:10px 12px;direction:ltr}
.dlg .db{border:1px solid #adadad;background:#e1e1e1;padding:4px 18px;min-width:76px;text-align:center;font-size:12px}
.dlg .db.def{border:2px solid #0078d7}
.dlg .db:hover{background:#e5f1fb;border-color:#0078d7}

/* ---------- query engine ---------- */
function runQuery(q){
 const tabs=q.tables;let base;
 const objOf=(tn,r)=>{const o={};S.tables[tn].fields.forEach((f,i)=>o[f.n]=r[i]);return o};
 if(tabs.length===1)base=S.tables[tabs[0]].rows.map(r=>({[tabs[0]]:objOf(tabs[0],r)}));
 else{const hub=tabs.find(tn=>tabs.every(o=>o===tn||S.rels.some(r=>(r.a.t===o&&r.b.t===tn)||(r.b.t===o&&r.a.t===tn))))||tabs[0];
   base=S.tables[hub].rows.map(r=>({[hub]:objOf(hub,r)}));
   tabs.filter(x=>x!==hub).forEach(o=>{const rel=S.rels.find(r=>(r.a.t===o&&r.b.t===hub)||(r.b.t===o&&r.a.t===hub));
     const fo=rel?(rel.a.t===o?rel.a.f:rel.b.f):null,fh=rel?(rel.a.t===o?rel.b.f:rel.a.f):null;
     base.forEach(rec=>{const hit=S.tables[o].rows.map(r=>objOf(o,r)).find(x=>fo&&String(x[fo])===String(rec[hub][fh]));rec[o]=hit||{}})})}
 let rows=base.filter(rec=>q.cols.every(c=>{if(!c.crit)return true;const m=String(c.crit).trim().match(/^(<=|>=|<>|<|>|=)?\s*(.+)$/);const op=m[1]||'=',v=m[2].replace(/^"|"$/g,'');const x=rec[c.t][c.f];const a=isNaN(+x)||isNaN(+v)?String(x):+x,b=isNaN(+x)||isNaN(+v)?v:+v;
   return op==='<'?a<b:op==='>'?a>b:op==='<='?a<=b:op==='>='?a>=b:op==='<>'?a!=b:a==b}));
 const sc=q.cols.filter(c=>c.sort==='تصاعدي'||c.sort==='تنازلي');
 if(sc.length)rows.sort((r1,r2)=>{for(const c of sc){const a=r1[c.t][c.f],b=r2[c.t][c.f];const d=(typeof a==='number'&&typeof b==='number')?a-b:String(a).localeCompare(String(b),'ar');if(d)return c.sort==='تنازلي'?-d:d}return 0});
 const cols=q.cols.filter(c=>c.show);
 return{cols,rows:rows.map(rec=>cols.map(c=>rec[c.t][c.f]))};
}

function rect(el){const r=el.getBoundingClientRect(),w=win.getBoundingClientRect();return{x:(r.left-w.left)/scale,y:(r.top-w.top)/scale,w:r.width/scale,h:r.height/scale}}
function drawLinks(){const cv=document.getElementById('cv');if(!cv)return;const svg=cv.querySelector('svg.links');const c=rect(cv);let s='';
 S.rels.forEach(r=>{const fa=cv.querySelector(`[data-f="${CSS.escape(r.a.t+'|'+r.a.f)}"]`),fb=cv.querySelector(`[data-f="${CSS.escape(r.b.t+'|'+r.b.f)}"]`);if(!fa||!fb)return;
  const A1=rect(fa),B1=rect(fb),ba=rect(fa.closest('.tbox')),bb=rect(fb.closest('.tbox'));
  const aRight=ba.x>bb.x;const ax=(aRight?ba.x:ba.x+ba.w)-c.x,ay=A1.y+A1.h/2-c.y,bx=(aRight?bb.x+bb.w:bb.x)-c.x,by=B1.y+B1.h/2-c.y;const st=aRight?-14:14;
  s+=`<path d="M${ax} ${ay}h${st}L${bx-st} ${by}H${bx}" fill="none" stroke="#333" stroke-width="1.3"/>`;
  if(r.enforce)s+=`<text x="${ax+st/2-3}" y="${ay-4}" font-size="11" fill="#111">1</text><text x="${bx-st/2-6}" y="${by-3}" font-size="13" fill="#111">∞</text>`});
 svg.innerHTML=s}

 if(done)h+=`<div class="done"><h3>أحسنتِ! أنهيتِ الدرس</h3><div>${esc(les.done)}</div>${MODE==='prac'?`<div style="color:var(--muted);font-size:13px">عدد المحاولات الخاطئة: ${mistakes}</div>`:''}</div>`;
 else{h+=`<div class="g-step"><span class="stepnum">${SI+1}</span><div class="g-text">${md(st.text)} ${st.act==='type'||st.act==='select'?`<span class="exp">${esc(st.v)}</span>`:''}</div></div>`;
   if(st.act==='auto')h+=`<div><button class="btn auto" id="autoBtn">${esc(st.autoLabel)}</button></div>`;}
 h+=`<div class="tip">${md(les.tip)}</div></div><div class="g-ctrl">`;
 if(done)h+=`<button class="btn pri" id="nextLesson"${L>=LESSONS.length-1?' disabled':''}>الدرس التالي</button><button class="btn" id="restart">إعادة الدرس</button>`;
 else if(MODE==='demo')h+=`<button class="btn pri" id="play">${playing?'إيقاف مؤقت':'تشغيل تلقائي'}</button><div class="row2"><button class="btn" id="stepBtn"${playing?' disabled':''}>نفّذ الخطوة</button><button class="btn" id="restart">إعادة</button></div><div class="score">يمكنك أيضًا الضغط بنفسك على العنصر المضيء</div>`;
 else h+=`<button class="btn" id="hint">تلميح</button><button class="btn" id="showme">أريني الخطوة</button><button class="btn" id="restart">إعادة الدرس</button><label class="toggle"><input type="checkbox" id="glowT"${glowOff?' checked':''}> تحدٍّ بدون إضاءة</label><div class="score">محاولات خاطئة: ${mistakes}</div>`;
 h+='</div>';
 const gEl=document.getElementById('guide');gEl.innerHTML=h;
 const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
 on('autoBtn',()=>{if(!busy&&cur()&&cur().act==='auto')complete()});

 on('restart',()=>startLesson(L));

 on('showme',()=>{if(!busy)demoStep()});
 const gt=document.getElementById('glowT');if(gt)gt.onchange=()=>{glowOff=gt.checked;render()};
}
function startLesson(i){L=i;SI=0;done=false;mistakes=0;playing=false;armed=false;S=Object.assign({},LESSONS[i].setup());renderLessons();render();}

/* ---------- demo cursor ---------- */
const cursor=document.getElementById('cursor');
function center(el){const r=el.getBoundingClientRect();return{x:r.left+Math.min(r.width/2,60),y:r.top+r.height/2}}
async function moveTo(el){el.scrollIntoView({block:'nearest',inline:'nearest'});const p=center(el);if(parseFloat(cursor.style.left)<0||!cursor.style.left){cursor.style.transition='none';cursor.style.left=(p.x+120)+'px';cursor.style.top=(p.y+80)+'px';cursor.getBoundingClientRect();cursor.style.transition=''}cursor.style.left=p.x+'px';cursor.style.top=p.y+'px';await wait(matchMedia('(prefers-reduced-motion: reduce)').matches?80:700);return p}
function ripple(p,r){const d=document.createElement('div');d.className='ripple'+(r?' r':'');d.style.left=p.x+'px';d.style.top=p.y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),550)}
async function demoStep(){const st=cur();if(!st||done||busy)return;const el=tgt(st.t);if(!el){console.warn('missing',st.t);return}busy=true;
 try{const p=await moveTo(el);
  if(st.act==='type'){ripple(p);el.focus({preventScroll:true});el.value='';for(const ch of st.v){el.value+=ch;await wait(70)}await wait(350)}
  else if(st.act==='select'){ripple(p);await wait(250);el.value=st.v;await wait(400)}
  else if(st.act==='dbl'){ripple(p);await wait(140);ripple(p);await wait(250)}
  else if(st.act==='ctx'){ripple(p,1);toast('ضغط بزر الفأرة الأيمن');await wait(350)}
  else if(st.act==='drag'){ripple(p);const gh=document.createElement('div');gh.id='ghost';gh.textContent=el.textContent.trim();document.body.appendChild(gh);const d=tgt(st.to);const q=center(d);const steps=24;for(let k=1;k<=steps;k++){const x=p.x+(q.x-p.x)*k/steps,y=p.y+(q.y-p.y)*k/steps;gh.style.left=(x+8)+'px';gh.style.top=(y+6)+'px';cursor.style.transition='none';cursor.style.left=x+'px';cursor.style.top=y+'px';await wait(28)}cursor.style.transition='';gh.remove();ripple(q);await wait(200)}
  else{ripple(p);await wait(300)}
 }finally{busy=false}
 complete(st.act==='type'||st.act==='select'?st.v:undefined)}
async function autoplay(){while(playing&&!done){await demoStep();await wait(700)}playing=false;renderGuide()}

 if(el)wrong(el)});
