<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاستعلام في قاعدة البيانات – الثالث متوسط</title>
<!-- خط Tajawal من Google (إن لم يتوفر إنترنت يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والمتغيرات العامة
   ========================================================= */
:root{
  --p900:#3b1f66; --p800:#4c2a85; --p700:#6236a8; --p600:#7c4dcc; --p500:#9b6ff0;
  --p300:#c9b2fa; --p200:#e2d5fd; --p100:#f1eaff; --p50:#faf7ff;
  --mint:#1fb59c; --mint100:#dcf7f1; --pink:#e9609f; --pink100:#fde6f1;
  --sun:#f2a91e; --sun100:#fff3d6; --red:#e2546a; --red100:#fde4e8; --blue:#3f8ae0; --blue100:#e1eefc;
  --ink:#2a1b47; --muted:#6f6489;
  --shadow:0 18px 45px rgba(98,54,168,.13);
  --r:28px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ede5fb;
  font-family:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}

/* =========================================================
   2) المسرح: 1920×1080 (16:9) يتم تكبيره/تصغيره ليملأ الشاشة
   ========================================================= */
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#e9e0fa,#f7f2ff)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--s,1));background:var(--p50);overflow:hidden}
/* زخارف خلفية ناعمة */
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#deco i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
#deco .b1{width:620px;height:620px;background:radial-gradient(circle,#e7dbff 0%,transparent 70%);top:-220px;right:-160px}
#deco .b2{width:560px;height:560px;background:radial-gradient(circle,#ffe1ef 0%,transparent 70%);bottom:-240px;left:-140px}
#deco .b3{width:380px;height:380px;background:radial-gradient(circle,#d8f6ef 0%,transparent 70%);bottom:-120px;right:30%}
#deco .dots{position:absolute;inset:0;background-image:radial-gradient(#d9ccf5 1.6px,transparent 1.6px);background-size:46px 46px;opacity:.35;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 35%,transparent 70%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 35%,transparent 70%,#000 100%)}

/* =========================================================
   3) الشرائح والانتقالات
   ========================================================= */
.slide{position:absolute;inset:0;padding:64px 110px 130px;display:flex;flex-direction:column;
  visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.slide.leaving{visibility:visible;z-index:1;animation:sOut .45s ease forwards;pointer-events:none}
.slide.active.a-fade{animation:fadeIn .7s ease both}
.slide.active.a-zoom{animation:zoomIn .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active.a-slide.dir-f{animation:slideF .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active.a-slide.dir-b{animation:slideB .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slideF{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0;transform:scale(.985)}}
/* ظهور العناصر بالتتابع */
.slide.active .stg{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*110ms + 160ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
/* ظهور تسلسلي تلقائي أبطأ (للأهداف) */
.slide.active .seq{animation:goalIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--g,0)*500ms + 450ms)}
@keyframes goalIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
/* عناصر تظهر عند الضغط */
.rv{opacity:0;transform:translateY(18px) scale(.97);transition:opacity .5s ease,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.rv.shown{opacity:1;transform:none;pointer-events:auto}

/* =========================================================
   4) عناصر مشتركة
   ========================================================= */
.s-head{display:flex;justify-content:space-between;align-items:center;min-height:62px;margin-bottom:14px;gap:20px}
.pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--p200);color:var(--p700);
  font-weight:800;font-size:27px;padding:9px 28px;border-radius:999px;box-shadow:0 6px 18px rgba(98,54,168,.08)}
.s-title{font-size:68px;font-weight:900;margin:0 0 6px;color:var(--p900);line-height:1.25}
.s-title .hl{color:var(--pink)}
.s-sub{font-size:33px;color:var(--muted);margin:0 0 10px;font-weight:500}
.body{flex:1;display:flex;flex-direction:column;justify-content:safe center;min-height:0;position:relative}
.row{display:flex;gap:28px;align-items:center}
.center{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:2px solid #f0e9fc}

.btn{border:0;border-radius:999px;padding:17px 42px;font-size:31px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--p600),var(--p800));box-shadow:0 10px 24px rgba(98,54,168,.3);
  transition:transform .2s,box-shadow .2s,filter .2s,opacity .3s;display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(98,54,168,.38)}
.btn:active{transform:scale(.94)}
.btn.mint{background:linear-gradient(135deg,#2fd0b5,#13927e);box-shadow:0 10px 24px rgba(31,181,156,.3)}
.btn.pink{background:linear-gradient(135deg,#f27fb5,#cf4386);box-shadow:0 10px 24px rgba(233,96,159,.3)}
.btn.sun{background:linear-gradient(135deg,#ffc24d,#e59400);box-shadow:0 10px 24px rgba(242,169,30,.3)}
.btn.ghost{background:#fff;color:var(--p700);border:2px solid var(--p200);box-shadow:0 6px 16px rgba(98,54,168,.1)}
.btn.small{font-size:25px;padding:11px 26px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* المؤقت */
.timer{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--p200);border-radius:999px;
  padding:8px 10px 8px 22px;font-size:34px;font-weight:900;color:var(--p800);position:relative;overflow:hidden;
  box-shadow:0 6px 18px rgba(98,54,168,.1);direction:rtl}
.timer::before{content:"";position:absolute;inset:0;background:var(--p100);transform-origin:right;transform:scaleX(var(--p,1));transition:transform 1s linear;z-index:0}
.timer>*{position:relative;z-index:1}
.timer .t-val{min-width:110px;text-align:center;font-variant-numeric:tabular-nums;direction:ltr}
.timer .t-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--p600);color:#fff;font-size:22px;font-weight:900;transition:transform .15s}
.timer .t-btn:hover{transform:scale(1.08)}
.timer .t-btn.alt{background:#fff;color:var(--p700);border:2px solid var(--p200)}
.timer.urgent{color:var(--red);animation:pulse .5s ease infinite alternate}
.timer.done{color:var(--red)}
@keyframes pulse{to{transform:scale(1.05)}}

/* الرسائل الفورية */
.feedback{min-height:70px;font-size:38px;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}
.feedback .ok{color:var(--mint);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.feedback .no{color:var(--pink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s ease !important}
.float{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* =========================================================
   5) أنماط كل نوع شريحة
   ========================================================= */
/* --- الترحيب --- */
.title-wrap{flex:1;display:flex;align-items:center;justify-content:space-between;gap:60px;padding-top:20px}
.title-wrap .t-text{flex:1.2}
.badge{display:inline-block;background:var(--p100);color:var(--p700);font-size:32px;font-weight:800;padding:10px 30px;border-radius:999px;margin-bottom:24px}
.big{font-size:150px;font-weight:900;line-height:1.1;margin:0;color:var(--p900)}
.big span{background:linear-gradient(135deg,var(--p600),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:42px;color:var(--muted);margin:24px 0 30px;font-weight:500;line-height:1.5}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:44px}
.meta span{background:#fff;border:2px solid var(--p200);border-radius:999px;padding:10px 26px;font-size:28px;font-weight:700;color:var(--p800)}
.t-art{flex:1;display:flex;align-items:center;justify-content:center;position:relative;height:640px}
.t-art .ring{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#efe6ff 60%,transparent 72%)}
.t-art svg{width:340px;position:relative}
.orb{position:absolute;font-size:64px;background:#fff;width:116px;height:116px;border-radius:32px;display:grid;place-items:center;box-shadow:var(--shadow)}
.orb.o1{top:40px;right:40px;animation-delay:-1s}.orb.o2{bottom:70px;right:10px;animation-delay:-2s}
.orb.o3{top:110px;left:20px;animation-delay:-3s}.orb.o4{bottom:40px;left:80px;animation-delay:-.5s}

/* --- قرعة الأسماء --- */
.roster{flex-direction:row;gap:34px;align-items:stretch}
.r-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:safe center;overflow-y:auto;overscroll-behavior:contain;padding:8px}
.r-card{background:#fff;border:2px solid var(--p200);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  font-size:25px;font-weight:700;min-height:92px;transition:all .18s ease;position:relative}
.r-card b{flex:none;width:44px;height:44px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-size:22px}
.r-card.lit{background:linear-gradient(135deg,var(--p600),var(--pink));color:#fff;transform:scale(1.07);border-color:transparent;box-shadow:0 12px 30px rgba(124,77,204,.4);z-index:2}
.r-card.lit b{background:#fff3}
.r-card.done{opacity:.4}
.r-card.done::after{content:"✓";position:absolute;left:14px;top:8px;color:var(--mint);font-weight:900;font-size:26px}
.r-card.win{background:linear-gradient(135deg,var(--mint),#13927e);color:#fff;opacity:1;transform:scale(1.07)}
.r-side{width:470px;padding:36px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.r-win-lbl{font-size:28px;color:var(--muted);font-weight:700}
.r-win-name{font-size:52px;font-weight:900;color:var(--p800);min-height:140px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.r-win-name.go{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.chk{display:flex;align-items:center;gap:12px;font-size:27px;font-weight:700;color:var(--p800);cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--p600)}
.r-left{font-size:26px;color:var(--muted)}
.r-left b{color:var(--p700)}

/* --- مبدّل الفصل --- */
.cls-switch{display:inline-flex;background:#fff;border:2px solid var(--p200);border-radius:999px;padding:5px;gap:4px;align-self:center}
.cls-switch button{border:0;background:none;font-size:25px;font-weight:800;color:var(--p700);padding:8px 22px;border-radius:999px;transition:all .2s}
.cls-switch button.on{background:linear-gradient(135deg,var(--p600),var(--p800));color:#fff}
.cls-switch button:not(.on):hover{background:var(--p100)}

/* --- التحضير --- */
.att{flex-direction:row;gap:34px;align-items:stretch}
.a-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:safe center;overflow-y:auto;overscroll-behavior:contain;padding:8px}
.a-grid:empty::before,.r-grid:empty::before{content:'📋 لا توجد أسماء طالبات في هذه الشعبة — أضيفيها من لوحة الإدارة';grid-column:1/-1;text-align:center;font-size:34px;font-weight:800;color:var(--muted)}
.a-grid::-webkit-scrollbar,.r-grid::-webkit-scrollbar{width:14px}
.a-grid::-webkit-scrollbar-thumb,.r-grid::-webkit-scrollbar-thumb{background:var(--p200);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
.a-card{background:#fff;border:3px solid var(--p200);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  font-size:25px;font-weight:700;min-height:96px;transition:all .2s ease;text-align:right;color:var(--ink)}
.a-card:hover{transform:translateY(-3px)}
.a-card .st{flex:none;width:48px;height:48px;border-radius:50%;background:var(--p100);color:var(--p500);display:grid;place-items:center;font-size:24px;font-weight:900}
.a-card.present{background:var(--mint100);border-color:var(--mint)} .a-card.present .st{background:var(--mint);color:#fff}
.a-card.absent{background:var(--red100);border-color:var(--red);color:#9b2c3d} .a-card.absent .st{background:var(--red);color:#fff}
.a-card.late{background:var(--sun100);border-color:var(--sun)} .a-card.late .st{background:var(--sun);color:#fff}
.a-card.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.a-side{width:470px;padding:30px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.a-date{text-align:center;font-size:26px;font-weight:800;color:var(--p700);background:var(--p100);border-radius:18px;padding:10px}
.a-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a-stat{border-radius:20px;padding:12px;text-align:center;background:var(--bg);color:var(--c)}
.a-stat b{display:block;font-size:46px;font-weight:900;line-height:1.1}
.a-stat span{font-size:23px;font-weight:800}
.a-msg{text-align:center;font-size:28px;font-weight:900;color:var(--mint);min-height:40px}
.a-side .btn{justify-content:center}
.r-card.absent{opacity:.3;filter:grayscale(1)}
.r-card.absent::after{content:"غائبة";position:absolute;left:10px;top:6px;font-size:18px;color:var(--red);font-weight:900}

/* --- بطاقات قلابة --- */
.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.flip{height:236px;perspective:1300px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip:hover .front{border-color:var(--p500)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px 30px;text-align:center;gap:10px}
.front{background:#fff;border:2px solid var(--p200);box-shadow:var(--shadow);font-size:32px;font-weight:700;line-height:1.45;transition:border-color .2s}
.front .ic{font-size:48px}
.front .tap{font-size:21px;color:var(--p500);font-weight:700}
.back{background:linear-gradient(135deg,var(--p600),var(--p800));color:#fff;transform:rotateY(180deg);font-size:42px;font-weight:900;line-height:1.35;box-shadow:var(--shadow)}
.back.mintbg{background:linear-gradient(135deg,#2fd0b5,#13927e)}
.back small{font-size:26px;font-weight:600;opacity:.95;line-height:1.5}
.tag{font-size:22px;font-weight:800;padding:5px 18px;border-radius:999px;background:var(--pink100);color:var(--pink)}
.back .tag{background:#ffffff30;color:#fff}

/* --- الأهداف --- */
.goals{display:flex;flex-direction:column;gap:22px;max-width:1350px}
.goal{display:flex;align-items:center;gap:28px;background:#fff;border-radius:26px;padding:22px 34px;box-shadow:var(--shadow);border-right:12px solid var(--c,var(--p500))}
.goal .n{flex:none;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:44px;background:var(--bg,var(--p100))}
.goal p{margin:0;font-size:40px;font-weight:700}
.goal p b{color:var(--c)}

/* --- التمهيد --- */
.hook{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.scene{padding:44px 46px;font-size:38px;line-height:1.6;font-weight:600;position:relative}
.scene .phone{font-size:90px;display:inline-block;animation:ring 1.6s ease-in-out infinite;transform-origin:50% 80%}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-14deg)}10%,20%,30%{transform:rotate(14deg)}}
.scene b{color:var(--pink)}
.opts-col{display:flex;flex-direction:column;gap:22px}
.opt-card{display:flex;align-items:center;gap:24px;padding:26px 32px;font-size:34px;font-weight:700;border-radius:26px;background:#fff;box-shadow:var(--shadow)}
.opt-card .e{font-size:62px}
.opt-card small{display:block;font-size:28px;font-weight:800;margin-top:6px}
.opt-card.slow small{color:var(--red)} .opt-card.fast small{color:var(--mint)}
.secret{grid-column:1/-1;text-align:center;font-size:52px;font-weight:900;color:#fff;padding:26px;border-radius:30px;
  background:linear-gradient(135deg,var(--p600),var(--pink));box-shadow:0 18px 40px rgba(124,77,204,.35)}

/* --- لاحظ واكتشف (البيانات المبعثرة) --- */
.scatter-area{position:relative;height:560px;width:1700px;margin:0 auto}
.sc-card{position:absolute;left:470px;top:0;width:760px;height:550px;border-radius:32px;background:#fff;border:3px dashed var(--p200);transition:all .7s ease;opacity:0;transform:scale(.9)}
.organized .sc-card{opacity:1;transform:none;border-style:solid;border-color:var(--p300);box-shadow:var(--shadow)}
.sc-card h3{margin:22px 0 0;text-align:center;font-size:36px;color:var(--p700)}
.chip{position:absolute;width:270px;height:84px;border-radius:22px;background:var(--sun100);border:3px solid #f6d48a;display:grid;place-items:center;
  font-size:38px;font-weight:900;color:#7a4b00;direction:ltr;transition:left .9s cubic-bezier(.3,1.3,.5,1),top .9s cubic-bezier(.3,1.3,.5,1),transform .9s ease,background .6s,border-color .6s;box-shadow:0 10px 22px rgba(242,169,30,.2)}
.chip.wob{animation:wobble 3s ease-in-out infinite}
@keyframes wobble{0%,100%{margin-top:0}50%{margin-top:-12px}}
.organized .chip{background:var(--mint100);border-color:#8fe0cf;color:#0d6b5c;animation:none}
.sc-label{position:absolute;width:330px;height:84px;display:flex;align-items:center;font-size:36px;font-weight:800;color:var(--p800);opacity:0;transform:translateX(30px);transition:all .6s ease .5s}
.organized .sc-label{opacity:1;transform:none}
.sc-msg{text-align:center;font-size:40px;font-weight:800;min-height:64px;margin-bottom:6px}
.sc-msg .q{color:var(--p700)} .sc-msg .a{color:var(--mint)}

/* --- مقارنة البيانات والمعلومات --- */
.defs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:34px}
.def{padding:26px 34px;border-radius:26px;font-size:33px;line-height:1.55;font-weight:600;display:flex;gap:22px;align-items:center}
.def .e{font-size:64px}
.def b{display:block;font-size:40px;font-weight:900}
.def.data{background:var(--sun100);border:3px solid #f6d48a} .def.data b{color:#b26b00}
.def.info{background:var(--mint100);border:3px solid #9de6d6} .def.info b{color:#0f8a75}
.cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.cmp-grid .flip{height:250px}
.cmp-grid .front{background:var(--sun100);border-color:#f6d48a;font-size:52px;font-weight:900;color:#7a4b00}

/* --- مدخلات / معالجة / مخرجات --- */
.proc{display:flex;align-items:center;justify-content:center;gap:30px;margin:10px 0 30px}
.stepc{width:400px;height:360px;border-radius:40px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  border:4px solid transparent;transition:all .5s;position:relative}
.stepc .e{font-size:96px;transition:transform .6s}
.stepc h4{margin:0;font-size:38px;font-weight:900}
.stepc .v{font-size:46px;font-weight:900;direction:ltr;min-height:62px;color:var(--p700);opacity:0;transition:opacity .4s}
.stepc.on{border-color:var(--c);transform:translateY(-10px);box-shadow:0 24px 50px rgba(98,54,168,.22)}
.stepc.on .v{opacity:1}
.stepc.spin .e{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arrow{font-size:70px;color:var(--p300);transition:color .4s,transform .4s}
.arrow.on{color:var(--p600);transform:scale(1.2)}
.proc-notes{display:flex;justify-content:center;gap:30px}
.proc-notes .note{font-size:34px;font-weight:800;padding:16px 34px;border-radius:999px}

/* --- فكر زاوج شارك --- */
.tps-q{padding:24px 40px;font-size:40px;font-weight:800;line-height:1.5;text-align:center;margin-bottom:24px}
.tps-q b{color:var(--pink)}
.tps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.phase{padding:20px 24px;border-radius:30px;background:#fff;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;border:3px solid transparent;transition:all .3s}
.phase .e{font-size:60px;line-height:1}
.phase h4{margin:0;font-size:42px;font-weight:900;color:var(--c)}
.phase p{margin:0;font-size:27px;color:var(--muted);font-weight:600}
.phase.cur{border-color:var(--c);transform:translateY(-8px)}
.model{margin-top:20px;text-align:center;font-size:34px;font-weight:700;padding:20px 30px;border-radius:24px;background:var(--mint100);color:#0d6b5c;line-height:1.6}

/* --- اختيار من متعدد --- */
.mcq-q{padding:34px 46px;font-size:48px;font-weight:900;text-align:center;line-height:1.45;margin-bottom:34px;color:var(--p900)}
.mcq-opts{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.opt{display:flex;align-items:center;gap:22px;text-align:right;padding:24px 32px;border-radius:26px;background:#fff;border:3px solid var(--p200);
  font-size:34px;font-weight:700;line-height:1.4;box-shadow:0 8px 20px rgba(98,54,168,.08);transition:transform .2s,border-color .2s,background .3s;min-height:118px}
.opt:hover{transform:translateY(-4px);border-color:var(--p500)}
.opt:active{transform:scale(.97)}
.opt .k{flex:none;width:62px;height:62px;border-radius:18px;background:var(--p100);display:grid;place-items:center;font-size:36px}
.opt.right{background:var(--mint100);border-color:var(--mint);color:#0b5f51}
.opt.wrong{background:var(--red100);border-color:var(--red);opacity:.75}
.mcq-foot{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:20px}

/* --- أنواع البيانات --- */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.type{border-radius:32px;background:#fff;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .25s;display:flex;flex-direction:column}
.type:hover{transform:translateY(-6px)}
.type .top{padding:28px;text-align:center;color:#fff;background:var(--c)}
.type .top .e{font-size:76px;line-height:1}
.type .top h3{margin:10px 0 0;font-size:42px;font-weight:900}
.type .desc{padding:22px 28px 6px;font-size:29px;line-height:1.55;font-weight:600;text-align:center;min-height:150px}
.type .ex{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:6px 22px 28px;min-height:150px;align-content:flex-start}
.type .ex span{font-size:29px;font-weight:800;padding:8px 20px;border-radius:16px;background:var(--bg);color:var(--c);opacity:0;transform:scale(.6);transition:all .4s cubic-bezier(.2,1.6,.4,1);direction:ltr;unicode-bidi:plaintext}
.type.open .ex span{opacity:1;transform:none}
.type .ex .hint{opacity:1;transform:none;background:none;color:var(--muted);font-size:24px;font-weight:700}
.type.open .ex .hint{display:none}

/* --- تحدي التصنيف --- */
.cl-top{display:flex;justify-content:center;align-items:center;gap:26px;margin-bottom:20px}
.score{font-size:34px;font-weight:900;background:#fff;border:2px solid var(--p200);border-radius:999px;padding:10px 30px;color:var(--p800)}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;min-height:190px;align-content:center;padding:10px}
.item{font-size:36px;font-weight:900;padding:16px 32px;border-radius:20px;background:#fff;border:3px solid var(--p200);box-shadow:0 8px 18px rgba(98,54,168,.1);
  transition:transform .2s,border-color .2s,background .2s;cursor:pointer;unicode-bidi:plaintext}
.item:hover{transform:translateY(-4px)}
.item.sel{border-color:var(--p600);background:var(--p100);transform:scale(1.08);box-shadow:0 0 0 6px #9b6ff044}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:18px}
.bucket{border-radius:30px;border:4px dashed var(--c);background:var(--bg);min-height:250px;padding:18px;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center}
.bucket:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.bucket h4{margin:0 0 12px;font-size:36px;font-weight:900;color:var(--c)}
.bucket .in{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bucket .in span{font-size:27px;font-weight:800;background:#fff;border-radius:14px;padding:6px 16px;color:var(--c);animation:pop .4s cubic-bezier(.2,1.6,.4,1);unicode-bidi:plaintext}

/* --- قاعدة البيانات (عرض حي) --- */
.dbdef{padding:24px 40px;font-size:35px;line-height:1.6;font-weight:600;display:flex;align-items:center;gap:26px;margin-bottom:22px}
.dbdef .e{font-size:76px}
.dbdef b{color:var(--p700)}
.verbs{display:flex;gap:16px;margin-top:4px}
.verbs span{font-size:27px;font-weight:800;padding:6px 20px;border-radius:999px;background:var(--p100);color:var(--p700)}
.demo{padding:22px 30px}
.demo-bar{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.db-search{flex:1;font-size:30px;font-weight:700;padding:14px 26px;border-radius:999px;border:3px solid var(--p200);outline:none;color:var(--ink);background:var(--p50)}
.db-search:focus{border-color:var(--p500)}
.db-info{font-size:28px;font-weight:800;color:var(--mint);min-width:250px;text-align:center}
.db-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rec{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:2px solid var(--p200);font-size:24px;font-weight:700;transition:opacity .3s,background .3s,border-color .3s,box-shadow .3s}
.rec b{flex:none;font-size:20px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--p100);color:var(--p700)}
.rec.dim{opacity:.25}
.rec.match{background:var(--mint100);border-color:var(--mint);box-shadow:0 0 0 5px #1fb59c33}

/* --- العصف الذهني --- */
.storm{position:relative;height:640px}
.storm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.storm line{stroke:var(--p300);stroke-width:4;stroke-dasharray:10 10;animation:dash 1s linear}
@keyframes dash{from{stroke-dashoffset:200}}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;
  background:linear-gradient(135deg,var(--p600),var(--pink));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;text-align:center;box-shadow:0 20px 50px rgba(124,77,204,.4);z-index:2;line-height:1.3}
.core .e{font-size:72px}
.idea{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--c,var(--p300));border-radius:999px;padding:14px 30px;
  font-size:31px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow);animation:popIdea .6s cubic-bezier(.2,1.6,.4,1) both;z-index:3}
@keyframes popIdea{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.storm-bar{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:6px}
.storm-input{width:520px;font-size:28px;font-weight:700;padding:13px 26px;border-radius:999px;border:3px solid var(--p200);outline:none;background:#fff;color:var(--ink)}
.storm-input:focus{border-color:var(--p500)}

/* --- الجدول والسجل والحقل --- */
.trf{display:grid;grid-template-columns:1.45fr 1fr;gap:40px;align-items:center}
.tbl-wrap{position:relative;padding:40px 0 0 40px}
.tbl{position:relative;background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:16px 20px 20px;border:4px solid transparent;transition:border-color .4s,box-shadow .4s}
.tbl h5{margin:0 0 10px;font-size:30px;color:var(--p700);font-weight:900}
.tbl table{width:100%;border-collapse:separate;border-spacing:0}
.tbl th,.tbl td{font-size:27px;padding:14px 14px;text-align:center;border-bottom:2px solid var(--p100);transition:background .35s,color .35s,box-shadow .35s}
.tbl th{background:var(--p100);color:var(--p800);font-weight:900}
.tbl th:first-child{border-radius:0 14px 14px 0}.tbl th:last-child{border-radius:14px 0 0 14px}
.tbl td{font-weight:700}
.tbl.behind{position:absolute;top:0;left:0;width:calc(100% - 40px);opacity:0;transform:translate(10px,10px);transition:all .5s ease}
.tbl.behind table{opacity:.45}
.tbl-wrap.db .tbl.behind{opacity:1;transform:none}
.tbl-wrap.db .tbl.fr{border-color:var(--p500)}
.tbl-wrap.db{outline:4px dashed var(--p500);outline-offset:14px;border-radius:30px}
.tbl.fr.all{border-color:var(--blue);box-shadow:0 0 0 8px #3f8ae022,var(--shadow)}
.tbl td.hr{background:#ffe9d9;color:#a5450d}
.tbl td.hc,.tbl th.hc{background:#ddf6e9;color:#147a46}
.trf-side{display:flex;flex-direction:column;gap:18px}
.trf-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.trf-btns .btn{justify-content:center}
.trf-btns .btn.act{outline:5px solid #fff;box-shadow:0 0 0 9px var(--p300)}
.explain{padding:28px 32px;font-size:32px;line-height:1.6;font-weight:600;min-height:240px}
.explain b{display:block;font-size:42px;font-weight:900;color:var(--p700);margin-bottom:6px}

/* --- التعلم التعاوني (بطاقة الحيوان) --- */
.coop{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.steps{display:flex;flex-direction:column;gap:16px}
.steps .st{display:flex;gap:18px;align-items:center;font-size:33px;font-weight:700;background:#fff;padding:18px 26px;border-radius:22px;box-shadow:0 8px 20px rgba(98,54,168,.08)}
.steps .st i{font-style:normal;flex:none;width:52px;height:52px;border-radius:50%;background:var(--p600);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}
.roles{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.roles span{font-size:26px;font-weight:800;padding:8px 20px;border-radius:999px;background:var(--pink100);color:#b23a73}
.acard{border-radius:32px;background:linear-gradient(160deg,#fff 40%,#fff6e3);border:4px solid #f6d48a;padding:26px 34px;box-shadow:var(--shadow)}
.acard .pic{height:150px;border-radius:22px;background:var(--sun100);display:grid;place-items:center;font-size:110px;margin-bottom:14px}
.aline{display:flex;justify-content:space-between;align-items:center;font-size:30px;padding:10px 4px;border-bottom:2px dotted #f0d9a6;cursor:pointer}
.aline span{font-weight:800;color:#8a5a00}
.aline em{font-style:normal;font-weight:900;color:var(--p800);background:var(--p100);border-radius:12px;padding:2px 18px;min-width:80px;text-align:center;transition:all .3s}
.aline.on em{background:var(--mint100);color:#0d6b5c}
.coop-end{grid-column:1/-1;text-align:center;font-size:36px;font-weight:900;padding:18px;border-radius:24px;background:var(--p700);color:#fff}

/* --- التوصيل --- */
.match{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center}
.mcol{display:flex;flex-direction:column;gap:20px}
.mbtn{font-size:36px;font-weight:900;padding:22px 30px;border-radius:24px;border:3px solid var(--p200);background:#fff;box-shadow:0 8px 18px rgba(98,54,168,.08);transition:all .25s;display:flex;align-items:center;gap:16px;justify-content:center;position:relative}
.mbtn:hover{transform:translateY(-3px);border-color:var(--p500)}
.mcol.terms .mbtn{background:var(--p700);color:#fff;border-color:var(--p700)}
.mbtn.sel{box-shadow:0 0 0 7px #f2a91e88;transform:scale(1.04)}
.mbtn.done{background:var(--mc)!important;border-color:var(--mc)!important;color:#fff!important;pointer-events:none}
.mbtn .tick{position:absolute;left:18px;font-size:30px}
.mid-ic{text-align:center;font-size:80px;opacity:.5}

/* --- صح أم خطأ --- */
.tf-card{padding:46px 60px;text-align:center;font-size:50px;font-weight:900;line-height:1.5;color:var(--p900);min-height:250px;display:flex;align-items:center;justify-content:center;position:relative}
.tf-card .num{position:absolute;top:18px;right:28px;font-size:26px;color:var(--p500);font-weight:800}
.tf-card.in{animation:zoomIn .5s cubic-bezier(.2,.8,.2,1)}
.tf-btns{display:flex;justify-content:center;gap:40px;margin:30px 0 10px}
.tfb{font-size:48px;font-weight:900;padding:22px 70px;border-radius:28px;border:4px solid;background:#fff;transition:transform .2s;display:flex;gap:16px;align-items:center}
.tfb:hover{transform:translateY(-5px) scale(1.03)}
.tfb.t{border-color:var(--mint);color:var(--mint)} .tfb.f{border-color:var(--red);color:var(--red)}
.tfb.t.picked{background:var(--mint);color:#fff}.tfb.f.picked{background:var(--red);color:#fff}
.tf-why{text-align:center;font-size:32px;font-weight:700;color:var(--muted);min-height:50px}
.tf-nav{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:8px}
.tf-dots{display:flex;gap:10px}
.tf-dots i{width:18px;height:18px;border-radius:50%;background:var(--p200)}
.tf-dots i.cur{background:var(--p600);transform:scale(1.3)}
.tf-dots i.ok{background:var(--mint)} .tf-dots i.no{background:var(--red)}

/* --- إثراء: تفكير عليا --- */
.hots{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:start}
.lvls{display:flex;gap:12px;margin-bottom:16px}
.lvls span{font-size:25px;font-weight:800;padding:7px 20px;border-radius:999px;background:var(--sun100);color:#9a5d00;border:2px solid #f6d48a}
.h-scn{font-size:32px;font-weight:700;line-height:1.55;padding:20px 30px;border-radius:24px;background:var(--p100);color:var(--p900);margin-bottom:16px}
.h-scn b{color:var(--pink)}
.h-q{padding:28px 34px;font-size:37px;font-weight:800;line-height:1.6;color:var(--p900);border-right:12px solid var(--sun)}
.h-q b{color:var(--p600)}
.h-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}
.h-hint{font-size:30px;font-weight:700;color:#9a5d00;margin-top:16px;min-height:44px}
.h-side{display:flex;flex-direction:column;gap:18px}
.h-model{padding:22px 26px}
.h-model h4{margin:0 0 12px;font-size:32px;color:var(--mint);font-weight:900;text-align:center}
.h-model table{width:100%;border-collapse:separate;border-spacing:0 8px}
.h-model td{font-size:28px;font-weight:800;padding:10px 18px;background:var(--p50)}
.h-model td:first-child{border-radius:0 14px 14px 0;color:var(--p800)}
.h-model td:last-child{border-radius:14px 0 0 14px;color:var(--muted);text-align:left}
.h-deep{padding:24px 28px;font-size:30px;font-weight:700;line-height:1.55;background:#fff;border:3px dashed var(--p300);border-radius:24px}
.h-deep b{color:var(--p700)}
.h-deep .ans{margin-top:12px;color:#0d6b5c;background:var(--mint100);border-radius:16px;padding:12px 18px;font-size:28px}
.ph{border:3px dashed var(--p200);border-radius:24px;display:grid;place-items:center;text-align:center;color:var(--p300);font-size:30px;font-weight:800;min-height:300px}

/* --- المراجعة (صناديق متداخلة) --- */
.rev{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.nest{border-radius:30px;padding:56px 26px 26px;position:relative;border:4px solid var(--c);background:var(--bg)}
.nest>.lbl{position:absolute;top:10px;right:24px;font-size:32px;font-weight:900;color:var(--c)}
.n1{--c:var(--p600);--bg:var(--p100);min-height:420px}
.n2{--c:var(--blue);--bg:#fff}
.n3{--c:#e07b2c;--bg:#fff4ea}
.n4{--c:var(--mint);--bg:#e6faf5;padding:20px 26px;text-align:center;font-size:30px;font-weight:800;color:#0d6b5c}
.n4 .lbl{position:static!important;display:block;margin-bottom:6px}
.rev-side{display:flex;flex-direction:column;gap:22px}
.eq{padding:28px;text-align:center;font-size:40px;font-weight:900;line-height:1.5}
.eq .d{color:#b26b00}.eq .i{color:var(--mint)}
.types-mini{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.types-mini span{font-size:30px;font-weight:800;padding:12px 26px;border-radius:999px;color:#fff}

/* --- التقييم الفوري --- */
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-bottom:30px}
.fbtn{border:0;border-radius:32px;padding:30px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .2s;border:4px solid transparent}
.fbtn:hover{transform:translateY(-6px);border-color:var(--c)}
.fbtn:active{transform:scale(.95)}
.fbtn .e{font-size:100px;line-height:1}
.fbtn h4{margin:0;font-size:36px;font-weight:900;color:var(--c)}
.fbtn .cnt{font-size:52px;font-weight:900;color:var(--c);min-width:90px;border-radius:20px;background:var(--bg)}
.ticket{padding:28px 40px;display:flex;align-items:center;gap:30px;font-size:34px;font-weight:700;line-height:1.6}
.ticket .e{font-size:80px}
.ticket b{color:var(--p700)}

/* --- الختام --- */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .heart{font-size:150px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.end h1{font-size:96px;font-weight:900;margin:10px 0;color:var(--p900)}
.end h1 span{color:var(--pink)}
.end p{font-size:40px;color:var(--muted);font-weight:600;margin:0 0 26px;line-height:1.5}
.next-lesson{display:inline-flex;align-items:center;gap:20px;font-size:36px;font-weight:800;padding:20px 40px;border-radius:999px;background:var(--mint100);color:#0d6b5c;margin-bottom:28px}
.motto{font-size:40px;font-weight:900;color:var(--p700);padding:16px 50px;border:3px dashed var(--p300);border-radius:999px;margin-bottom:34px}

/* =========================================================
   6) شريط التحكم والمؤشرات (خارج المسرح)
   ========================================================= */
#progress{position:fixed;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--pink),var(--p600));z-index:30;transition:width .5s ease}
#controls{position:fixed;left:50%;bottom:clamp(10px,2vh,24px);transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:clamp(6px,.7vw,12px);padding:clamp(6px,.6vw,10px) clamp(10px,1vw,16px);
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:999px;box-shadow:0 12px 34px rgba(60,30,110,.2);border:1px solid #fff;transition:opacity .4s,transform .4s}
#controls.hide,#hint.hide{opacity:0;pointer-events:none}
#controls.hide{transform:translateX(-50%) translateY(20px)}
.cb{border:0;background:var(--p100);color:var(--p800);font-weight:800;font-size:clamp(13px,1.1vw,19px);
  padding:clamp(7px,.6vw,11px) clamp(12px,1.2vw,22px);border-radius:999px;transition:all .2s;white-space:nowrap}
.cb:hover{background:var(--p600);color:#fff;transform:translateY(-2px)}
.cb:active{transform:scale(.92)}
.cb.round{width:clamp(34px,2.9vw,50px);height:clamp(34px,2.9vw,50px);padding:0;font-size:clamp(17px,1.5vw,25px);display:grid;place-items:center}
.cb.clap{background:linear-gradient(135deg,#ffd36b,#f2a91e)}
#counter{font-weight:900;font-size:clamp(14px,1.15vw,20px);color:var(--p800);min-width:clamp(60px,5vw,84px);text-align:center;font-variant-numeric:tabular-nums}
.sep{width:2px;height:28px;background:var(--p200);margin:0 4px}
#hint{position:fixed;top:clamp(10px,1.6vh,20px);left:clamp(10px,1.2vw,22px);z-index:40;direction:rtl;

<!-- شريط التحكم السفلي -->

</div>

<div id="drawModal">
  <div class="dm-box">

/* =====================================================================
   🔊 الأصوات (Web Audio API — بدون أي ملفات خارجية)
   ===================================================================== */
const Sound = {
  ctx:null, noise:null, out:null,
  init(){
    try{
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return false;
        this.ctx = new AC();
        this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
        const len = this.ctx.sampleRate * .25, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
        this.noise = b;
      }
      if(this.ctx.state === 'suspended') this.ctx.resume();
      return true;
    }catch(e){ return false; }
  },
  /* صفقة واحدة = نبضة ضوضاء قصيرة مفلترة */
  clapOne(t, gain, freq){
    const c=this.ctx, s=c.createBufferSource(), bp=c.createBiquadFilter(), hp=c.createBiquadFilter(), g=c.createGain();
    s.buffer=this.noise; bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=.8; hp.type='highpass'; hp.frequency.value=600;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.08+Math.random()*.05);
    s.connect(bp); bp.connect(hp); hp.connect(g); g.connect(this.out); s.start(t); s.stop(t+.2);
  },
  /* تصفيق جماعي قصير (~1.8 ثانية) */
  applause(){
    if(!this.init()) return;
    const now=this.ctx.currentTime+.02;
    for(let i=0;i<55;i++){
      const dt=Math.random()*1.7, fade=dt>1.1 ? Math.max(.12,1-(dt-1.1)/.6) : 1;
      this.clapOne(now+dt, (.22+Math.random()*.38)*fade, 900+Math.random()*1700);
    }
  },
  tone(f,t,dur,type='sine',vol=.22){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t+dur+.05);
  },
  success(){ if(!this.init())return; const t=this.ctx.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.09,.4,'triangle',.2)); },
  wrong(){ if(!this.init())return; const t=this.ctx.currentTime; this.tone(392,t,.22,'sine',.18); this.tone(311,t+.16,.35,'sine',.18); },
  tick(){ if(!this.init())return; this.tone(1300,this.ctx.currentTime,.05,'square',.04); },
  pop(){ if(!this.init())return; const t=this.ctx.currentTime; this.tone(660,t,.08,'sine',.15); this.tone(990,t+.05,.1,'sine',.12); },
  chime(){ if(!this.init())return; const t=this.ctx.currentTime; [784,988,1175,1568].forEach((f,i)=>this.tone(f,t+i*.12,.6,'sine',.18)); }
};

const timerHTML = (sec)=>`<div class="timer" data-sec="${sec}"><span>⏱️</span><span class="t-val">${fmt(sec)}</span><button class="t-btn" data-t="go" title="تشغيل/إيقاف">▶</button><button class="t-btn alt" data-t="reset" title="إعادة">↺</button></div>`;
function initTimers(root){
  $$('.timer',root).forEach(t=>{
    const total=+t.dataset.sec; let left=total, id=null;
    const val=$('.t-val',t), go=$('[data-t=go]',t);
    const render=()=>{ val.textContent=fmt(left); t.style.setProperty('--p',left/total); t.classList.toggle('urgent',left<=5&&left>0&&!!id); t.classList.toggle('done',left===0); };
    const stop=()=>{ clearInterval(id); id=null; go.textContent='▶'; render(); };
    go.onclick=()=>{
      Sound.init();
      if(id){ stop(); return; }
      if(left===0) left=total;
      go.textContent='⏸';
      t.dispatchEvent(new CustomEvent('timerstart',{bubbles:true}));
      id=setInterval(()=>{
        left--; render();
        if(left<=5&&left>0) Sound.tick();
        if(left<=0){ stop(); Sound.chime(); t.dispatchEvent(new CustomEvent('timeup',{bubbles:true})); }
      },1000);
    };
    $('[data-t=reset]',t).onclick=()=>{ stop(); left=total; render(); };
    t.reset=()=>{ stop(); left=total; render(); };
    render();
  });
}

/* حالة التحضير لكل طالبة: '' لم تُحضّر | 'present' | 'absent' | 'late' */
const Attend = { status: CONFIG.students.map(()=>'') };
const Draw = {
  drawn:new Set(), noRepeat:true, busy:false,
  pool(){
    const all=CONFIG.students.map((_,i)=>i).filter(i=>Attend.status[i]!=='absent');
    let p=this.noRepeat ? all.filter(i=>!this.drawn.has(i)) : all;
    if(!p.length){ this.drawn.clear(); p=all; }
    if(!p.length) p=CONFIG.students.map((_,i)=>i);
    return p;
  },
  run(onTick,onDone){
    if(this.busy || !CONFIG.students.length) return; this.busy=true; Sound.init();
    const pool=this.pool(), win=pool[Math.floor(Math.random()*pool.length)];
    let step=0, delay=50, last=-1; const steps=20;
    const next=()=>{
      step++;
      let pick;
      if(step>=steps) pick=win;
      else { const src=pool; do{ pick=src[Math.floor(Math.random()*src.length)]; }while(src.length>1&&pick===last); }
      last=pick; onTick(pick); Sound.tick();
      if(step<steps){ delay*=1.1; setTimeout(next,delay); }
      else { this.drawn.add(win); this.busy=false; celebrate(); onDone(win); refreshDrawUI(); }
    };
    next();
  },
  reset(){ this.drawn.clear(); refreshDrawUI(); }
};
function refreshDrawUI(){
  const avail = CONFIG.students.map((_,i)=>i).filter(i=>Attend.status[i]!=='absent');
  const left = Draw.noRepeat ? avail.filter(i=>!Draw.drawn.has(i)).length : avail.length;
  $$('.leftCount').forEach(e=>e.textContent=left);
  $$('[data-role=norepeat]').forEach(c=>c.checked=Draw.noRepeat);
  $$('.r-card').forEach(c=>{ const i=+c.dataset.i; c.classList.toggle('done',Draw.drawn.has(i)&&Attend.status[i]!=='absent'); c.classList.toggle('absent',Attend.status[i]==='absent'); });
}

function closeDraw(){ if(!Draw.busy) modal.classList.remove('open'); }

    html:d=>`${head(d)}

      </div>`,
    init:(el,d)=>{
      const pool=$('.pool',el), pts=$('.pts',el), fb=$('.feedback',el), timer=$('.timer',el);
      let sel=null, score=0;
      const build=()=>{
        score=0; pts.textContent=0; fb.innerHTML=''; sel=null;
        $$('.bucket .in',el).forEach(b=>b.innerHTML='');
        pool.innerHTML=shuffle(d.items).map(it=>`<button class="item" data-k="${it.key}">${it.text}</button>`).join('');
        $$('.item',pool).forEach(b=>b.onclick=()=>{ $$('.item',pool).forEach(x=>x.classList.remove('sel')); sel=b; b.classList.add('sel'); Sound.tick(); });
      };
      $$('.bucket',el).forEach(bk=>bk.onclick=()=>{
        if(!sel){ fb.innerHTML='<span class="no">👆 اختاري بطاقة أولًا</span>'; return; }
        if(sel.dataset.k===bk.dataset.k){
          const s=document.createElement('span'); s.textContent=sel.textContent; $('.in',bk).appendChild(s);
          sel.remove(); sel=null; score++; pts.textContent=score; Sound.success();
          feedback(fb,true,'أحسنتِ! 👏 تصنيف صحيح');
          if(score===d.items.length){ fb.innerHTML='<span class="ok">🏆 رائع! صنّفتِ كل البيانات بنجاح</span>'; timer.reset&&timer.reset(); celebrate(); FX.claps(14); }
        } else { shakeEl(sel); shakeEl(bk); feedback(fb,false); Sound.wrong(); }
      });
      el.addEventListener('timeup',()=>{ fb.innerHTML=`<span class="no">⏰ انتهى الوقت! النتيجة: ${score} من ${d.items.length}</span>`; });
      $('[data-role=restart]',el).onclick=()=>{ build(); timer.reset&&timer.reset(); };
      build();
    }
  },

        </div>
      </div>`,
    init:(el)=>{
      const grid=$('.db-grid',el), input=$('.db-search',el), info=$('.db-info',el);
      const flipMove=(order)=>{
        const cards=[...grid.children], first=new Map(cards.map(c=>[c,c.getBoundingClientRect()]));
        order(cards).forEach(c=>grid.appendChild(c));
        cards.forEach(c=>{
          const l=c.getBoundingClientRect(), f=first.get(c), dx=(f.left-l.left)/S, dy=(f.top-l.top)/S;
          if(!dx&&!dy) return;
          c.style.transition='none'; c.style.transform=`translate(${dx}px,${dy}px)`;
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.transition='transform .7s cubic-bezier(.2,.8,.2,1),opacity .3s,background .3s'; c.style.transform=''; }));
        });
      };
      $('[data-role=sort]',el).onclick=()=>{ flipMove(c=>c.sort((a,b)=>a.dataset.n.localeCompare(b.dataset.n,'ar'))); Sound.success(); info.textContent='✅ تم الفرز في ثانية!'; };
      $('[data-role=mix]',el).onclick=()=>{ flipMove(c=>shuffle(c)); Sound.pop(); info.textContent='🌀 أصبحت غير مرتبة'; };
      input.addEventListener('input',()=>{
        const q=normAr(input.value); let n=0;
        [...grid.children].forEach(c=>{ const m=q && normAr(c.dataset.n).includes(q); if(m) n++; c.classList.toggle('match',!!m); c.classList.toggle('dim',!!q&&!m); });
        info.textContent = q ? (n ? `⚡ وُجدت ${n} نتيجة فورًا` : '❌ لا توجد نتائج') : 'جرّبي البحث ⚡';
      });
    }
  },

    html:d=>`${head(d)}
      <div class="body">

        <div class="storm-bar stg">
          ${timerHTML(d.seconds)}

          <button class="btn small mint" data-role="add">➕ أضيفي</button>
          <button class="btn small" data-role="hint">💡 فكرة</button>
          <button class="btn small ghost" data-role="clear">↺</button>
        </div>
      </div>`,
    init:(el,d)=>{
      const box=$('.storm',el), svg=$('svg',box), input=$('.storm-input',el);
      const cols=['#7c4dcc','#e9609f','#1fb59c','#f2a91e','#3f8ae0','#e07b2c'];
      let count=0, hintIdx=0;
      const W=1700, H=640, cx=W/2, cy=H/2;
      const spots=[[0,-1],[.62,-.78],[.95,-.2],[.9,.45],[.5,.88],[-.5,.88],[-.9,.45],[-.95,-.2],[-.62,-.78],[.25,-.98],[-.25,-.98],[0,.98]];
      const add=(text)=>{
        if(!text||count>=spots.length) return;
        const [ux,uy]=spots[count], x=cx+ux*640, y=cy+uy*250, c=cols[count%cols.length];
        const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',cx); ln.setAttribute('y1',cy); ln.setAttribute('x2',x); ln.setAttribute('y2',y); svg.appendChild(ln);
        const b=document.createElement('div'); b.className='idea'; b.style.left=x+'px'; b.style.top=y+'px'; b.style.setProperty('--c',c); b.textContent=text;
        box.appendChild(b); count++; Sound.pop();
      };
      $('[data-role=add]',el).onclick=()=>{ add(input.value.trim()); input.value=''; input.focus(); };
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ add(input.value.trim()); input.value=''; } });
      $('[data-role=hint]',el).onclick=()=>{ if(hintIdx<d.ideas.length) add(d.ideas[hintIdx++]); };
      $('[data-role=clear]',el).onclick=()=>{ $$('.idea',box).forEach(x=>x.remove()); svg.innerHTML=''; count=0; hintIdx=0; };
    }
  },

   🗃️ بيانات الكتاب (نفس جداول محاكي أكسس: الطلبة والمواد والدرجات)
   ===================================================================== */
const ACC = {
  tables:{
    'بيانات الطلبة':{ fields:['رقم الطالب','الاسم','اسم العائلة','العنوان الوطني','الصف الدراسي','رقم الفصل'],
      rows:[[1,'أحمد','وليد','RBBD**21','الثالث المتوسط',2],[2,'جابر','يحيى','RBBD**32','الثالث المتوسط',3],[3,'خالد','بلال','RBBD**23','الثالث المتوسط',2],
            [4,'فهد','حامد','RBBD**24','الثالث المتوسط',3],[5,'ناصر','سامي','RBBD**18','الثالث المتوسط',2],[6,'أسامة','سعود','RBBD**26','الثالث المتوسط',2],
            [7,'طلال','محمد','RBBD**52','الثالث المتوسط',3],[8,'زياد','عبدالله','RBBD**12','الثالث المتوسط',3]] },
    'المواد الدراسية':{ fields:['رقم المادة','اسم المادة'],
      rows:[[1,'الدراسات الإسلامية'],[2,'اللغة العربية'],[3,'اللغة الإنجليزية'],[4,'الرياضيات']] },
    'درجات الطلبة':{ fields:['رقم الطالب','رقم المادة','الدرجة النهائية'],
      rows:[[1,1,98],[1,2,74],[2,3,99],[2,4,98],[3,1,85],[3,2,98],[4,3,85],[4,4,98],[5,1,99],[5,4,98],[6,1,62],[6,2,99],[7,2,98],[7,3,99],[8,1,98],[8,2,99]] }
  },
  /* العلاقات بين الجداول: [جدول, حقل, جدول, حقل] */
  rels:[['بيانات الطلبة','رقم الطالب','درجات الطلبة','رقم الطالب'],['المواد الدراسية','رقم المادة','درجات الطلبة','رقم المادة']]
};
const escH = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmpV = (a,b) => typeof a==='number'&&typeof b==='number' ? a-b : String(a).localeCompare(String(b),'ar');
const sameList = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
const normCrit = s => String(s||'').replace(/\s+/g,'').replace(/"/g,'');

/* معيار مثل: <95 أو >=90 أو "الرياضيات" */
function accCrit(s){
  s=String(s||'').trim(); if(!s) return null;
  const m=s.match(/^(<=|>=|<>|<|>|=)?\s*"?(.*?)"?$/), op=m[1]||'=', v=m[2], num=v!==''&&!isNaN(v);
  return x=>{ const a=num?Number(x):String(x), b=num?Number(v):v;
    return op==='<'?a<b : op==='>'?a>b : op==='<='?a<=b : op==='>='?a>=b : op==='<>'?a!=b : a==b; };
}
/* تشغيل استعلام: q = { tables:[...], cols:[{t,f,sort:'asc'|'desc'|'',show,crit}] } */
function accRun(q){
  let rows=[{}];
  q.tables.forEach(t=>{ const T=ACC.tables[t], nx=[];
    rows.forEach(r=>T.rows.forEach(v=>{ const o={...r}; T.fields.forEach((f,i)=>o[t+'|'+f]=v[i]); nx.push(o); })); rows=nx; });
  ACC.rels.forEach(([a,fa,b,fb])=>{ if(q.tables.includes(a)&&q.tables.includes(b)) rows=rows.filter(r=>r[a+'|'+fa]===r[b+'|'+fb]); });
  q.cols.forEach(c=>{ const m=accCrit(c.crit); if(m) rows=rows.filter(r=>m(r[c.t+'|'+c.f])); });
  const sorts=q.cols.filter(c=>c.sort);
  if(sorts.length) rows.sort((x,y)=>{ for(const c of sorts){ const k=c.t+'|'+c.f, d=cmpV(x[k],y[k]); if(d) return c.sort==='desc'?-d:d; } return 0; });
  const shown=q.cols.filter(c=>c.show);
  return { cols:shown, rows:rows.map(r=>shown.map(c=>r[c.t+'|'+c.f])) };
}
