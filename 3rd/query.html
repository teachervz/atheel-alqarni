          if(row==='s') return `<td><select data-q="sort" data-i="${i}"><option value=""${!c.sort?' selected':''}></option><option value="asc"${c.sort==='asc'?' selected':''}>تصاعدي</option><option value="desc"${c.sort==='desc'?' selected':''}>تنازلي</option></select></td>`;
          if(row==='v') return `<td><input type="checkbox" data-q="show" data-i="${i}"${c.show?' checked':''}></td>`;
          return `<td><input class="crit" dir="ltr" data-q="crit" data-i="${i}" value="${escH(c.crit)}"></td>`;
        };
        const rows=[['f','الحقل:'],['t','الجدول:'],['s','فرز:'],['v','إظهار:'],['c','المعايير:']];
        const pane=st.pane?`<div class="ax-pane"><div class="ax-ph"><b>إضافة جداول</b><button data-q="paneclose">✕</button></div>
          <div class="ax-pt"><span class="on">جداول</span><span>ارتباطات</span><span>استعلامات</span><span>الكل</span></div>
          <div class="ax-pl">${Object.keys(ACC.tables).map(t=>`<div class="ax-pi${st.paneSel.includes(t)?' sel':''}" data-q="psel" data-t="${t}">▦ ${t}</div>`).join('')}</div>
          <button class="ax-pb" data-q="padd">إضافة الجداول المحددة</button></div>`:'';
        return `<div class="ax-design"><div class="ax-top">${boxes||'<div class="ax-empty">أضيفي جدولًا من لوحة «إضافة جداول» ←</div>'}</div>
          <div class="ax-grid"><table>${rows.map(([k,l])=>`<tr><th>${l}</th>${cols.map((c,i)=>cell(c,i,k)).join('')}</tr>`).join('')}</table></div>${pane}</div>`;
      };
      const datasheet=()=>{
        const r=st.last;
        return `<div class="ax-ds scroll"><table><thead><tr><th class="sel"></th>${r.cols.map(c=>`<th>${c.f} ▾</th>`).join('')}</tr></thead>
          <tbody>${r.rows.map(row=>`<tr><td class="sel"></td>${row.map(v=>`<td class="${typeof v==='number'?'num':''}">${escH(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="ax-rec">السجل: ⏮ ◀ 1 من ${r.rows.length} ▶ ⏭</div>`;
      };
      const doc=()=>{
        if(st.view==='home') return `<div class="ax-blank">💡 من تبويب <b>إنشاء</b> اضغطي <b>تصميم الاستعلام</b></div>`;
        const menu=st.menu==='tab'?`<div class="ax-menu" style="top:46px;right:10px"><div data-q="save">💾 حفظ <small>Save</small></div><div data-q="close">✕ إغلاق <small>Close</small></div></div>`:'';
        return `<div class="ax-dt"><span class="ax-tab" data-q="tabmenu">🔎 ${escH(qName())}</span><small class="ax-tip">👈 اضغطي بزر الفأرة الأيمن على التبويب للحفظ</small></div>${menu}
          <div class="ax-dc">${st.view==='design'?design():datasheet()}</div>`;
      };
      const dialog=()=>st.dialog?`<div class="ax-dlgw"><div class="ax-dlg"><div class="ax-dh">حفظ باسم</div>
          <label>اسم الاستعلام:</label><input class="ax-name" value="${escH(st.dialog)}">
          <div class="ax-df"><button data-q="ok">موافق</button><button data-q="cancel">إلغاء الأمر</button></div></div></div>`:'';
      const navMenu=()=>st.menu&&st.menu.nav?`<div class="ax-menu" style="top:${st.menu.y}px;right:${st.menu.x}px"><div data-q="openq">▦ فتح <small>Open</small></div><div data-q="designq">📐 عرض التصميم <small>Design View</small></div></div>`:'';
      const paint=()=>{
        ax.innerHTML=`<div class="ax-title"><span>قاعدة بيانات الطلبة : قاعدة بيانات</span><i>— ☐ ✕</i></div>${tabs()}${ribbon()}
          <div class="ax-main">${nav()}<div class="ax-doc">${doc()}</div></div>${dialog()}${navMenu()}`;
        const inp=$('.ax-name',ax); if(inp){ inp.focus(); inp.select(); }
      };
      const run=()=>{
        if(!st.q.cols.length){ ui.say('👆 أضيفي حقولًا بالضغط المزدوج عليها أولًا','no'); return; }
        st.last=accRun(st.q); st.view='ds'; st.menu=null; paint(); Sound.success();
        let advanced=false;
        while(st.mi<d.missions.length && okRun(d.missions[st.mi])){ doneMission(); advanced=true; }
        if(!advanced && d.missions[st.mi] && d.missions[st.mi].need) ui.say('🤔 النتيجة لا تطابق المهمة بعد… راجعي الحقول والفرز والمعايير','no');
      };
      const save=name=>{
        name=name.trim(); if(!name) return;
        st.q.name=name; st.saved[name]=JSON.parse(JSON.stringify(st.q)); st.dialog=null; st.menu=null; paint(); Sound.success();
        const m=d.missions[st.mi];
        if(m&&m.save){ if(name===m.save) doneMission(); else ui.say(`✏️ اسم الاستعلام المطلوب: <b>${m.save}</b>`,'no'); }
      };
      ax.addEventListener('click',e=>{
        const b=e.target.closest('[data-q]');
        if(!e.target.closest('.ax-menu')&&st.menu&&!(b&&['tabmenu','navq'].includes(b.dataset.q))){ st.menu=null; paint(); }
        if(!b) return;
        const a=b.dataset.q;
        if(a==='new'){ st.q=newQ(); st.view='design'; st.pane=true; st.paneSel=[]; Sound.pop(); paint(); }
        else if(a==='pane'){ st.pane=true; st.paneSel=[]; paint(); }
        else if(a==='paneclose'){ st.pane=false; paint(); }
        else if(a==='psel'){ const t=b.dataset.t; st.paneSel=st.paneSel.includes(t)?st.paneSel.filter(x=>x!==t):[...st.paneSel,t]; Sound.tick(); paint(); }
        else if(a==='padd'){ st.paneSel.forEach(t=>{ if(!st.q.tables.includes(t)) st.q.tables.push(t); }); st.paneSel=[]; Sound.pop(); paint(); }
        else if(a==='rmcol'){ st.q.cols.splice(+b.dataset.i,1); paint(); }
        else if(a==='run') run();
        else if(a==='ds'){ if(st.q.cols.length) run(); }
        else if(a==='design'){ st.view='design'; st.pane=false; paint(); }
        else if(a==='tabmenu'){ st.menu=st.menu==='tab'?null:'tab'; paint(); }
        else if(a==='save'){ st.menu=null; st.dialog=st.q.name||'استعلام1'; paint(); }
        else if(a==='close'){ st.view='home'; st.q=null; st.menu=null; paint(); }
        else if(a==='ok') save($('.ax-name',ax).value);
        else if(a==='cancel'){ st.dialog=null; paint(); }
        else if(a==='navq'){ const r=b.getBoundingClientRect(), base=ax.getBoundingClientRect();
          st.menu={nav:b.dataset.n, x:(base.right-r.right)/S+20, y:(r.bottom-base.top)/S}; paint(); }
        else if(a==='openq'||a==='designq'){ st.q=JSON.parse(JSON.stringify(st.saved[st.menu.nav])); st.menu=null; st.pane=false;
          if(a==='openq') run(); else { st.view='design'; paint(); } }
      });
      ax.addEventListener('dblclick',e=>{
        const f=e.target.closest('[data-q=fld]'); if(!f) return;
        st.q.cols.push({ t:f.dataset.t, f:f.dataset.f, sort:'', show:true, crit:'' }); Sound.pop(); paint();
      });
      ax.addEventListener('contextmenu',e=>{
        const b=e.target.closest('[data-q=tabmenu],[data-q=navq]'); if(!b) return;
        e.preventDefault(); b.click();
      });
      ax.addEventListener('change',e=>{
        const t=e.target, i=+t.dataset.i;
        if(t.dataset.q==='sort'){ st.q.cols[i].sort=t.value; Sound.tick(); }
        if(t.dataset.q==='show') st.q.cols[i].show=t.checked;
      });
      ax.addEventListener('input',e=>{ if(e.target.dataset.q==='crit') st.q.cols[+e.target.dataset.i].crit=e.target.value; });
      ax.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.classList.contains('ax-name')) save(e.target.value); });
      $('[data-x=hint]',el).onclick=()=>{ const m=d.missions[st.mi]; ui.say(m?'💡 '+m.hint:'🏆 أنجزتِ كل المهام',''); Sound.pop(); };
      $('[data-x=reset]',el).onclick=()=>{ fresh(); ui.paint(); ui.say('',''); paint(); };
      fresh(); ui.paint(); paint();
    }
  },

  /* =====================================================================
     📊 محاكي معالج التقارير (Report Wizard) + طريقة عرض التخطيط
     ===================================================================== */
  rwizard:{
    html:d=>`${head(d)}
      <div class="body"><div class="qs">
        <div class="ax"></div>
        <div class="ms card stg"><div class="ms-h">✅ المطلوب في التقرير</div>
          <ol class="ms-list rq scroll">${d.req.map((r,i)=>`<li data-k="${r.k}"><i>${i+1}</i><span>${r.text}</span></li>`).join('')}</ol>
          <div class="ms-msg"></div>
          <div class="ms-tools"><button class="btn small sun" data-x="hint">💡 تلميح</button><button class="btn small ghost" data-x="reset">↺ من جديد</button></div>
        </div>
      </div></div>`,
    init:(el,d)=>{
      const ax=$('.ax',el), msg=$('.ms-msg',el);
      const LAY={ stepped:'متدرج', block:'كتلة', outline:'مخطط تفصيلي' };
      let st;
      const fresh=()=>{ st={ page:0, src:'بيانات الطلبة', sel:[], groups:[], sorts:[0,1,2,3].map(()=>({f:'',dir:'asc'})), layout:'stepped', orient:'portrait',
        title:'', pick:null, finished:false, layoutView:false, focus:null, del:[], bold:[], celebrated:false, saved:[] }; };
      const fields=()=>ACC.tables[st.src].fields;
      const say=(h,c)=>{ msg.className='ms-msg '+(c||''); msg.innerHTML=h; };
      /* فحص المطلوب */
      const checks={
        fields:()=>st.src==='بيانات الطلبة'&&st.sel.length===5&&['الاسم','اسم العائلة','العنوان الوطني','الصف الدراسي','رقم الفصل'].every(f=>st.sel.includes(f)),
        groups:()=>sameList(st.groups,['رقم الفصل','الاسم']),
        sort:()=>st.sorts[0].f==='العنوان الوطني',
        layout:()=>st.layout==='outline'&&st.page>=4,
        title:()=>st.finished&&st.title.trim()==='بيانات الطلبة',
        edit:()=>st.del.length>0&&st.bold.length>0
      };
      const paintReq=()=>{
        $$('.ms-list li',el).forEach(li=>li.classList.toggle('done',!!checks[li.dataset.k]()));
        const main=['fields','groups','sort','layout','title'].every(k=>checks[k]());
        if(st.finished&&main&&!st.celebrated){ st.celebrated=true; celebrate(); FX.claps(12); say('🎉 تقريرك الأول جاهز! جرّبي الآن <b>طريقة عرض التخطيط</b> لتعديله','ok'); }
        if(checks.edit()&&!st.saved.includes('edit')){ st.saved.push('edit'); celebrate(); say('🏆 رائع! عدّلتِ التقرير بنجاح','ok'); }
      };
      /* ترتيب سجلات التقرير: التجميع أولًا ثم الفرز */
      const reportRows=()=>{
        const T=ACC.tables[st.src], idx=f=>T.fields.indexOf(f);
        const keys=[...st.groups.map(f=>({f,dir:'asc'})),...st.sorts.filter(s=>s.f)];
        return [...T.rows].sort((a,b)=>{ for(const k of keys){ const x=cmpV(a[idx(k.f)],b[idx(k.f)]); if(x) return k.dir==='desc'?-x:x; } return 0; })
          .map(r=>Object.fromEntries(T.fields.map((f,i)=>[f,r[i]])));
      };
      const lbl=f=>st.del.includes('lbl|'+f)?'':`<span class="rp-l${st.bold.includes('lbl|'+f)?' b':''}${st.focus==='lbl|'+f?' foc':''}" data-r="lbl|${f}">${f}</span>`;
      const val=(f,v)=>`<span class="rp-v${st.bold.includes('val|'+f)?' b':''}${st.focus==='val|'+f?' foc':''}" data-r="val|${f}">${escH(v)}</span>`;
      const report=()=>{
        const rows=reportRows(), det=st.sel.filter(f=>!st.groups.includes(f));
        const title=st.del.includes('title')?'':`<h2 class="rp-title${st.bold.includes('title')?' b':''}${st.focus==='title'?' foc':''}" data-r="title">${escH(st.title||st.src)}</h2>`;
        let body='';
        if(st.layout==='outline'){
          const lvl=(list,g)=>{
            if(g>=st.groups.length) return `<table class="rp-t"><thead><tr>${det.map(f=>`<th>${lbl(f)}</th>`).join('')}</tr></thead><tbody>${list.map(r=>`<tr>${det.map(f=>`<td>${val(f,r[f])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
            const f=st.groups[g], vals=[...new Set(list.map(r=>r[f]))];
            return vals.map(v=>`<div class="rp-g g${g}"><div class="rp-gh">${lbl(f)} ${val(f,v)}</div>${lvl(list.filter(r=>r[f]===v),g+1)}</div>`).join('');
          };
          body=lvl(rows,0);
        } else {
          const all=[...st.groups,...det]; let prev={};
          body=`<table class="rp-t ${st.layout}"><thead><tr>${all.map(f=>`<th>${lbl(f)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{
            let changed=false;
            const tds=all.map(f=>{ const g=st.groups.includes(f); if(g&&!changed&&prev[f]===r[f]) return '<td></td>'; if(g) changed=true; return `<td>${val(f,r[f])}</td>`; }).join('');
            prev=r; return `<tr>${tds}</tr>`; }).join('')}</tbody></table>`;
        }
        return `<div class="rp-bar"><button class="ax-b${st.layoutView?' on':''}" data-w="lv">✏️ طريقة عرض التخطيط <small>Layout View</small></button>
            ${st.layoutView?`<button class="ax-b" data-w="del">🗑️ حذف <small>Delete</small></button><button class="ax-b" data-w="bold"><b>B</b> غامق <small>Bold</small></button><span class="rp-hint">👆 اضغطي على عنصر في التقرير لتحديده</span>`:''}</div>
          <div class="rp scroll${st.layoutView?' lv':''} ${st.orient}"><div class="rp-page">${title}${body}
            <div class="rp-foot"><span>${new Date().toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'})}</span><span>صفحة 1 من 1</span></div></div></div>`;
      };
      const list=(items,cls,pickKind)=>`<div class="wz-list ${cls}">${items.map(f=>`<div class="wz-it${st.pick&&st.pick.k===pickKind&&st.pick.f===f?' sel':''}" data-w="pick" data-k="${pickKind}" data-f="${f}">${f}</div>`).join('')}</div>`;
      const pageHTML=()=>{
        const p=st.page;
        if(p===1){ const av=fields().filter(f=>!st.sel.includes(f));
          return `<b class="wz-q">ما هي الحقول التي تريدها في التقرير؟</b><div class="wz-s">يمكنك الاختيار من أكثر من جدول أو استعلام.</div>
            <label class="wz-lab">جداول/استعلامات</label><select class="wz-src" data-w="src">${Object.keys(ACC.tables).map(t=>`<option${t===st.src?' selected':''}>الجدول: ${t}</option>`).join('')}</select>
            <div class="wz-two"><div><label class="wz-lab">الحقول المتوفرة:</label>${list(av,'','av')}</div>
              <div class="wz-mv"><button data-w="one">&gt;</button><button data-w="all">&gt;&gt;</button><button data-w="back">&lt;</button><button data-w="none">&lt;&lt;</button></div>
              <div><label class="wz-lab">الحقول المحددة:</label>${list(st.sel,'','sel')}</div></div>`; }
        if(p===2){ const av=st.sel.filter(f=>!st.groups.includes(f)), det=st.sel.filter(f=>!st.groups.includes(f));
          return `<b class="wz-q">هل تريد إضافة أي مستويات تجميع؟</b>
            <div class="wz-two"><div>${list(av,'','gav')}</div>
              <div class="wz-mv"><button data-w="gadd">&gt;</button><button data-w="grm">&lt;</button><span class="wz-pr">الأولوية</span><button data-w="gup">▲</button><button data-w="gdn">▼</button></div>
              <div class="wz-prev">${st.groups.map((g,i)=>`<div class="wz-gp${st.pick&&st.pick.k==='g'&&st.pick.f===g?' sel':''}" style="margin-right:${i*26}px" data-w="pick" data-k="g" data-f="${g}">${g}</div>`).join('')}<div class="wz-det" style="margin-right:${st.groups.length*26}px">${det.join('، ')||'—'}</div></div></div>`; }
        if(p===3){ const opts=st.sel.filter(f=>!st.groups.includes(f));
          return `<b class="wz-q">ما ترتيب الفرز الذي تريده لسجلات التفاصيل؟</b><div class="wz-s">يمكنك فرز السجلات حسب ما يصل إلى أربعة حقول، بترتيب تصاعدي أو تنازلي.</div>
            <div class="wz-sorts">${st.sorts.map((s,i)=>`<div class="wz-sr"><i>${i+1}</i><select data-w="sortf" data-i="${i}"><option value=""></option>${opts.map(f=>`<option${s.f===f?' selected':''}>${f}</option>`).join('')}</select>
              <button data-w="sortd" data-i="${i}">${s.dir==='asc'?'تصاعدي ⬆':'تنازلي ⬇'}</button></div>`).join('')}</div>`; }
        if(p===4) return `<b class="wz-q">كيف تريد تخطيط التقرير؟</b>
            <div class="wz-two lay"><div class="wz-radio"><div class="wz-lab">التخطيط</div>${Object.entries(LAY).map(([k,v])=>`<label><input type="radio" name="lay" data-w="lay" value="${k}"${st.layout===k?' checked':''}> ${v} <small>${{stepped:'Stepped',block:'Block',outline:'Outline'}[k]}</small></label>`).join('')}</div>
              <div class="wz-radio"><div class="wz-lab">الاتجاه</div><label><input type="radio" name="ori" data-w="ori" value="portrait"${st.orient==='portrait'?' checked':''}> عمودي</label><label><input type="radio" name="ori" data-w="ori" value="landscape"${st.orient==='landscape'?' checked':''}> أفقي</label></div>
              <div class="wz-mini ${st.layout}"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>`;
        return `<b class="wz-q">ما العنوان الذي تريده للتقرير؟</b>
            <input class="wz-title" data-w="title" value="${escH(st.title)}">
            <div class="wz-s">هذه كل المعلومات التي يحتاجها المعالج لإنشاء التقرير. هل تريد معاينة التقرير أو تعديل تصميمه؟</div>
            <label><input type="radio" checked> معاينة التقرير</label>`;
      };
      const paint=()=>{
        let doc;
        if(st.page===0) doc=`<div class="ax-blank">💡 من تبويب <b>إنشاء</b> ← مجموعة <b>تقارير</b> اضغطي <b>معالج التقارير</b></div>`;
        else if(st.page===6) doc=`<div class="ax-dt"><span class="ax-tab">📊 ${escH(st.title||st.src)}</span></div><div class="ax-dc">${report()}</div>`;
        else doc=`<div class="ax-dlgw wz"><div class="ax-dlg wz-box"><div class="ax-dh">معالج التقارير <small>Report Wizard</small></div>
            <div class="wz-body">${pageHTML()}</div>
            <div class="ax-df"><button data-w="cancel">إلغاء الأمر</button><button data-w="prev"${st.page===1?' disabled':''}>&lt; السابق</button><button data-w="next"${st.page===5?' disabled':''}>التالي &gt;</button><button class="pri" data-w="finish">إنهاء</button></div></div></div>`;
        const rib=st.page===6?`<div class="ax-rib"><button class="ax-b big" data-w="close"><span>✕</span>إغلاق المعاينة<small>Close</small></button><span class="ax-g">معاينة قبل الطباعة</span></div>`
          :`<div class="ax-rib"><button class="ax-b big off"><span>▦</span>جدول</button><span class="ax-g">جداول</span><button class="ax-b big off"><span>📐</span>تصميم الاستعلام</button><span class="ax-g">استعلامات</span>
            <button class="ax-b big" data-w="auto"><span>📄</span>تقرير<small>AutoReport</small></button><button class="ax-b big off"><span>📐</span>تصميم التقرير</button>
            <button class="ax-b big" data-w="wizard"><span>🪄</span>معالج التقارير<small>Report Wizard</small></button><span class="ax-g">تقارير</span></div>`;
        ax.innerHTML=`<div class="ax-title"><span>قاعدة بيانات الطلبة : قاعدة بيانات</span><i>— ☐ ✕</i></div>
          <div class="ax-tabs"><span class="file">ملف</span><span>الشريط الرئيسي</span><span class="on">إنشاء</span><span>بيانات خارجية</span><span>أدوات قاعدة البيانات</span></div>${rib}
          <div class="ax-main"><div class="ax-nav"><div class="ax-nh">كافة عناصر Access</div><div class="ax-ng">جداول</div>${Object.keys(ACC.tables).map(t=>`<div class="ax-ni">▦ ${t}</div>`).join('')}
            ${st.finished?`<div class="ax-ng">تقارير</div><div class="ax-ni q">📊 ${escH(st.title||st.src)}</div>`:''}</div><div class="ax-doc">${doc}</div></div>`;
        paintReq();
      };
      const move=(k)=>{ const p=st.pick; st.pick=null; return p&&p.k===k?p.f:null; };
      ax.addEventListener('click',e=>{
        const b=e.target.closest('[data-w]'), r=e.target.closest('[data-r]');
        if(st.page===6&&st.layoutView&&r){ st.focus=r.dataset.r; Sound.tick(); paint(); return; }
        if(!b) return;
        const a=b.dataset.w;
        if(a==='wizard'){ st.page=1; Sound.pop(); }
        else if(a==='auto'){ say('⚡ <b>التقرير التلقائي</b> ينشئ تقريرًا بكل الحقول مباشرة… في هذا النشاط نستخدم <b>معالج التقارير</b> لنتحكم بالتفاصيل','no'); return; }
        else if(a==='cancel'){ fresh(); }
        else if(a==='pick'){ st.pick={k:b.dataset.k,f:b.dataset.f}; Sound.tick(); }
        else if(a==='one'){ const f=move('av'); if(f) st.sel.push(f); else if(!st.pick){ say('👆 اختاري حقلًا من الحقول المتوفرة أولًا','no'); return; } }
        else if(a==='all'){ fields().forEach(f=>{ if(!st.sel.includes(f)) st.sel.push(f); }); st.pick=null; }
        else if(a==='back'){ const f=move('sel'); if(f){ st.sel=st.sel.filter(x=>x!==f); st.groups=st.groups.filter(x=>x!==f); } }
        else if(a==='none'){ st.sel=[]; st.groups=[]; st.pick=null; }
        else if(a==='gadd'){ const f=move('gav'); if(f&&st.groups.length<4) st.groups.push(f); }
        else if(a==='grm'){ const f=move('g'); if(f) st.groups=st.groups.filter(x=>x!==f); }
        else if(a==='gup'||a==='gdn'){ const f=st.pick&&st.pick.k==='g'&&st.pick.f, i=st.groups.indexOf(f), j=a==='gup'?i-1:i+1;
          if(i>=0&&j>=0&&j<st.groups.length){ [st.groups[i],st.groups[j]]=[st.groups[j],st.groups[i]]; } }
        else if(a==='sortd'){ const s=st.sorts[+b.dataset.i]; s.dir=s.dir==='asc'?'desc':'asc'; }
        else if(a==='prev'){ st.page=Math.max(1,st.page-1); st.pick=null; }
        else if(a==='next'||a==='finish'){
          if(st.page===1&&!st.sel.length){ say('👆 انقلي حقلًا واحدًا على الأقل إلى «الحقول المحددة»','no'); return; }
          if(a==='finish'){ if(!st.title) st.title=st.src; st.page=6; st.finished=true; Sound.success(); }
          else { st.page++; if(st.page===5&&!st.title) st.title=st.src; }
          st.pick=null;
        }
        else if(a==='close'){ st.page=0; st.layoutView=false; st.focus=null; }
        else if(a==='lv'){ st.layoutView=!st.layoutView; st.focus=null; }
        else if(a==='del'||a==='bold'){ if(!st.focus){ say('👆 اضغطي على عنصر في التقرير لتحديده أولًا','no'); return; }
          const L=a==='del'?st.del:st.bold, i=L.indexOf(st.focus); if(i<0) L.push(st.focus); else if(a==='bold') L.splice(i,1);
          if(a==='del') st.focus=null; Sound.pop(); }
        else return;
        paint();
      });
      ax.addEventListener('dblclick',e=>{ const b=e.target.closest('[data-w=pick]'); if(!b) return;
        st.pick={k:b.dataset.k,f:b.dataset.f}; $(`[data-w=${b.dataset.k==='av'?'one':b.dataset.k==='sel'?'back':b.dataset.k==='gav'?'gadd':'grm'}]`,ax).click(); });
      ax.addEventListener('change',e=>{
        const t=e.target, a=t.dataset.w;
        if(a==='src'){ st.src=t.value.replace('الجدول: ',''); st.sel=[]; st.groups=[]; st.sorts.forEach(s=>s.f=''); }
        if(a==='sortf') st.sorts[+t.dataset.i].f=t.value;
        if(a==='lay') st.layout=t.value;
        if(a==='ori') st.orient=t.value;
        if(a!=='title') paint();
      });
      ax.addEventListener('input',e=>{ if(e.target.dataset.w==='title') st.title=e.target.value; });
      document.addEventListener('keydown',e=>{
        if(!el.classList.contains('active')||st.page!==6||!st.layoutView||!st.focus) return;
        if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); e.stopImmediatePropagation(); $('[data-w=del]',ax).click(); }
      },true);
      $('[data-x=hint]',el).onclick=()=>{
        const k=['fields','groups','sort','layout','title','edit'].find(k=>!checks[k]()), r=d.req.find(r=>r.k===k);
        say(r?'💡 '+r.hint:'🏆 أنجزتِ كل المطلوب',''); Sound.pop();
      };
      $('[data-x=reset]',el).onclick=()=>{ fresh(); say('',''); paint(); };
      fresh(); paint();
    }
  }
});

/* =====================================================================
   🏫 اختيار الفصل (يُحفظ في المتصفح، ويمكن التبديل من شريحة الترحيب أو التحضير)
   ===================================================================== */
(function pickClass(){
  CONFIG.classes = Roster.load(LESSON_GRADE);
  if(!Object.keys(CONFIG.classes).length) CONFIG.classes = { [LESSON_GRADE]: [] };
  let saved=null; try{ saved=localStorage.getItem('db-lesson-class'); }catch(e){}
  if(saved && CONFIG.classes[saved]) CONFIG.lesson.className=saved;
  if(!CONFIG.classes[CONFIG.lesson.className]) CONFIG.lesson.className=Object.keys(CONFIG.classes)[0];
  CONFIG.students=CONFIG.classes[CONFIG.lesson.className];
  Attend.status=CONFIG.students.map(()=>'');
})();
function classSwitchHTML(){
  return `<div class="cls-switch">${Object.keys(CONFIG.classes).map(c=>`<button class="${c===CONFIG.lesson.className?'on':''}" data-act="set-class" data-c="${c}">🏫 ${c}</button>`).join('')}</div>`;
}
function fillTokens(html){
  const first=i=>(CONFIG.students[i]||'طالبة').split(' ')[0];
  return html.replace(/\{CLASS\}/g,CONFIG.lesson.className).replace(/\{S(\d)\}/g,(_,n)=>first(+n-1));
}
document.title=`${CONFIG.lesson.title} – ${CONFIG.lesson.className}`;

/* =====================================================================
   🎬 بناء الشرائح ونظام التنقل
   ===================================================================== */
const host=$('#slides'); let slides=[], cur=0;
CONFIG.slides.forEach((d,i)=>{
  const s=document.createElement('section');
  s.className='slide a-'+(d.anim||'fade'); s.dataset.type=d.type;
  s.innerHTML=fillTokens(R[d.type]?R[d.type].html(d):`<h1 class="s-title">نوع شريحة غير معروف: ${d.type}</h1>`);
  // ترقيم عناصر الظهور المتتابع (بحد أقصى حتى لا يطول الانتظار)
  $$('.stg',s).forEach((e,k)=>e.style.setProperty('--i',Math.min(k,9)));
  host.appendChild(s); slides.push(s);
  if(R[d.type]&&R[d.type].init) R[d.type].init(s,d);
  initTimers(s);
});
$('#cAll').textContent=slides.length;

function go(n){
  if(n<0||n>=slides.length||n===cur) return;
  const old=slides[cur], nw=slides[n], fwd=n>cur;
  old.classList.remove('active','dir-f','dir-b'); old.classList.add('leaving');
  setTimeout(()=>old.classList.remove('leaving'),460);
  nw.classList.remove('leaving','dir-f','dir-b'); void nw.offsetWidth;
  nw.classList.add('active',fwd?'dir-f':'dir-b');
  cur=n; updateUI();
  const d=CONFIG.slides[n]; if(R[d.type]&&R[d.type].enter) R[d.type].enter(nw,d);
  try{ history.replaceState(null,'','#'+(n+1)); }catch(e){}
}
const next=()=>go(cur+1), prev=()=>go(cur-1);
function updateUI(){
  $('#cNow').textContent=cur+1;
  $('#progress').style.width=((cur+1)/slides.length*100)+'%';
  $('#bPrev').disabled=cur===0; $('#bNext').disabled=cur===slides.length-1;
}

/* البدء من الشريحة المحفوظة في الرابط (#رقم) */
(function start(){
  const h=parseInt(location.hash.slice(1)); cur=(h>=1&&h<=slides.length)?h-1:0;
  slides[cur].classList.add('active','dir-f'); updateUI();
})();

/* تكبير المسرح ليملأ الشاشة مع الحفاظ على 16:9 */
function fit(){ S=Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('stage').style.setProperty('--s',S); }
addEventListener('resize',fit); fit();

/* =====================================================================
   🖱️ الأزرار العامة (data-act) — تعمل في أي شريحة
   ===================================================================== */
document.addEventListener('click',e=>{
  Sound.init();
  const b=e.target.closest('[data-act]');
  if(b){
    const act=b.dataset.act, sl=b.closest('.slide');
    if(act==='next') next();
    if(act==='set-class' && b.dataset.c!==CONFIG.lesson.className){
      try{ localStorage.setItem('db-lesson-class',b.dataset.c); }catch(e){}
      location.reload(); return;
    }
    if(act==='clap') clap();
    if(act==='draw') openDraw();
    if(act==='close-draw') closeDraw();
    if(act==='draw-reset') Draw.reset();
    if(act==='modal-draw'){
      const nm=$('#dmName'); nm.classList.remove('go');
      Draw.run(i=>nm.textContent=CONFIG.students[i], ()=>{ void nm.offsetWidth; nm.classList.add('go'); });
    }
    if(act==='reveal'&&sl){
      const hidden=$$('.rv:not(.shown)',sl);
      if(hidden.length){ hidden[0].classList.add('shown'); Sound.pop(); }
      if(hidden.length<=1){ b.disabled=true; if(b.dataset.final==='celebrate') celebrate(); }
    }
  }
  // إزالة التركيز عن الأزرار حتى لا يضغطها زر المسافة لاحقًا
  const btn=e.target.closest('button'); if(btn) setTimeout(()=>btn.blur(),0);
});
document.addEventListener('change',e=>{ if(e.target.matches('[data-role=norepeat]')){ Draw.noRepeat=e.target.checked; refreshDrawUI(); } });
$('#bPrev').onclick=prev; $('#bNext').onclick=next;
$('#bClap').onclick=clap; $('#bAtt').onclick=()=>{ const i=CONFIG.slides.findIndex(x=>x.type==='attendance'); if(i>=0) go(i); }; $('#bDraw').onclick=openDraw;
$('#bFull').onclick=()=>{ const d=document; if(!d.fullscreenElement) d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen().catch(()=>{}); else d.exitFullscreen&&d.exitFullscreen(); };

/* إعادة الأزرار المخفية عند العودة لشريحة (زر الكشف) */
/* (الحالة تبقى محفوظة عمدًا حتى تعود المعلمة لما توقفت عنده) */

/* =====================================================================
   ⌨️ لوحة المفاتيح
   → / Space / PageDown = التالي   |   ← / PageUp = السابق
   ت = تصفيق   |   ق = قرعة   |   Esc = إغلاق القرعة   |   Home/End
   ===================================================================== */
const typing=e=>e.target.matches&&e.target.matches('input,textarea,[contenteditable]');
addEventListener('keydown',e=>{
  if(typing(e)){ if(e.key==='Escape') e.target.blur(); return; }
  const k=e.key;
  if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Spacebar','PageUp','PageDown','Home','End'].includes(k)) e.preventDefault();
  if(modal.classList.contains('open')){
    if(k==='Escape') closeDraw();
    if(k===' '||k==='Enter'||k==='ق'||e.code==='KeyR') $('[data-act=modal-draw]').click();
    return;
  }
  if(k==='ArrowRight'||k===' '||k==='Spacebar'||k==='PageDown') next();
  else if(k==='ArrowLeft'||k==='PageUp') prev();
  else if(k==='Home') go(0);
  else if(k==='End') go(slides.length-1);
  else if(k==='ت'||e.code==='KeyJ'){ Sound.init(); clap(); }
  else if(k==='ق'||e.code==='KeyR') openDraw();
  else if(k==='ح'||e.code==='KeyP') $('#bAtt').click();
},{passive:false});
addEventListener('keyup',e=>{ if(!typing(e)&&(e.key===' '||e.key==='Spacebar')) e.preventDefault(); });
/* منع التمرير بعجلة الماوس أو اللمس */
addEventListener('wheel',e=>{ if(!e.target.closest('.scroll')) e.preventDefault(); },{passive:false});
addEventListener('touchmove',e=>{ if(!e.target.closest('input, .scroll')) e.preventDefault(); },{passive:false});
/* إعادة التحميل إذا عُدّلت الأسماء في لوحة الإدارة أثناء فتح الدرس */
Roster.watch(()=>location.reload());

/* =====================================================================
   👻 إخفاء شريط التحكم تلقائيًا عند عدم تحريك الماوس
   ===================================================================== */
let idleT;
const ctr=$('#controls'), hint=$('#hint');
function wake(){
  ctr.classList.remove('hide'); hint.classList.remove('hide'); document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!ctr.matches(':hover')){ ctr.classList.add('hide'); hint.classList.add('hide'); document.body.classList.add('idle'); } },3000);
}
['mousemove','mousedown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));
wake();
refreshDrawUI();
</script>
